name: Integrate Twelfth Character Mechanics Batch

on:
  push:
    branches: [character-mechanics/twelfth-batch-five]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: character-mechanics/twelfth-batch-five
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Rebuild pinned promotion review
        run: |
          curl -fsSL https://raw.githubusercontent.com/DommyMM/wuwabuild/5fa70b11f1d84fb644e4dbed47873708da0fe66f/public/Data/Characters.json -o /tmp/Characters.json
          BELLIBING_SYNC_DATE=2026-08-29 npm run sync:character-mechanics -- --input /tmp/Characters.json
          npm run review:character-mechanics

      - name: Apply fail-closed integration
        run: python scripts/_integrate_twelfth_batch.py

      - name: Focused Character Mechanics gate
        run: node --experimental-strip-types --test test/twelfthBatchCharacterMechanics.test.ts

      - name: Clean generated review files and lockfile
        run: |
          rm -rf data/generated
          rm -f package-lock.json

      - name: Commit integrated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Integrate five source-reviewed Character Mechanics profiles"
          git push origin HEAD:character-mechanics/twelfth-batch-five
