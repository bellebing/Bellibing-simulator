# retry after helper quoting fix
name: Sync PR81 project status

on:
  push:
    branches: [character-mechanics/twelfth-batch-five]
    paths:
      - '.github/workflows/_sync-pr81-project-status.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: character-mechanics/twelfth-batch-five
          fetch-depth: 0

      - name: Apply fail-closed status sync
        run: node scripts/_sync-pr81-project-status.mjs

      - name: Verify status-only diff
        run: |
          git diff --check
          test "$(git diff --name-only HEAD)" = "docs/PROJECT_STATUS.md"
          grep -F '48 VERIFIED / 0 PARTIAL / 9 UNSTARTED / 1623 canonical facts' docs/PROJECT_STATUS.md
          grep -F 'PR #81 source-audits and canonically promotes Cantarella, Cartethyia, Lucilla, Galbrena and Lynae' docs/PROJECT_STATUS.md
          grep -F 'Review all remaining 9 Character Mechanics profiles together' docs/PROJECT_STATUS.md

      - name: Remove temporary files
        run: git rm .github/workflows/_sync-pr81-project-status.yml scripts/_sync-pr81-project-status.mjs

      - name: Verify final allowlist
        run: |
          expected=$(printf '%s\n' '.github/workflows/_sync-pr81-project-status.yml' 'docs/PROJECT_STATUS.md' 'scripts/_sync-pr81-project-status.mjs' | sort)
          actual=$(git diff --name-only HEAD | sort)
          test "$actual" = "$expected"
          git diff --check

      - name: Commit status sync and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Sync PROJECT_STATUS after PR81 mechanics batch'
          git push origin HEAD:character-mechanics/twelfth-batch-five
