name: Character Truth Capture

on:
  push:
    branches:
      - 'data/bulk-character-truth-intake-20261005'
    paths:
      - '.github/workflows/character-truth-capture.yml'
      - 'scripts/export-prydwen-character-truth.py'
      - 'data/factory/character-truth/roster.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prydwen-character-truth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bellibing branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Checkout pinned Prydwen extractor
        uses: actions/checkout@v4
        with:
          repository: theonuverse/ww_prydwen_api
          ref: 96585d530be9f30c262eac69a4932b861b856adc
          path: .vendor/ww_prydwen_api
          fetch-depth: 1

      - name: Install extractor runtime
        run: |
          python -m pip install --disable-pip-version-check playwright playwright-stealth
          python -m playwright install --with-deps chromium

      - name: Capture factual Character kit evidence
        run: python scripts/export-prydwen-character-truth.py

      - name: Validate capture shape
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/factory/character-truth/prydwen-character-truth.json').read_text())
          assert p['canonicalAuthority'] is False
          assert p['promotionPolicy']=='MANUAL_SOURCE_VALIDATION_REQUIRED'
          assert len(p['characters'])==60
          assert len({c['bellibingCharacterId'] for c in p['characters']})==60
          for c in p['characters']:
              if c['captureStatus']=='CAPTURED':
                  assert len(c['sequences'])==6
          banned={'weapons','echoRecommendations','teams','rotations','ratings','roleLeads'}
          for c in p['characters']:
              assert banned.isdisjoint(c.keys())
          PY

      - name: Commit provider capture to the data branch
        run: |
          git config user.name "bellibing-data-bot"
          git config user.email "bellibing-data-bot@users.noreply.github.com"
          git add data/factory/character-truth/prydwen-character-truth.json
          if git diff --cached --quiet; then
            echo "No provider-capture change."
          else
            git commit -m "Capture Prydwen factual Character kit evidence"
            git push origin HEAD:${{ github.ref_name }}
          fi
