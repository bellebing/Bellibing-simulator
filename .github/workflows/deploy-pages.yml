name: Deploy Bellibing Web

# Called only after successful main FULL; artifacts belong to the caller's run.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download verified dist from this run
        uses: actions/download-artifact@v4
        with:
          name: bellibing-web-dist
          path: dist

      - name: Verify artifact revision identity
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const revision = process.env.EXPECTED_REVISION;
          const build = JSON.parse(fs.readFileSync('dist/review-build.json', 'utf8'));
          if (!/^[0-9a-f]{40}$/.test(revision) || build.headSha !== revision || build.workingTreeDirty !== false) {
            throw new Error('Pages artifact revision/clean-tree mismatch');
          }
          console.log(`Packaging verified dist for ${revision}`);
          NODE

      - name: Require current main revision
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            if (data.object.sha !== context.sha) core.setFailed('Refusing to package an obsolete main revision');

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: package
    permissions:
      pages: write
      id-token: write
      contents: read
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: Require current main revision
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            if (data.object.sha !== context.sha) core.setFailed('Refusing to deploy an obsolete main revision');

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Verify live site
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for Pages edge
        run: sleep 5

      - name: Verify live revision identity
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const revision = process.env.EXPECTED_REVISION;
          const url = new URL('https://bellebing.github.io/Bellibing-simulator/review-build.json');
          url.searchParams.set('run', process.env.GITHUB_RUN_ID);
          for (let attempt = 0; attempt < 10; attempt++) {
            try {
              const response = await fetch(url, { cache: 'no-store' });
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              const build = await response.json();
              if (build.headSha !== revision || build.workingTreeDirty !== false) throw new Error('Live revision/clean-tree mismatch');
              console.log(`Live Pages revision ${revision}`);
              process.exit(0);
            } catch (error) {
              if (attempt === 9) throw error;
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
          }
          NODE

      - name: Verify Alpha root
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 \
            https://bellebing.github.io/Bellibing-simulator/ \
            | grep -F "Bellibing Simulator Alpha"

      - name: Verify Echo Lab route
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 \
            https://bellebing.github.io/Bellibing-simulator/echo-lab.html \
            | grep -F "Bellibing Echo Lab"

      - name: Verify Roll Assist route
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 \
            https://bellebing.github.io/Bellibing-simulator/roll-assistant.html \
            | grep -F "Bellibing Roll Assist"

      - name: Verify live Alpha + Roll Assist paths in Chrome
        run: |
          google-chrome --version
          node scripts/verify-live-roll-assist.mjs

      - name: Verify live Augusta upgrade loop in Chrome
        env:
          BELLIBING_ALPHA_URL: https://bellebing.github.io/Bellibing-simulator/
        run: node scripts/verify-alpha-upgrade.mjs

      - name: Verify live Ciaccona owned-build path in Chrome
        env:
          BELLIBING_ALPHA_URL: https://bellebing.github.io/Bellibing-simulator/
        run: node scripts/verify-alpha-ciaccona-owned-build.mjs
