name: Deploy Bellibing Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Echo/Sonata raw coverage gate
        run: npm run audit:echo-raw

      - name: Tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Verify live site
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for Pages edge
        run: sleep 5

      - name: Verify Echo Lab
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 \
            https://bellebing.github.io/Bellibing-simulator/ \
            | grep -F "Bellibing Echo Lab"

      - name: Verify Roll Assist
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 \
            https://bellebing.github.io/Bellibing-simulator/roll-assistant.html \
            | grep -F "Bellibing Roll Assist"
