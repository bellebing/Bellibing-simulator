name: Export Bellibing Web Artifact

# Manual build/export only; not FULL or MERGE readiness evidence.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Exact-head artifact identity
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const revision = process.env.EXPECTED_REVISION;
          const build = JSON.parse(fs.readFileSync('dist/review-build.json', 'utf8'));
          if (!/^[0-9a-f]{40}$/.test(revision) || build.headSha !== revision || build.workingTreeDirty !== false) {
            throw new Error('Review build revision/clean-tree mismatch');
          }
          console.log(`Verified clean dist for ${revision}`);
          NODE

      - name: Upload compiled web artifact
        uses: actions/upload-artifact@v4
        with:
          name: bellibing-web-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
