name: Export Bellibing Web Artifact

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Echo/Sonata raw coverage gate
        run: npm run audit:echo-raw

      - name: Sonata effect source coverage gate
        run: npm run audit:sonata-effects

      - name: Echo skill source coverage gate
        run: npm run audit:echo-skills

      - name: Tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Upload compiled web artifact
        uses: actions/upload-artifact@v4
        with:
          name: bellibing-web-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
