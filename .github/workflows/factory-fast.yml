name: Factory Fast Verify

on:
  push:
    branches:
      - 'factory/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  factory-fast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Factory targeted verification
        run: npm run verify:fast:factory

      - name: Diff whitespace check
        run: git diff --check HEAD^
