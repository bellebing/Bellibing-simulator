name: Import Character Mechanics Source

on:
  pull_request:
    paths:
      - 'scripts/sync-character-mechanics.mjs'
      - 'scripts/generate-character-mechanics-review.mjs'
      - 'scripts/generate-character-mechanics-description-review.mjs'
      - 'scripts/lib/character-mechanics-import.mjs'
      - 'scripts/lib/character-mechanics-promotion-review.mjs'
      - 'scripts/lib/character-mechanics-description-review.mjs'
      - 'src/characterMechanicsDomain.ts'
      - 'src/data/characterMechanics.ts'
      - 'src/data/characterMechanics/**'
      - 'src/data/characterMechanicsAudit.ts'
      - 'src/data/characters.ts'
      - 'test/characterMechanicsImport.test.ts'
      - 'test/characterMechanicsPromotionReview.test.ts'
      - 'test/characterMechanicsDescriptionReview.test.ts'
      - 'test/characterMechanicsFixedSourceDamage.test.ts'
      - 'test/characterDamageTaxonomy.test.ts'
      - 'test/finalFourCharacterMechanics.test.ts'
      - 'package.json'
      - '.github/workflows/import-character-mechanics-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate roster-wide candidate snapshot
        run: >-
          npm run sync:character-mechanics --
          --allow-unmatched
          --out artifacts/character-mechanics-candidates.json
          --summary-out artifacts/character-mechanics-candidates.summary.json

      - name: Generate promotion review package
        run: >-
          npm run review:character-mechanics --
          --input artifacts/character-mechanics-candidates.json
          --out artifacts/character-mechanics-promotion-review.json

      - name: Generate description parameter review package
        run: >-
          npm run review:character-mechanics-descriptions --
          --input artifacts/character-mechanics-candidates.json
          --out artifacts/character-mechanics-description-review.json

      - name: Validate fail-closed roster match and promotion boundary
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const summary = JSON.parse(await readFile('artifacts/character-mechanics-candidates.summary.json', 'utf8'));
          if (summary.importStatus !== 'CANDIDATE_ONLY' || summary.verificationStatus !== 'NOT_VERIFIED') {
            throw new Error('Source import must remain candidate-only and must never auto-verify.');
          }
          const counts = summary.summary;
          if (counts.matchedCharacters !== counts.requestedReleasedCharacters || counts.unmatchedCharacters !== 0 || counts.ambiguousCharacters !== 0) {
            throw new Error(`Released roster source match incomplete: ${JSON.stringify(counts)}`);
          }

          const review = JSON.parse(await readFile('artifacts/character-mechanics-promotion-review.json', 'utf8'));
          if (review.kind !== 'CHARACTER_MECHANICS_PROMOTION_REVIEW' || review.promotionStatus !== 'REVIEW_REQUIRED' || review.verificationStatus !== 'NOT_VERIFIED') {
            throw new Error('Promotion package must remain review-only and must never auto-verify.');
          }
          if (review.summary.characters !== counts.matchedCharacters) {
            throw new Error(`Promotion character count drift: ${JSON.stringify(review.summary)}`);
          }
          if (review.summary.actionCandidates <= 0) {
            throw new Error('Promotion review unexpectedly contains no exact action candidates.');
          }
          if (review.summary.tuneBreakCandidates !== review.summary.characters) {
            throw new Error(`Expected one current Tune Break source candidate per released character: ${JSON.stringify(review.summary)}`);
          }
          if (review.summary.sequenceCandidates !== review.summary.characters * 6) {
            throw new Error(`Expected exact S1-S6 source candidates for every released character: ${JSON.stringify(review.summary)}`);
          }
          if (review.summary.rawReviewRows !== 0) {
            throw new Error(`Current source snapshot contains unstructured tabular rows that need an explicit parser/review path: ${JSON.stringify(review.summary)}`);
          }

          const descriptions = JSON.parse(await readFile('artifacts/character-mechanics-description-review.json', 'utf8'));
          if (descriptions.kind !== 'CHARACTER_MECHANICS_DESCRIPTION_REVIEW' || descriptions.promotionStatus !== 'REVIEW_REQUIRED' || descriptions.verificationStatus !== 'NOT_VERIFIED') {
            throw new Error('Description review must remain review-only and must never auto-verify.');
          }
          if (descriptions.summary.characters !== counts.matchedCharacters) {
            throw new Error(`Description review character count drift: ${JSON.stringify(descriptions.summary)}`);
          }
          if (descriptions.summary.parsedParameters <= 0) {
            throw new Error('Description review unexpectedly contains no structured source parameters.');
          }
          if (descriptions.summary.rawParameters !== 0) {
            throw new Error(`Current source snapshot contains description parameters that need an explicit parser/review path: ${JSON.stringify(descriptions.summary)}`);
          }

          console.log(`Matched ${counts.matchedCharacters}/${counts.requestedReleasedCharacters} released characters.`);
          console.log(`Parsed ${counts.parsedCoefficientRows} exact ten-level coefficient rows; ${counts.charactersNeedingReview} characters remain in parser review queue.`);
          console.log(`Promotion package carries ${review.summary.actionCandidates} exact action candidates, ${review.summary.utilityFormulaCandidates} flat+percent formulas, ${review.summary.numericCurveCandidates} numeric curves and ${review.summary.twoTermNumericCandidates} two-term numeric curves without auto-verification.`);
          console.log(`Description package carries ${descriptions.summary.parsedParameters} structured source parameters across ${descriptions.summary.movesWithParameters} moves without assigning mechanic meaning.`);
          console.log('All current tabular rows and move description parameters are structurally represented; semantic interpretation remains review-only.');
          NODE

      - name: Upload candidate snapshot for source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bellibing-character-mechanics-source-candidate
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
