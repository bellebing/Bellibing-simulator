name: Import Builder Icon Foundation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import pinned builder icon foundation
        run: node scripts/import-ui-builder-icons.mjs

      - name: Audit imported builder icons
        run: node scripts/audit-ui-builder-icons.mjs

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ui-prototypes/assets/builder-icons
          if git diff --cached --quiet; then
            echo "No import changes."
            exit 0
          fi
          git commit -m "assets(ui): import builder icon foundation"
          git push origin "HEAD:$GITHUB_REF_NAME"
