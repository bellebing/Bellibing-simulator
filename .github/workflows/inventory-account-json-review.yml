name: Inventory Account JSON Review

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'src/inventoryAccount.mjs'
      - 'src/inventoryAccountStore.mjs'
      - 'src/productBuildDraft.mjs'
      - 'docs/product-ui/product-store.js'
      - 'docs/product-ui/build-candidate/workbench-b.js'
      - 'src/characterOriginalRelease.mjs'
      - 'test/characterOriginalRelease.test.mjs'
      - 'test/characterOriginalRelease.browser.mjs'
      - 'docs/product-ui/build-candidate/workbench-b.html'
      - 'docs/product-ui/build-candidate/state.js'
      - 'docs/PROJECT_STATUS.md'
      - 'test/ownedBuildAccountSync.test.mjs'
      - 'test/ownedBuildAccountSync.browser.mjs'
      - 'test/productImport.browser.mjs'
      - 'docs/ui-lab/inventory/integration.js'
      - 'src/improveProductEchoDefaults.mjs'
      - 'docs/ui-lab/v1.1/modules/app.js'
      - 'docs/ui-lab/v1.1/modules/canonical-settings.js'
      - 'docs/ui-lab/v1.1/modules/product-echo-defaults.js'
      - 'docs/ui-lab/v1.1/modules/settings-state.js'
      - 'docs/ui-lab/v1.1/modules/improve-settings.js'
      - 'docs/ui-lab/v1.1/modules/stat-target-cost.js'
      - 'docs/ui-lab/v1.1/modules/resource-cost.js'
      - 'test/improveProductEchoDefaults.test.mjs'
      - 'test/improveProductEchoDefaults.browser.mjs'
      - 'scripts/local-character-scanner.mjs'
      - 'scripts/start-bellibing-local.mjs'
      - 'test/localCharacterScanner.test.mjs'
      - 'test/localCharacterScanner.browser.mjs'
      - 'docs/CHARACTER_IMPORT_LOCAL.md'
      - 'docs/ui-lab/inventory/integration.css'
      - 'docs/product-ui/inventory-candidate/inventory.js'
      - 'docs/product-ui/inventory-candidate/inventory.css'
      - 'test/inventoryPortableAccount.test.mjs'
      - 'test/inventoryAccountBackup.browser.mjs'
      - 'test/recoveryIntegration.browser.mjs'
      - 'package.json'
      - '.github/workflows/inventory-account-json-review.yml'

permissions:
  contents: read

concurrency:
  group: inventory-json-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable-account:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Canonical account backup and store regressions
        run: node --experimental-strip-types --test test/inventoryAccount.test.mjs test/inventoryAccountStore.test.mjs test/inventoryBackupMigration.test.mjs test/inventoryPortableAccount.test.mjs test/ownedTeams.test.mjs test/ownedBuildAccountSync.test.mjs test/productBuildDraft.test.mjs
      - name: Character-specific Improve Hard/Flex and Pending Expected regressions
        run: node --experimental-strip-types --test test/improveProductEchoDefaults.test.mjs test/sourcePriorityGuidance.test.mjs
      - name: Local Character scanner child and HTTP boundary regressions
        run: node --experimental-strip-types --test test/localCharacterScanner.test.mjs
      - name: Source-bound original Character release order regression
        run: node --experimental-strip-types --test test/characterOriginalRelease.test.mjs
      - name: Build actual product Inventory
        run: npm run build
      - name: Use runner-installed Google Chrome
        run: command -v google-chrome && google-chrome --version
      - name: Test real product and retained legacy JSON restore flows
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          timeout 120s node --experimental-strip-types --test test/characterOriginalRelease.browser.mjs
          timeout 120s node --experimental-strip-types --test test/inventoryAccountBackup.browser.mjs
          timeout 120s node --experimental-strip-types --test test/ownedBuildAccountSync.browser.mjs
          timeout 120s node --experimental-strip-types --test test/productImport.browser.mjs
          timeout 120s node --experimental-strip-types --test test/localCharacterScanner.browser.mjs
          timeout 120s node --experimental-strip-types --test test/improveProductEchoDefaults.browser.mjs
