name: Integrate Final Four Review

on:
  push:
    branches:
      - character-mechanics/final-nine-review
    paths:
      - '.github/workflows/materialize-final-four-review.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: character-mechanics/final-nine-review
          fetch-depth: 0

      - name: Integrate static reviewed facts and profiles
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one integration anchor, found {text.count(old)}')
              target.write_text(text.replace(old, new, 1))

          central = 'src/data/characterMechanics.ts'
          import_anchor = "import { TWELFTH_BATCH_CHARACTER_MECHANICS_PROFILES } from './characterMechanics/twelfthBatchProfiles.ts';\n"
          replace_once(central, import_anchor, import_anchor + "import { FINAL_FOUR_CHARACTER_MECHANICS_PROFILES } from './characterMechanics/finalFourProfiles.ts';\nimport { FINAL_FOUR_TUNE_BREAK_FACTS } from './characterMechanics/finalFourTuneBreakFacts.ts';\nimport { LUCY_CHARACTER_MECHANIC_FACTS } from './characterMechanics/lucyRawFacts.ts';\nimport { REBECCA_CHARACTER_MECHANIC_FACTS } from './characterMechanics/rebeccaRawFacts.ts';\nimport { ZANI_CHARACTER_MECHANIC_FACTS } from './characterMechanics/zaniRawFacts.ts';\nimport { LUUK_HERSSEN_CHARACTER_MECHANIC_FACTS } from './characterMechanics/luukHerssenRawFacts.ts';\n")

          export_anchor = "} from './characterMechanics/twelfthBatchProfiles.ts';\nexport { TAOQI_ACTION_FACTS } from './characterMechanics/taoqiRawFacts.ts';\n"
          replace_once(central, export_anchor, "} from './characterMechanics/twelfthBatchProfiles.ts';\nexport { LUCY_ACTION_FACTS } from './characterMechanics/lucyRawFacts.ts';\nexport { REBECCA_ACTION_FACTS } from './characterMechanics/rebeccaRawFacts.ts';\nexport { ZANI_ACTION_FACTS } from './characterMechanics/zaniRawFacts.ts';\nexport { LUUK_HERSSEN_ACTION_FACTS } from './characterMechanics/luukHerssenRawFacts.ts';\nexport {\n  FINAL_FOUR_CHARACTER_MECHANICS_PROFILES,\n  LUCY_CHARACTER_MECHANICS_PROFILE,\n  REBECCA_CHARACTER_MECHANICS_PROFILE,\n  ZANI_CHARACTER_MECHANICS_PROFILE,\n  LUUK_HERSSEN_CHARACTER_MECHANICS_PROFILE,\n} from './characterMechanics/finalFourProfiles.ts';\nexport {\n  FINAL_FOUR_TUNE_BREAK_FACTS,\n  LUCY_TUNE_BREAK_FACT,\n  REBECCA_TUNE_BREAK_FACT,\n  ZANI_TUNE_BREAK_FACT,\n  LUUK_HERSSEN_TUNE_BREAK_FACT,\n} from './characterMechanics/finalFourTuneBreakFacts.ts';\nexport { TAOQI_ACTION_FACTS } from './characterMechanics/taoqiRawFacts.ts';\n")

          facts_anchor = "  ...LYNAE_CHARACTER_MECHANIC_FACTS,\n  ...CHARACTER_TUNE_BREAK_FACTS,\n"
          replace_once(central, facts_anchor, "  ...LYNAE_CHARACTER_MECHANIC_FACTS,\n  ...LUCY_CHARACTER_MECHANIC_FACTS,\n  ...REBECCA_CHARACTER_MECHANIC_FACTS,\n  ...ZANI_CHARACTER_MECHANIC_FACTS,\n  ...LUUK_HERSSEN_CHARACTER_MECHANIC_FACTS,\n  ...CHARACTER_TUNE_BREAK_FACTS,\n  ...FINAL_FOUR_TUNE_BREAK_FACTS,\n")

          profiles_anchor = "  ...TWELFTH_BATCH_CHARACTER_MECHANICS_PROFILES,\n] as const;\n"
          replace_once(central, profiles_anchor, "  ...TWELFTH_BATCH_CHARACTER_MECHANICS_PROFILES,\n  ...FINAL_FOUR_CHARACTER_MECHANICS_PROFILES,\n] as const;\n")

          domain = 'src/characterMechanicsDomain.ts'
          effect_anchor = "export type CharacterEffectScope = 'SELF' | 'TEAM' | 'NEXT_CHARACTER' | 'TARGET' | 'OTHER';\n"
          helper = """/**\n * Boundary for adapters that only understand one Character damage class.\n * Multi-class source facts are intentionally rejected instead of coercing a\n * primary class or silently selecting the first taxonomy entry.\n */\nexport function requireSingleCharacterDamageClass(fact: CharacterActionFact): CharacterDamageClass {\n  if (fact.actionRole !== 'DAMAGE') {\n    throw new Error(`Character action ${fact.factId} is not Character-owned DAMAGE.`);\n  }\n  const simultaneous = fact.damageClasses ?? null;\n  if (simultaneous !== null) {\n    throw new Error(`Character action ${fact.factId} has simultaneous source damage classes: ${simultaneous.join(', ') || 'none'}.`);\n  }\n  if (fact.damageClass === null) {\n    throw new Error(`Character action ${fact.factId} has no single source damage class.`);\n  }\n  return fact.damageClass;\n}\n\n"""
          replace_once(domain, effect_anchor, helper + effect_anchor)
          PY

      - name: Add final-four regression coverage
        run: |
          cat > test/finalFourCharacterMechanics.test.ts <<'EOF'
          import assert from 'node:assert/strict';
          import test from 'node:test';

          import { requireSingleCharacterDamageClass } from '../src/characterMechanicsDomain.ts';
          import { auditCharacterMechanicsCoverage } from '../src/data/characterMechanicsAudit.ts';
          import {
            CHARACTER_MECHANIC_FACT_BY_ID,
            getCharacterActionFact,
            getCharacterMechanicsProfile,
          } from '../src/data/characterMechanics.ts';

          const FINAL_FOUR = ['lucy', 'luuk-herssen', 'rebecca', 'zani'] as const;

          test('final four source-reviewed profiles close cleanly while five real blockers remain unstarted', () => {
            const audit = auditCharacterMechanicsCoverage();
            assert.deepEqual(audit.structuralIssues, []);
            assert.equal(audit.verifiedCharacterIds.length, 52);
            assert.deepEqual(audit.partialCharacterIds, []);
            assert.deepEqual(audit.unstartedCharacterIds, [
              'buling',
              'danjin',
              'rover-electro',
              'suisui',
              'xiangli-yao',
            ]);
            for (const characterId of FINAL_FOUR) {
              const profile = getCharacterMechanicsProfile(characterId);
              assert.ok(profile, characterId);
              assert.equal(profile.verificationStatus, 'VERIFIED', characterId);
              assert.ok(profile.coverage.every((area) => area.status === 'VERIFIED'), characterId);
              const tuneBreak = profile.factIds
                .map((factId) => CHARACTER_MECHANIC_FACT_BY_ID.get(factId))
                .filter((fact) => fact?.kind === 'ACTION' && fact.section === 'TUNE_BREAK');
              assert.equal(tuneBreak.length, 1, characterId);
            }
          });

          test('Lucy and Rebecca retain source-facing Hack damage instead of coercing an old bucket', () => {
            const lucy = getCharacterActionFact('lucy-forte-circuit-depths-of-blackwall-hack-response-data-crash-dmg');
            const rebecca = getCharacterActionFact('rebecca-forte-circuit-gloves-are-comin-off-hack-response-meltdown-dmg');
            assert.ok(lucy && rebecca);
            assert.equal(lucy.damageClass, 'HACK');
            assert.equal(rebecca.damageClass, 'HACK');
            assert.equal(requireSingleCharacterDamageClass(lucy), 'HACK');
            assert.equal(requireSingleCharacterDamageClass(rebecca), 'HACK');
          });

          test('Rebecca preserves the reviewed Huntress bucket distinction and fixed Outro coefficient', () => {
            const huntress = getCharacterActionFact('rebecca-basic-attack-mix-n-match-heavy-attack-huntress-dmg');
            const eatLead = getCharacterActionFact('rebecca-basic-attack-mix-n-match-heavy-attack-eat-lead-huntress-dmg');
            const outro = getCharacterActionFact('rebecca-outro-preem-choom-turret-hit');
            assert.ok(huntress && eatLead && outro);
            assert.equal(huntress.actionKind, 'HEAVY');
            assert.equal(huntress.damageClass, 'BASIC');
            assert.equal(eatLead.actionKind, 'HEAVY');
            assert.equal(eatLead.damageClass, 'HEAVY');
            assert.equal(outro.sourceFixedMotionValue, 0.025);
          });

          test('Zani simultaneous Heavy Attack plus Spectro Frazzle taxonomy fails closed for single-class consumers', () => {
            const daybreak = getCharacterActionFact('zani-forte-circuit-there-will-be-a-light-heavy-slash-daybreak-dmg');
            const outro = getCharacterActionFact('zani-outro-beacon-for-the-future');
            assert.ok(daybreak && outro);
            assert.equal(daybreak.damageClass, null);
            assert.deepEqual(daybreak.damageClasses, ['HEAVY', 'SPECTRO_FRAZZLE']);
            assert.throws(
              () => requireSingleCharacterDamageClass(daybreak),
              /simultaneous source damage classes: HEAVY, SPECTRO_FRAZZLE/,
            );
            assert.equal(outro.damageClass, 'SPECTRO_FRAZZLE');
            assert.equal(outro.sourceFixedMotionValue, 1.5);
          });

          test('Luuk Herssen preserves literal Ichor Blade damage and fixed Outro without fabricated curves', () => {
            const ichor = getCharacterActionFact('luuk-herssen-forte-ichor-blade-fixed-damage');
            const outro = getCharacterActionFact('luuk-herssen-outro-bow-to-the-last-light');
            assert.ok(ichor && outro);
            assert.equal(ichor.sourceFixedFlatDamage, 10);
            assert.equal(ichor.scalingStat, 'FIXED');
            assert.equal(ichor.motionValueCurve ?? null, null);
            assert.equal(ichor.sourceFixedMotionValue ?? null, null);
            assert.equal(outro.sourceFixedMotionValue, 5);
          });
          EOF

      - name: Remove broken payload materialization inputs
        run: rm -f .github/final-nine-payload-*.b64

      - name: Fail closed on structural audit and measure canonical facts
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { auditCharacterMechanicsCoverage } from './src/data/characterMechanicsAudit.ts';
          import { CHARACTER_MECHANIC_FACT_BY_ID } from './src/data/characterMechanics.ts';

          const audit = auditCharacterMechanicsCoverage();
          const expectedUnstarted = ['buling', 'danjin', 'rover-electro', 'suisui', 'xiangli-yao'];
          const snapshot = {
            released: audit.releasedCount,
            profiles: audit.profileCount,
            verified: audit.verifiedCharacterIds.length,
            partial: audit.partialCharacterIds.length,
            unstarted: audit.unstartedCharacterIds,
            canonicalFacts: CHARACTER_MECHANIC_FACT_BY_ID.size,
            structuralIssues: audit.structuralIssues,
          };
          console.log(`FINAL_FOUR_AUDIT=${JSON.stringify(snapshot)}`);
          if (audit.structuralIssues.length !== 0) throw new Error('Final-four integration has structural audit issues.');
          if (audit.verifiedCharacterIds.length !== 52 || audit.partialCharacterIds.length !== 0) {
            throw new Error(`Unexpected verified/partial coverage: ${JSON.stringify(snapshot)}`);
          }
          if (JSON.stringify(audit.unstartedCharacterIds) !== JSON.stringify(expectedUnstarted)) {
            throw new Error(`Unexpected remaining Character Mechanics blockers: ${JSON.stringify(snapshot)}`);
          }
          NODE

      - name: Commit clean canonical integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/characterMechanicsDomain.ts \
                  src/data/characterMechanics.ts \
                  test/finalFourCharacterMechanics.test.ts \
                  .github/final-nine-payload-*.b64
          git diff --cached --quiet && exit 0
          git commit -m 'Integrate four final Character Mechanics profiles'
          git push origin HEAD:character-mechanics/final-nine-review
