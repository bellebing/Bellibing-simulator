name: Materialize Final Four Review

on:
  push:
    branches:
      - character-mechanics/final-nine-review
    paths:
      - '.github/final-nine-payload-*.b64'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: character-mechanics/final-nine-review
          fetch-depth: 0

      - name: Materialize reviewed raw facts
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip

          payloads = {
              '.github/final-nine-payload-lucy.b64': 'lucyRawFacts.ts',
              '.github/final-nine-payload-rebecca.b64': 'rebeccaRawFacts.ts',
              '.github/final-nine-payload-zani.b64': 'zaniRawFacts.ts',
              '.github/final-nine-payload-luuk.b64': 'luukHerssenRawFacts.ts',
          }
          out = Path('src/data/characterMechanics')
          for payload_path, output_name in payloads.items():
              payload = Path(payload_path).read_text().strip()
              content = gzip.decompress(base64.b64decode(payload)).decode()
              (out / output_name).write_text(content)
          PY

      - name: Commit exact reviewed output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/data/characterMechanics/lucyRawFacts.ts \
                  src/data/characterMechanics/rebeccaRawFacts.ts \
                  src/data/characterMechanics/zaniRawFacts.ts \
                  src/data/characterMechanics/luukHerssenRawFacts.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Materialize four reviewed Character Mechanics sources'
          git push origin HEAD:character-mechanics/final-nine-review
