name: Finalize Final Four Review

on:
  push:
    branches:
      - character-mechanics/final-nine-review
    paths:
      - '.github/workflows/materialize-final-four-review.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: character-mechanics/final-nine-review
          fetch-depth: 0

      - name: Apply measured checkpoint updates
        run: python .github/finalize-final-four.py

      - name: Commit clean final-four state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/materialize-final-four-review.yml .github/finalize-final-four.py
          git add docs/PROJECT_STATUS.md test/characterMechanics.test.ts test/finalFourCharacterMechanics.test.ts
          git diff --cached --check
          git commit -m 'Sync final-four Character Mechanics checkpoint'
          git push origin HEAD:character-mechanics/final-nine-review
