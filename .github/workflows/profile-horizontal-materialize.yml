name: Profile Horizontal Materialize

on:
  push:
    branches:
      - feat/profile-semantic-closure-tranche-20260830
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Download exact green source snapshot artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            -H 'Accept: application/vnd.github+json' \
            /repos/${GITHUB_REPOSITORY}/actions/artifacts/9736802750/zip \
            > /tmp/profile-source.zip
          echo '04663fefac62141f6b0d82b15d28d32a3e77aedfad4d89d7cc46830ca8ef365b  /tmp/profile-source.zip' | sha256sum -c -
          mkdir -p data/generated/pinned-profile-source
          unzip -q /tmp/profile-source.zip -d data/generated/pinned-profile-source

      - name: Deterministically materialize reviewer-approved profiles
        run: |
          node --experimental-strip-types scripts/generate-profile-horizontal-green-lane.mjs \
            --snapshot data/generated/pinned-profile-source/prydwen-profile-source-snapshot.json \
            --review data/research/profile-horizontal-semantic-review-2026-08-30.json \
            --candidate-snapshot-output data/generated/profile-horizontal-source-candidates-2026-08-30.json \
            --output data/generated/profileHorizontalGreenLane20260830.ts

      - name: Existing materializer regression tests
        run: node --experimental-strip-types --test test/profileCohortPromotionMaterializer.test.ts

      - name: Verify committed canonical module matches deterministic output
        run: cmp data/generated/profileHorizontalGreenLane20260830.ts src/data/profileHorizontalGreenLane20260830.ts

      - name: Upload deterministic materialization
        uses: actions/upload-artifact@v4
        with:
          name: profile-horizontal-materialization
          path: |
            data/generated/profile-horizontal-source-candidates-2026-08-30.json
            data/generated/profileHorizontalGreenLane20260830.ts
          if-no-files-found: error
