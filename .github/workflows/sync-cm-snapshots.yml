name: Sync Character Mechanics Snapshots

on:
  push:
    branches:
      - character-mechanics/final-nine-review
    paths:
      - '.github/sync-cm-snapshots.py'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: character-mechanics/final-nine-review
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync measured roster snapshots
        run: python .github/sync-cm-snapshots.py

      - name: Prove full test suite before commit
        run: npm test

      - name: Commit only verified snapshot updates and remove temp runner
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/sync-cm-snapshots.py .github/workflows/sync-cm-snapshots.yml
          git add test/*.test.ts
          git diff --cached --check
          git commit -m 'Sync Character Mechanics roster regressions'
          git push origin HEAD:character-mechanics/final-nine-review
