name: Sync Echo Catalog

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name == 'pull_request' && github.head_ref == 'data/echo-catalog-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate compact Bellibing Echo data
        run: node scripts/sync-echo-game-data.mjs

      - name: Validate generated diff
        run: git diff --check

      - name: Commit generated snapshot to feature branch
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- src/data/echoes.ts src/data/sonatas.ts src/data/echoCatalogMeta.ts)" ]; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/echoes.ts src/data/sonatas.ts src/data/echoCatalogMeta.ts
          git commit -m "data: sync Echo and Sonata snapshot"
          git push origin HEAD:${{ github.head_ref }}
