name: Sync Echo Catalog

on:
  workflow_dispatch:
  push:
    branches:
      - data/echo-catalog-foundation
    paths:
      - scripts/sync-echo-game-data.mjs
      - .github/workflows/sync-echo-catalog.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate compact Bellibing Echo data
        run: node scripts/sync-echo-game-data.mjs

      - name: Validate generated diff
        run: git diff --check

      - name: Commit generated snapshot
        shell: bash
        run: |
          if git diff --quiet -- src/data/echoes.ts src/data/sonatas.ts src/data/echoCatalogMeta.ts; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/echoes.ts src/data/sonatas.ts src/data/echoCatalogMeta.ts
          git commit -m "data: sync Echo and Sonata snapshot"
          git push origin HEAD:${{ github.ref_name }}
