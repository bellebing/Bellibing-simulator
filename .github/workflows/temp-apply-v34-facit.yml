name: Temporary apply v34 visual facit

on:
  push:
    branches:
      - ui/home-v34-preview-art-2026-09-11

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/home-v34-preview-art-2026-09-11
          fetch-depth: 0

      - name: Apply ETNA typography and accepted Home geometry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('docs/ui-prototypes/v34-functional.html')
          s = p.read_text()

          def one(pattern, replacement, label, flags=0):
              global s
              s2, n = re.subn(pattern, replacement, s, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {n}')
              s = s2

          one(
              r':root\{--bg:#050608;--panel:#11141a;--text:#f2f0eb;--muted:#8e949d;--line:rgba\(255,255,255,\.09\)\}',
              '@font-face{font-family:"Etna";src:url("assets/v34/fonts/etna/etna-v34-preview.woff2") format("woff2");font-style:normal;font-weight:400;font-display:swap}\\n:root{--bg:#050608;--panel:#11141a;--text:#f2f0eb;--muted:#8e949d;--line:rgba(255,255,255,.09);--font-display:"Etna",Inter,ui-sans-serif,system-ui,sans-serif;--font-ui:Inter,ui-sans-serif,system-ui,sans-serif;--type-home-title:32px;--type-page-question:52px;--type-character-name:48px;--type-section:23px;--type-section-compact:18px}',
              'root tokens')

          one(r'font-family:Inter,ui-sans-serif,system-ui,sans-serif;overflow:hidden', 'font-family:var(--font-ui);overflow:hidden', 'ui font root')

          home = '''.home-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;perspective:1200px;overflow:hidden}.home-card{--x:0px;--s:1;position:absolute;left:50%;top:50%;width:min(390px,calc(100vw - 64px));height:500px;transform:translate(-50%,-50%) translateX(var(--x)) scale(var(--s));border:1px solid var(--line);border-radius:26px;background:linear-gradient(180deg,#171a21,#0c0f13);box-shadow:0 28px 80px rgba(0,0,0,.48);color:#fff;cursor:pointer;overflow:hidden;transition:transform .42s cubic-bezier(.16,.84,.24,1),opacity .35s ease}.card-title{position:absolute;z-index:3;top:23px;left:10px;right:10px;margin:0;text-align:center;font-family:var(--font-display);font-size:var(--type-home-title);font-weight:400;line-height:1;white-space:nowrap}.card-art{position:absolute;z-index:1;inset:76px 0 0;overflow:hidden}.card-art::before{content:"";position:absolute;inset:0;pointer-events:none}.card-art img{position:absolute;width:auto;max-width:none;filter:none}.card-build .card-art::before{background:radial-gradient(circle at 50% 42%,rgba(142,121,98,.13),rgba(17,19,24,0) 58%)}.card-improve .card-art::before{background:radial-gradient(circle at 50% 42%,rgba(173,90,40,.16),rgba(17,19,24,0) 58%)}.card-team .card-art::before{background:radial-gradient(circle at 50% 43%,rgba(154,133,112,.13),rgba(17,19,24,0) 60%)}.card-build img{height:98%;bottom:0;left:50%;transform:translateX(-38%)}.card-improve img{height:98%;bottom:0;left:50%;transform:translateX(-62.5%)}.card-team img{height:132%;bottom:-80px;left:50%;transform:translateX(-49%);mix-blend-mode:normal}'''
          one(r'\.home-stage\{.*?\}\.home-card\{.*?\}\.home-card::after\{.*?\}\.home-card::before\{.*?\}\.home-card\[data-target="build"\]::before\{.*?\}\.home-card\[data-target="improve"\]::before\{.*?\}\.home-card\[data-target="team"\]::before\{.*?\}\.home-card strong\{.*?\}', home, 'Home visual facit', re.S)

          one(r'\.question\{.*?\}', '.question{margin:0 0 30px;font-family:var(--font-display);font-size:var(--type-page-question);font-weight:400;line-height:1;transition:opacity .46s ease,transform .7s cubic-bezier(.16,.84,.24,1),height .7s ease,margin .7s ease}', 'question typography', re.S)
          one(r'\.choice span\{.*?\}', '.choice span{position:absolute;left:8px;right:8px;bottom:20px;text-align:center;font-family:var(--font-display);font-size:25px;font-weight:400;line-height:1}', 'character name typography', re.S)
          one(r'\.focus h1\{.*?\}', '.focus h1{margin:0 0 8px;font-family:var(--font-display);font-size:var(--type-character-name);font-weight:400;line-height:1;text-align:center}', 'selected name typography', re.S)
          one(r'\.block h2,\.echoes h2,\.seq h2\{.*?\}', '.block h2,.echoes h2,.seq h2{margin:0 0 12px;font-family:var(--font-display);font-size:var(--type-section);font-weight:400;line-height:1}', 'section typography', re.S)
          one(r'\.seq h2\{.*?\}', '.seq h2{text-align:center;font-size:var(--type-section-compact)}', 'sequence compact typography', re.S)
          one(r'\.dialog h2\{.*?\}', '.dialog h2{margin:0 0 8px;font-family:var(--font-display);font-weight:400;line-height:1}', 'dialog heading typography', re.S)
          one(r'\.team-placeholder\{.*?\}\.improve-focus\{.*?\}', '.team-placeholder{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:var(--type-page-question);font-weight:400;line-height:1}.improve-focus{position:absolute;inset:150px 0 0;display:grid;place-items:center;font-family:var(--font-display);font-size:var(--type-page-question);font-weight:400;line-height:1;opacity:0;pointer-events:none}', 'major page typography', re.S)

          one(r'@media\(max-width:900px\)\{', '@media(max-width:900px){.home-card{width:min(350px,calc(100vw - 56px));height:470px}', '900 responsive Home')
          one(r'\.home-card\{width:236px;height:338px\}\.home-card strong\{top:19px;font-size:22px\}\.home-card::before\{inset:60px 12px 10px\}\.home-card\[data-target="team"\]::before\{left:-36px;right:-36px;top:74px;bottom:10px\}', '', 'remove old mobile Home overrides')
          one(r'@media\(prefers-reduced-motion:reduce\)', '@media(max-width:520px){.home-card{width:min(315px,calc(100vw - 48px));height:440px}}\\n@media(prefers-reduced-motion:reduce)', '520 responsive Home')

          old_render = "function renderHome(){const items=[['Build a Character','build']];if(state.characters.length>=1)items.push(['Improve a Character','improve']);if(state.characters.length>=2)items.push(['Build a Team','team']);const stage=document.querySelector('#homeStage');stage.innerHTML='';let idx=Math.min(1,items.length-1);const cards=items.map(([title,target],i)=>{const b=document.createElement('button');b.className='home-card';b.innerHTML=`<strong>${title}</strong>`;b.dataset.target=target;b.onclick=()=>{if(i!==idx){idx=i;paint();return}major(target,b)};stage.appendChild(b);return b});function paint(){cards.forEach((c,i)=>{const d=i-idx;c.style.setProperty('--x',`${d*300}px`);c.style.setProperty('--s',Math.max(.74,1.075-Math.abs(d)*.17));c.style.zIndex=20-Math.abs(d)})}paint()}"
          new_render = "function renderHome(){const items=[['Build a Character','build'],...(state.characters.length>=1?[['Improve a Character','improve']]:[]),...(state.characters.length>=2?[['Build a Team','team']]:[])];const art={build:'assets/v34/bellibing-ui-build-character-rover.webp',improve:'assets/v34/bellibing-ui-improve-character-augusta.webp',team:'assets/v34/bellibing-ui-build-team.webp'};const stage=document.querySelector('#homeStage');stage.innerHTML='';let idx=Math.min(1,items.length-1);const cards=items.map(([title,target],i)=>{const b=document.createElement('button');b.className=`home-card card-${target}`;b.innerHTML=`<strong class=\"card-title\">${title}</strong><div class=\"card-art\"><img src=\"${art[target]}\" alt=\"\" aria-hidden=\"true\"></div>`;b.dataset.target=target;b.onclick=()=>{if(i!==idx){idx=i;paint();return}major(target,b)};stage.appendChild(b);return b});function spacing(){return innerWidth<520?238:innerWidth<900?270:318}function paint(){cards.forEach((c,i)=>{const d=i-idx;c.style.setProperty('--x',`${d*spacing()}px`);c.style.setProperty('--s',Math.max(.72,1.075-Math.abs(d)*.17));c.style.zIndex=20-Math.abs(d)})}paint()}"
          if old_render not in s:
              raise SystemExit('renderHome: expected old implementation not found')
          s = s.replace(old_render, new_render, 1)

          old_resize = "window.addEventListener('resize',()=>{buildPicker.render();if(document.getElementById('improve').classList.contains('active'))improvePicker.render()});renderHome();"
          new_resize = "window.addEventListener('resize',()=>{if(document.getElementById('home').classList.contains('active'))renderHome();buildPicker.render();if(document.getElementById('improve').classList.contains('active'))improvePicker.render()});renderHome();"
          if old_resize not in s:
              raise SystemExit('resize handler: expected old implementation not found')
          s = s.replace(old_resize, new_resize, 1)

          checks = [
              'font-family:"Etna"',
              '--font-display:"Etna"',
              'font-size:var(--type-home-title)',
              'top:23px',
              'translateX(-38%)',
              'translateX(-62.5%)',
              'height:132%;bottom:-80px',
              'innerWidth<520?238:innerWidth<900?270:318',
          ]
          for token in checks:
              if token not in s:
                  raise SystemExit(f'missing expected token after patch: {token}')

          p.write_text(s)
          PY

      - name: Confirm font asset and build-copy path
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/ui-prototypes/assets/v34/fonts/etna/etna-v34-preview.woff2
          test -f docs/ui-prototypes/assets/v34/fonts/etna/SOURCE.md
          grep -F "cpSync('docs/ui-prototypes/assets/v34', 'dist/ui-preview/assets/v34', { recursive: true });" scripts/build-web.mjs

      - name: Commit facit and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-apply-v34-facit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ui-prototypes/v34-functional.html .github/workflows/temp-apply-v34-facit.yml
          git commit -m "fix(ui): restore v34 Home composition and typography"
          git push origin HEAD:ui/home-v34-preview-art-2026-09-11
