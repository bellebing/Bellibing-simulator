name: Temporary ETNA asset fetch

on:
  push:
    branches:
      - ui/home-v34-preview-art-2026-09-11
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-etna:
    runs-on: ubuntu-latest
    steps:
      - name: Check out draft branch
        uses: actions/checkout@v4
        with:
          ref: ui/home-v34-preview-art-2026-09-11

      - name: Fetch accepted-v34 ETNA webfont
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -fL --retry 3 --retry-delay 2 \
            "https://db.onlinewebfonts.com/t/3c1a4128f95e2109303b045eda4bfe8a.woff2" \
            -o out/etna-v34-preview.woff2
          python - <<'PY'
          from pathlib import Path
          p = Path('out/etna-v34-preview.woff2')
          data = p.read_bytes()
          if len(data) < 10000:
              raise SystemExit(f'font unexpectedly small: {len(data)} bytes')
          if data[:4] != b'wOF2':
              raise SystemExit(f'not WOFF2: magic={data[:4]!r}')
          print(f'validated WOFF2: {len(data)} bytes')
          PY
          sha256sum out/etna-v34-preview.woff2 | tee out/SHA256.txt

      - name: Stage local preview font and provenance note
        shell: bash
        run: |
          set -euo pipefail
          target="docs/ui-prototypes/assets/v34/fonts/etna"
          mkdir -p "$target"
          cp out/etna-v34-preview.woff2 "$target/etna-v34-preview.woff2"
          cat > "$target/SOURCE.md" <<'EOF'
          # ETNA preview font source

          Temporary **v34 visual-parity** asset only.

          - Typeface: ETNA
          - Designer: Krisjanis Mezulis
          - Official source: https://wildtype.design/product/etna-free-typeface/
          - Accepted-v34 webfont mirror used by the prior chat prototype: https://db.onlinewebfonts.com/t/3c1a4128f95e2109303b045eda4bfe8a.woff2
          - Local file: `etna-v34-preview.woff2`
          - SHA-256: `c1415941c25250df68ac199dd81bd140f2777688a8bc1c57eb822fb17c81c93d`

          This local WOFF2 removes the runtime dependency on the external mirror for the isolated `/ui-preview/` visual checkpoint. It is **not** a claim of production provenance or production license clearance. Before production asset promotion, verify/replace it against the official distributed ETNA file and retain the official license/source material.
          EOF

      - name: Commit local preview font if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ui-prototypes/assets/v34/fonts/etna
          if git diff --cached --quiet; then
            echo "ETNA preview asset already staged on branch."
            exit 0
          fi
          git commit -m "chore(ui): add local ETNA v34 preview font"
          git push origin HEAD:ui/home-v34-preview-art-2026-09-11

      - name: Upload ETNA verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: etna-v34-preview-source
          path: out/
          if-no-files-found: error
          retention-days: 1
