name: Temporary rebuild v34 visual facit safely

on:
  push:
    branches:
      - ui/home-v34-preview-art-2026-09-11

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/home-v34-preview-art-2026-09-11
          fetch-depth: 0

      - name: Rebuild UI HTML from canonical main plus accepted v34 facit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:docs/ui-prototypes/v34-functional.html > docs/ui-prototypes/v34-functional.html
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('docs/ui-prototypes/v34-functional.html')
          s = p.read_text()

          def exact(old, new, label):
              global s
              if s.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one source match, got {s.count(old)}')
              s = s.replace(old, new, 1)

          def regex(pattern, replacement, label, flags=0):
              global s
              s2, n = re.subn(pattern, replacement, s, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'{label}: expected one replacement, got {n}')
              s = s2

          exact(
              ':root{--bg:#050608;--panel:#11141a;--text:#f2f0eb;--muted:#8e949d;--line:rgba(255,255,255,.09)}',
              '@font-face{font-family:"Etna";src:url("assets/v34/fonts/etna/etna-v34-preview.woff2") format("woff2");font-style:normal;font-weight:400;font-display:swap}\n:root{--bg:#050608;--panel:#11141a;--text:#f2f0eb;--muted:#8e949d;--line:rgba(255,255,255,.09);--font-display:"Etna",Inter,ui-sans-serif,system-ui,sans-serif;--font-ui:Inter,ui-sans-serif,system-ui,sans-serif;--type-home-title:32px;--type-page-question:52px;--type-character-name:48px;--type-section:23px;--type-section-compact:18px}',
              'font tokens')
          exact('font-family:Inter,ui-sans-serif,system-ui,sans-serif;overflow:hidden', 'font-family:var(--font-ui);overflow:hidden', 'root UI font')

          home = '.home-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;perspective:1200px;overflow:hidden}.home-card{--x:0px;--s:1;position:absolute;left:50%;top:50%;width:min(390px,calc(100vw - 64px));height:500px;transform:translate(-50%,-50%) translateX(var(--x)) scale(var(--s));border:1px solid var(--line);border-radius:26px;background:linear-gradient(180deg,#171a21,#0c0f13);box-shadow:0 28px 80px rgba(0,0,0,.48);color:#fff;cursor:pointer;overflow:hidden;transition:transform .42s cubic-bezier(.16,.84,.24,1),opacity .35s ease}.card-title{position:absolute;z-index:3;top:23px;left:10px;right:10px;margin:0;text-align:center;font-family:var(--font-display);font-size:var(--type-home-title);font-weight:400;line-height:1;white-space:nowrap}.card-art{position:absolute;z-index:1;inset:76px 0 0;overflow:hidden}.card-art::before{content:"";position:absolute;inset:0;pointer-events:none}.card-art img{position:absolute;width:auto;max-width:none;filter:none}.card-build .card-art::before{background:radial-gradient(circle at 50% 42%,rgba(142,121,98,.13),rgba(17,19,24,0) 58%)}.card-improve .card-art::before{background:radial-gradient(circle at 50% 42%,rgba(173,90,40,.16),rgba(17,19,24,0) 58%)}.card-team .card-art::before{background:radial-gradient(circle at 50% 43%,rgba(154,133,112,.13),rgba(17,19,24,0) 60%)}.card-build img{height:98%;bottom:0;left:50%;transform:translateX(-38%)}.card-improve img{height:98%;bottom:0;left:50%;transform:translateX(-62.5%)}.card-team img{height:132%;bottom:-80px;left:50%;transform:translateX(-49%);mix-blend-mode:normal}'
          regex(r'\.home-stage\{.*?(?=\.home-leaving \.home-card\{)', home, 'bounded Home block', re.S)

          exact('.question{margin:0 0 30px;font-size:52px;line-height:1;transition:opacity .46s ease,transform .7s cubic-bezier(.16,.84,.24,1),height .7s ease,margin .7s ease}', '.question{margin:0 0 30px;font-family:var(--font-display);font-size:var(--type-page-question);font-weight:400;line-height:1;transition:opacity .46s ease,transform .7s cubic-bezier(.16,.84,.24,1),height .7s ease,margin .7s ease}', 'question')
          exact('.choice span{position:absolute;left:8px;right:8px;bottom:20px;text-align:center;font-size:25px}', '.choice span{position:absolute;left:8px;right:8px;bottom:20px;text-align:center;font-family:var(--font-display);font-size:25px;font-weight:400;line-height:1}', 'character labels')
          exact('.focus h1{margin:0 0 8px;font-size:48px}', '.focus h1{margin:0 0 8px;font-family:var(--font-display);font-size:var(--type-character-name);font-weight:400;line-height:1;text-align:center}', 'selected character name')
          exact('.block h2,.echoes h2,.seq h2{margin:0 0 12px;font-size:23px}', '.block h2,.echoes h2,.seq h2{margin:0 0 12px;font-family:var(--font-display);font-size:var(--type-section);font-weight:400;line-height:1}', 'section labels')
          exact('.seq h2{text-align:center;font-size:18px}', '.seq h2{text-align:center;font-size:var(--type-section-compact)}', 'sequence label')
          exact('.dialog h2{margin:0 0 8px}', '.dialog h2{margin:0 0 8px;font-family:var(--font-display);font-weight:400;line-height:1}', 'dialog heading')
          exact('.team-placeholder{position:absolute;inset:0;display:grid;place-items:center;font-size:52px}.improve-focus{position:absolute;inset:150px 0 0;display:grid;place-items:center;font-size:52px;opacity:0;pointer-events:none}', '.team-placeholder{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:var(--type-page-question);font-weight:400;line-height:1}.improve-focus{position:absolute;inset:150px 0 0;display:grid;place-items:center;font-family:var(--font-display);font-size:var(--type-page-question);font-weight:400;line-height:1;opacity:0;pointer-events:none}', 'major page headings')

          exact('@media(max-width:900px){.focus{width:48vw}', '@media(max-width:900px){.home-card{width:min(350px,calc(100vw - 56px));height:470px}.focus{width:48vw}', 'medium Home sizing')
          exact('.account{position:fixed}.home-card{width:236px;height:338px}.question{font-size:42px}', '.account{position:fixed}.question{font-size:42px}', 'remove old mobile Home size')
          exact('@media(prefers-reduced-motion:reduce)', '@media(max-width:520px){.home-card{width:min(315px,calc(100vw - 48px));height:440px}}\n@media(prefers-reduced-motion:reduce)', 'small Home sizing')

          old_render = "function renderHome(){const items=[['Build a Character','build']];if(state.characters.length>=1)items.push(['Improve a Character','improve']);if(state.characters.length>=2)items.push(['Build a Team','team']);const stage=document.querySelector('#homeStage');stage.innerHTML='';let idx=Math.min(1,items.length-1);const cards=items.map(([title,target],i)=>{const b=document.createElement('button');b.className='home-card';b.innerHTML=`<strong>${title}</strong>`;b.dataset.target=target;b.onclick=()=>{if(i!==idx){idx=i;paint();return}major(target,b)};stage.appendChild(b);return b});function paint(){cards.forEach((c,i)=>{const d=i-idx;c.style.setProperty('--x',`${d*300}px`);c.style.setProperty('--s',Math.max(.74,1.075-Math.abs(d)*.17));c.style.zIndex=20-Math.abs(d)})}paint()}"
          new_render = "function renderHome(){const items=[['Build a Character','build'],...(state.characters.length>=1?[['Improve a Character','improve']]:[]),...(state.characters.length>=2?[['Build a Team','team']]:[])];const art={build:'assets/v34/bellibing-ui-build-character-rover.webp',improve:'assets/v34/bellibing-ui-improve-character-augusta.webp',team:'assets/v34/bellibing-ui-build-team.webp'};const stage=document.querySelector('#homeStage');stage.innerHTML='';let idx=Math.min(1,items.length-1);const cards=items.map(([title,target],i)=>{const b=document.createElement('button');b.className=`home-card card-${target}`;b.innerHTML=`<strong class=\"card-title\">${title}</strong><div class=\"card-art\"><img src=\"${art[target]}\" alt=\"\" aria-hidden=\"true\"></div>`;b.dataset.target=target;b.onclick=()=>{if(i!==idx){idx=i;paint();return}major(target,b)};stage.appendChild(b);return b});function spacing(){return innerWidth<520?238:innerWidth<900?270:318}function paint(){cards.forEach((c,i)=>{const d=i-idx;c.style.setProperty('--x',`${d*spacing()}px`);c.style.setProperty('--s',Math.max(.72,1.075-Math.abs(d)*.17));c.style.zIndex=20-Math.abs(d)})}paint()}"
          exact(old_render, new_render, 'Home renderer')

          old_resize = "window.addEventListener('resize',()=>{buildPicker.render();if(document.getElementById('improve').classList.contains('active'))improvePicker.render()});renderHome();"
          new_resize = "window.addEventListener('resize',()=>{if(document.getElementById('home').classList.contains('active'))renderHome();buildPicker.render();if(document.getElementById('improve').classList.contains('active'))improvePicker.render()});renderHome();"
          exact(old_resize, new_resize, 'resize Home repaint')

          required = [
              '.major-enter .picker-shell,.major-enter .team-placeholder{opacity:0;transform:scale(.84)}',
              '.picker-shell{position:absolute;inset:0;padding-top:74px;',
              '.build-stage{visibility:hidden;',
              '.dialog-bg{position:fixed;',
              '@font-face{font-family:"Etna";',
              '.card-title{position:absolute;z-index:3;top:23px;',
              'translateX(-38%)', 'translateX(-62.5%)', 'height:132%;bottom:-80px',
              'innerWidth<520?238:innerWidth<900?270:318'
          ]
          for token in required:
              if token not in s:
                  raise SystemExit(f'missing required CSS/JS after safe rebuild: {token}')

          p.write_text(s)
          PY

      - name: Verify local ETNA asset and asset build copy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/ui-prototypes/assets/v34/fonts/etna/etna-v34-preview.woff2')
          b=p.read_bytes()
          assert b[:4] == b'wOF2', b[:4]
          assert len(b) == 16004, len(b)
          PY
          grep -F "cpSync('docs/ui-prototypes/assets/v34', 'dist/ui-preview/assets/v34', { recursive: true });" scripts/build-web.mjs

      - name: Commit safe rebuild and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-rebuild-v34-facit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ui-prototypes/v34-functional.html .github/workflows/temp-rebuild-v34-facit.yml
          git commit -m "fix(ui): safely restore v34 composition and typography"
          git push origin HEAD:ui/home-v34-preview-art-2026-09-11
