name: Temporary ninth-batch registry integration

on:
  push:
    branches:
      - character-mechanics/ninth-batch-five
    paths:
      - .github/workflows/tmp-integrate-ninth-batch.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: character-mechanics/ninth-batch-five
          fetch-depth: 0
      - name: Integrate canonical registry and Tune Break
        run: |
          python - <<'PY'
          from pathlib import Path

          reg = Path('src/data/characterMechanics.ts')
          text = reg.read_text()

          def once(old, new):
              global text
              assert old in text, f'missing registry anchor: {old[:80]}'
              text = text.replace(old, new, 1)

          once("import { CIACCONA_CHARACTER_MECHANIC_FACTS } from './characterMechanics/ciacconaRawFacts.ts';\n", "import { CIACCONA_CHARACTER_MECHANIC_FACTS } from './characterMechanics/ciacconaRawFacts.ts';\nimport { CHISA_CHARACTER_MECHANIC_FACTS } from './characterMechanics/chisaRawFacts.ts';\n")
          once("import { JIYAN_CHARACTER_MECHANIC_FACTS } from './characterMechanics/jiyanRawFacts.ts';\n", "import { JIYAN_CHARACTER_MECHANIC_FACTS } from './characterMechanics/jiyanRawFacts.ts';\nimport { IUNO_CHARACTER_MECHANIC_FACTS } from './characterMechanics/iunoRawFacts.ts';\n")
          once("import { LUMI_CHARACTER_MECHANIC_FACTS } from './characterMechanics/lumiRawFacts.ts';\n", "import { LUMI_CHARACTER_MECHANIC_FACTS } from './characterMechanics/lumiRawFacts.ts';\nimport { LUPA_CHARACTER_MECHANIC_FACTS } from './characterMechanics/lupaRawFacts.ts';\n")
          once("import { ROCCIA_CHARACTER_MECHANIC_FACTS } from './characterMechanics/rocciaRawFacts.ts';\n", "import { ROCCIA_CHARACTER_MECHANIC_FACTS } from './characterMechanics/rocciaRawFacts.ts';\nimport { ROVER_HAVOC_CHARACTER_MECHANIC_FACTS } from './characterMechanics/roverHavocRawFacts.ts';\nimport { ROVER_SPECTRO_CHARACTER_MECHANIC_FACTS } from './characterMechanics/roverSpectroRawFacts.ts';\n")
          once("import { EIGHTH_BATCH_CHARACTER_MECHANICS_PROFILES } from './characterMechanics/eighthBatchProfiles.ts';\n", "import { EIGHTH_BATCH_CHARACTER_MECHANICS_PROFILES } from './characterMechanics/eighthBatchProfiles.ts';\nimport { NINTH_BATCH_CHARACTER_MECHANICS_PROFILES } from './characterMechanics/ninthBatchProfiles.ts';\n")

          once("export { CIACCONA_ACTION_FACTS } from './characterMechanics/ciacconaRawFacts.ts';\n", "export { CIACCONA_ACTION_FACTS } from './characterMechanics/ciacconaRawFacts.ts';\nexport { CHISA_ACTION_FACTS } from './characterMechanics/chisaRawFacts.ts';\n")
          once("export { JIYAN_ACTION_FACTS } from './characterMechanics/jiyanRawFacts.ts';\n", "export { JIYAN_ACTION_FACTS } from './characterMechanics/jiyanRawFacts.ts';\nexport { IUNO_ACTION_FACTS } from './characterMechanics/iunoRawFacts.ts';\n")
          once("export { LUMI_ACTION_FACTS } from './characterMechanics/lumiRawFacts.ts';\n", "export { LUMI_ACTION_FACTS } from './characterMechanics/lumiRawFacts.ts';\nexport { LUPA_ACTION_FACTS } from './characterMechanics/lupaRawFacts.ts';\n")
          once("export { ROCCIA_ACTION_FACTS } from './characterMechanics/rocciaRawFacts.ts';\n", "export { ROCCIA_ACTION_FACTS } from './characterMechanics/rocciaRawFacts.ts';\nexport { ROVER_HAVOC_ACTION_FACTS } from './characterMechanics/roverHavocRawFacts.ts';\nexport { ROVER_SPECTRO_ACTION_FACTS } from './characterMechanics/roverSpectroRawFacts.ts';\n")
          profile_anchor = "export {\n  CIACCONA_CHARACTER_MECHANICS_PROFILE,\n  EIGHTH_BATCH_CHARACTER_MECHANICS_PROFILES,\n  JIANXIN_CHARACTER_MECHANICS_PROFILE,\n  JINHSI_CHARACTER_MECHANICS_PROFILE,\n  LUMI_CHARACTER_MECHANICS_PROFILE,\n  PHOEBE_CHARACTER_MECHANICS_PROFILE,\n  THE_SHOREKEEPER_CHARACTER_MECHANICS_PROFILE,\n} from './characterMechanics/eighthBatchProfiles.ts';\n"
          profile_block = profile_anchor + "export {\n  CHISA_CHARACTER_MECHANICS_PROFILE,\n  IUNO_CHARACTER_MECHANICS_PROFILE,\n  LUPA_CHARACTER_MECHANICS_PROFILE,\n  NINTH_BATCH_CHARACTER_MECHANICS_PROFILES,\n  ROVER_HAVOC_CHARACTER_MECHANICS_PROFILE,\n  ROVER_SPECTRO_CHARACTER_MECHANICS_PROFILE,\n} from './characterMechanics/ninthBatchProfiles.ts';\n"
          once(profile_anchor, profile_block)
          tune_anchor = "export {\n  CIACCONA_TUNE_BREAK_FACT,\n  JIANXIN_TUNE_BREAK_FACT,\n  JINHSI_TUNE_BREAK_FACT,\n  LUMI_TUNE_BREAK_FACT,\n  PHOEBE_TUNE_BREAK_FACT,\n  THE_SHOREKEEPER_TUNE_BREAK_FACT,\n} from './characterMechanics/tuneBreakFacts.ts';\n"
          tune_block = tune_anchor + "export {\n  CHISA_TUNE_BREAK_FACT,\n  IUNO_TUNE_BREAK_FACT,\n  LUPA_TUNE_BREAK_FACT,\n  ROVER_HAVOC_TUNE_BREAK_FACT,\n  ROVER_SPECTRO_TUNE_BREAK_FACT,\n} from './characterMechanics/tuneBreakFacts.ts';\n"
          once(tune_anchor, tune_block)
          once("  ...THE_SHOREKEEPER_CHARACTER_MECHANIC_FACTS,\n  ...CHARACTER_TUNE_BREAK_FACTS,\n", "  ...THE_SHOREKEEPER_CHARACTER_MECHANIC_FACTS,\n  ...CHISA_CHARACTER_MECHANIC_FACTS,\n  ...IUNO_CHARACTER_MECHANIC_FACTS,\n  ...LUPA_CHARACTER_MECHANIC_FACTS,\n  ...ROVER_HAVOC_CHARACTER_MECHANIC_FACTS,\n  ...ROVER_SPECTRO_CHARACTER_MECHANIC_FACTS,\n  ...CHARACTER_TUNE_BREAK_FACTS,\n")
          once("  ...EIGHTH_BATCH_CHARACTER_MECHANICS_PROFILES,\n] as const;", "  ...EIGHTH_BATCH_CHARACTER_MECHANICS_PROFILES,\n  ...NINTH_BATCH_CHARACTER_MECHANICS_PROFILES,\n] as const;")
          reg.write_text(text)

          tb = Path('src/data/characterMechanics/tuneBreakFacts.ts')
          t = tb.read_text()
          def tb_once(old, new):
              global t
              assert old in t, f'missing tune anchor: {old[:80]}'
              t = t.replace(old, new, 1)

          tb_once("const ZHEZHI_SOURCE = 'https://wuthering.gg/characters/zhezhi';\n", "const CHISA_SOURCE = 'https://www.prydwen.gg/wuthering-waves/characters/chisa';\nconst IUNO_SOURCE = 'https://www.prydwen.gg/wuthering-waves/characters/iuno';\nconst LUPA_SOURCE = 'https://www.prydwen.gg/wuthering-waves/characters/lupa';\nconst ROVER_HAVOC_SOURCE = 'https://www.prydwen.gg/wuthering-waves/characters/rover-havoc';\nconst ROVER_SPECTRO_SOURCE = 'https://www.prydwen.gg/wuthering-waves/characters/rover-spectro';\nconst ZHEZHI_SOURCE = 'https://wuthering.gg/characters/zhezhi';\n")
          fact_anchor = "export const ZHEZHI_TUNE_BREAK_FACT = tuneBreak({ characterId: 'zhezhi', factId: 'zhezhi-tune-break-rectifier', name: 'Tune Break — Rectifier', sourceLabel: 'Wuthering.gg — current Zhezhi Tune Break entry', sourceUrl: ZHEZHI_SOURCE, checkedAt: '2026-08-28', notes: [\"When the target's Off-Tune Level is full, Zhezhi may cast Tune Break on the target. No Zhezhi-specific coefficient table is exposed.\"] });\n"
          new_facts = (
              "export const CHISA_TUNE_BREAK_FACT = tuneBreak({ characterId: 'chisa', factId: 'chisa-tune-break-broadblade', name: 'Tune Break — Broadblade', sourceLabel: 'Prydwen — current Chisa Tune Break entry', sourceUrl: CHISA_SOURCE, checkedAt: '2026-08-28', notes: [\"When the target's Off-Tune Level is full, Chisa may cast Tune Break on the target. No Chisa-specific coefficient table is exposed.\"] });\n"
              "export const IUNO_TUNE_BREAK_FACT = tuneBreak({ characterId: 'iuno', factId: 'iuno-tune-break-gauntlets', name: 'Tune Break — Gauntlets', sourceLabel: 'Prydwen — current Iuno Tune Break entry', sourceUrl: IUNO_SOURCE, checkedAt: '2026-08-28', notes: [\"When the target's Off-Tune Level is full, Iuno may cast Tune Break on the target. No Iuno-specific coefficient table is exposed.\"] });\n"
              "export const LUPA_TUNE_BREAK_FACT = tuneBreak({ characterId: 'lupa', factId: 'lupa-tune-break-broadblade', name: 'Tune Break — Broadblade', sourceLabel: 'Prydwen — current Lupa Tune Break entry', sourceUrl: LUPA_SOURCE, checkedAt: '2026-08-28', notes: [\"When the target's Off-Tune Level is full, Lupa may cast Tune Break on the target. No Lupa-specific coefficient table is exposed.\"] });\n"
              "export const ROVER_HAVOC_TUNE_BREAK_FACT = tuneBreak({ characterId: 'rover-havoc', factId: 'rover-havoc-tune-break-sword', name: 'Tune Break — Sword', sourceLabel: 'Prydwen — current Rover (Havoc) Tune Break entry', sourceUrl: ROVER_HAVOC_SOURCE, checkedAt: '2026-08-28', notes: [\"When the target's Off-Tune Level is full, Rover (Havoc) may cast Tune Break on the target. No Rover-specific coefficient table is exposed.\"] });\n"
              "export const ROVER_SPECTRO_TUNE_BREAK_FACT = tuneBreak({ characterId: 'rover-spectro', factId: 'rover-spectro-tune-break-sword', name: 'Tune Break — Sword', sourceLabel: 'Prydwen — current Rover (Spectro) Tune Break entry', sourceUrl: ROVER_SPECTRO_SOURCE, checkedAt: '2026-08-28', notes: [\"When the target's Off-Tune Level is full, Rover (Spectro) may cast Tune Break on the target. No Rover-specific coefficient table is exposed.\"] });\n"
          )
          tb_once(fact_anchor, new_facts + fact_anchor)
          tb_once("  ZHEZHI_TUNE_BREAK_FACT,\n] as const;", "  CHISA_TUNE_BREAK_FACT,\n  IUNO_TUNE_BREAK_FACT,\n  LUPA_TUNE_BREAK_FACT,\n  ROVER_HAVOC_TUNE_BREAK_FACT,\n  ROVER_SPECTRO_TUNE_BREAK_FACT,\n  ZHEZHI_TUNE_BREAK_FACT,\n] as const;")
          tb.write_text(t)
          PY
      - name: Commit registry integration
        run: |
          git config user.name "bellebing"
          git config user.email "148565035+bellebing@users.noreply.github.com"
          git add src/data/characterMechanics.ts src/data/characterMechanics/tuneBreakFacts.ts
          git commit -m "Integrate ninth Character Mechanics batch"
          git push origin HEAD:character-mechanics/ninth-batch-five
