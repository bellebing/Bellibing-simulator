name: Temporary refresh eleventh Character Mechanics snapshots

on:
  push:
    branches:
      - character-mechanics/eleventh-batch-five

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: character-mechanics/eleventh-batch-five

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Refresh exact stale snapshots
        run: python scripts/tmp-refresh-eleventh-snapshots.py

      - name: Assert snapshot-only diff
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
            'test/aaltoCharacterMechanics.test.ts',
            'test/aemeathCharacterMechanics.test.ts',
            'test/baizhiCharacterMechanics.test.ts',
            'test/brantCharacterMechanics.test.ts',
            'test/characterMechanics.test.ts',
            'test/characterMechanicsAuditHardening.test.ts',
            'test/eighthBatchCharacterMechanics.test.ts',
            'test/fifthBatchCharacterMechanics.test.ts',
            'test/fourthBatchCharacterMechanics.test.ts',
            'test/ninthBatchCharacterMechanics.test.ts',
            'test/secondBatchCharacterMechanics.test.ts',
            'test/seventhBatchCharacterMechanics.test.ts',
            'test/sixthBatchCharacterMechanics.test.ts',
            'test/starterRosterCharacterMechanics.test.ts',
            'test/tenthBatchCharacterMechanics.test.ts',
            'test/thirdBatchCharacterMechanics.test.ts',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == allowed, (changed - allowed, allowed - changed)
          PY
          git diff --check

      - name: Full test suite
        run: npm test

      - name: Commit green snapshot refresh and remove temporary files
        shell: bash
        run: |
          rm -f package-lock.json
          rm -f scripts/tmp-refresh-eleventh-snapshots.py
          rm -f .github/workflows/tmp-refresh-eleventh-snapshots.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Refresh Character Mechanics coverage snapshots"
          git push origin HEAD:character-mechanics/eleventh-batch-five
