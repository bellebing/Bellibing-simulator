name: Temporary ninth-batch snapshot refresh

on:
  push:
    branches:
      - character-mechanics/ninth-batch-five

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: character-mechanics/ninth-batch-five
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh only stale Character Mechanics coverage snapshots
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [
              'test/aaltoCharacterMechanics.test.ts',
              'test/aemeathCharacterMechanics.test.ts',
              'test/baizhiCharacterMechanics.test.ts',
              'test/brantCharacterMechanics.test.ts',
              'test/characterMechanics.test.ts',
              'test/characterMechanicsAuditHardening.test.ts',
              'test/eighthBatchCharacterMechanics.test.ts',
              'test/fifthBatchCharacterMechanics.test.ts',
              'test/fourthBatchCharacterMechanics.test.ts',
              'test/secondBatchCharacterMechanics.test.ts',
              'test/seventhBatchCharacterMechanics.test.ts',
              'test/sixthBatchCharacterMechanics.test.ts',
              'test/starterRosterCharacterMechanics.test.ts',
              'test/thirdBatchCharacterMechanics.test.ts',
          ]

          old_ids = ['aalto', 'aemeath', 'augusta', 'baizhi', 'brant', 'calcharo', 'camellya', 'carlotta', 'changli', 'chixia', 'ciaccona', 'encore', 'jianxin', 'jinhsi', 'jiyan', 'lingyang', 'lumi', 'mortefi', 'phoebe', 'roccia', 'taoqi', 'the-shorekeeper', 'verina', 'yangyang', 'yinlin', 'youhu', 'yuanwu', 'zhezhi']
          new_ids = ['aalto', 'aemeath', 'augusta', 'baizhi', 'brant', 'calcharo', 'camellya', 'carlotta', 'changli', 'chisa', 'chixia', 'ciaccona', 'encore', 'iuno', 'jianxin', 'jinhsi', 'jiyan', 'lingyang', 'lumi', 'lupa', 'mortefi', 'phoebe', 'roccia', 'rover-havoc', 'rover-spectro', 'taoqi', 'the-shorekeeper', 'verina', 'yangyang', 'yinlin', 'youhu', 'yuanwu', 'zhezhi']
          old_ids_inline = '[' + ', '.join(repr(x) for x in old_ids) + ']'
          new_ids_inline = '[' + ', '.join(repr(x) for x in new_ids) + ']'
          new_ids_multiline = '[\n' + ''.join(f"    {x!r},\n" for x in new_ids) + '  ]'

          total_changes = 0
          for name in files:
              p = Path(name)
              s = p.read_text()
              before = s

              # Inline current-registry roster snapshots.
              s = s.replace(old_ids_inline, new_ids_inline)

              # Multiline current-registry roster snapshots. Target only verifiedCharacterIds assertions.
              s = re.sub(
                  r'assert\.deepEqual\(((?:audit|coverage|report)\.verifiedCharacterIds),\s*\[(?:.|\n)*?\]\);',
                  lambda m: f'assert.deepEqual({m.group(1)}, {new_ids_multiline});',
                  s,
              )

              # Named current-coverage assertions only; no blind numeric replacement.
              for owner in ('audit', 'coverage', 'report'):
                  s = re.sub(rf'({owner}\.profileCount\s*,\s*)28\b', r'\g<1>33', s)
                  s = re.sub(rf'({owner}\.verifiedCharacterIds\.length\s*,\s*)28\b', r'\g<1>33', s)
                  s = re.sub(rf'({owner}\.unstartedCharacterIds\.length\s*,\s*)29\b', r'\g<1>24', s)
              s = re.sub(r'(CHARACTER_MECHANIC_FACTS\.length\s*,\s*)889\b', r'\g<1>1068', s)
              s = re.sub(r'(CHARACTER_MECHANIC_FACT_BY_ID\.size\s*,\s*)889\b', r'\g<1>1068', s)

              # Human-readable names for current-registry snapshot tests.
              s = s.replace('twenty-eight source-complete characters with 29 released characters unstarted', 'thirty-three source-complete characters with 24 released characters unstarted')
              s = s.replace('twenty-eight source-complete characters with 29 unstarted', 'thirty-three source-complete characters with 24 unstarted')
              s = s.replace('twenty-eight released characters source-complete', 'thirty-three released characters source-complete')
              s = s.replace('eighth Character Mechanics batch advances canonical coverage to 28 verified / 29 unstarted / 889 facts', 'eighth Character Mechanics batch remains valid after ninth-batch coverage reaches 33 verified / 24 unstarted / 1068 facts')
              s = s.replace('seventh Character Mechanics batch remains valid after eighth-batch coverage reaches 28 verified / 29 unstarted / 889 facts', 'seventh Character Mechanics batch remains valid after ninth-batch coverage reaches 33 verified / 24 unstarted / 1068 facts')

              if s != before:
                  p.write_text(s)
                  total_changes += 1

          if total_changes != 14:
              raise SystemExit(f'Expected all 14 known stale snapshot files to change, changed {total_changes}')

          # Fail closed on any old current-registry snapshots in this exact scope.
          for name in files:
              s = Path(name).read_text()
              if old_ids_inline in s:
                  raise SystemExit(f'Stale inline verified ID snapshot survived in {name}')
              if re.search(r'CHARACTER_MECHANIC_FACT_BY_ID\.size\s*,\s*889\b', s):
                  raise SystemExit(f'Stale fact-map count survived in {name}')
              if re.search(r'(?:audit|coverage|report)\.profileCount\s*,\s*28\b', s):
                  raise SystemExit(f'Stale profile count survived in {name}')
              if re.search(r'(?:audit|coverage|report)\.unstartedCharacterIds\.length\s*,\s*29\b', s):
                  raise SystemExit(f'Stale unstarted count survived in {name}')
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Full tests before commit
        run: npm test
      - name: Commit refreshed snapshots
        run: |
          git config user.name bellebing
          git config user.email 148565035+bellebing@users.noreply.github.com
          git add test/*.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "Refresh ninth-batch Character Mechanics snapshots"
          git push origin HEAD:character-mechanics/ninth-batch-five
