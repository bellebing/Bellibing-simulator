name: Temporary refresh tenth Character Mechanics snapshots

on:
  push:
    branches:
      - character-mechanics/tenth-batch-five

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: character-mechanics/tenth-batch-five

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Refresh exact stale coverage snapshots
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          expected_files = {
              'test/aaltoCharacterMechanics.test.ts',
              'test/aemeathCharacterMechanics.test.ts',
              'test/baizhiCharacterMechanics.test.ts',
              'test/brantCharacterMechanics.test.ts',
              'test/characterMechanics.test.ts',
              'test/characterMechanicsAuditHardening.test.ts',
              'test/eighthBatchCharacterMechanics.test.ts',
              'test/fifthBatchCharacterMechanics.test.ts',
              'test/fourthBatchCharacterMechanics.test.ts',
              'test/ninthBatchCharacterMechanics.test.ts',
              'test/secondBatchCharacterMechanics.test.ts',
              'test/seventhBatchCharacterMechanics.test.ts',
              'test/sixthBatchCharacterMechanics.test.ts',
              'test/starterRosterCharacterMechanics.test.ts',
              'test/thirdBatchCharacterMechanics.test.ts',
          }
          old_ids = [
              'aalto','aemeath','augusta','baizhi','brant','calcharo','camellya','carlotta','changli','chisa','chixia','ciaccona','encore','iuno','jianxin','jinhsi','jiyan','lingyang','lumi','lupa','mortefi','phoebe','roccia','rover-havoc','rover-spectro','taoqi','the-shorekeeper','verina','yangyang','yinlin','youhu','yuanwu','zhezhi'
          ]
          new_ids = [
              'aalto','aemeath','augusta','baizhi','brant','calcharo','camellya','carlotta','changli','chisa','chixia','ciaccona','denia','encore','hiyuki','iuno','jianxin','jinhsi','jiyan','lingyang','lumi','lupa','mortefi','phoebe','qingxiao','roccia','rover-aero','rover-havoc','rover-spectro','taoqi','the-shorekeeper','verina','yangyang','yangyang-xuanling','yinlin','youhu','yuanwu','zhezhi'
          ]

          def replace_verified_arrays(text: str) -> tuple[str, int]:
              count = 0
              pattern = re.compile(r"assert\.deepEqual\(audit\.verifiedCharacterIds,\s*\[(.*?)\]\s*\);", re.S)
              def repl(m):
                  nonlocal count
                  ids = re.findall(r"['\"]([^'\"]+)['\"]", m.group(1))
                  if ids != old_ids:
                      return m.group(0)
                  indent_match = re.search(r"\n(\s*)['\"]", m.group(1))
                  indent = indent_match.group(1) if indent_match else '    '
                  rendered = ',\n'.join(f"{indent}'{cid}'" for cid in new_ids)
                  count += 1
                  return f"assert.deepEqual(audit.verifiedCharacterIds, [\n{rendered},\n  ]);"
              return pattern.sub(repl, text), count

          changed = set()
          roster_replacements = 0
          for file_name in sorted(expected_files):
              path = Path(file_name)
              original = path.read_text()
              text = original

              # Only named coverage snapshot expressions; never touch negative audit fixtures.
              patterns = [
                  (r"(assert\.(?:equal|strictEqual)\(\s*audit\.profileCount\s*,\s*)33(\s*[,\)])", r"\g<1>38\g<2>"),
                  (r"(assert\.(?:equal|strictEqual)\(\s*audit\.verifiedCharacterIds\.length\s*,\s*)33(\s*[,\)])", r"\g<1>38\g<2>"),
                  (r"(assert\.(?:equal|strictEqual)\(\s*audit\.unstartedCharacterIds\.length\s*,\s*)24(\s*[,\)])", r"\g<1>19\g<2>"),
                  (r"(assert\.(?:equal|strictEqual)\(\s*CHARACTER_MECHANIC_FACT_BY_ID\.size\s*,\s*)1068(\s*[,\)])", r"\g<1>1261\g<2>"),
                  (r"(assert\.(?:equal|strictEqual)\(\s*CHARACTER_MECHANIC_FACTS\.length\s*,\s*)1068(\s*[,\)])", r"\g<1>1261\g<2>"),
              ]
              for pattern, replacement in patterns:
                  text = re.sub(pattern, replacement, text)

              text, n = replace_verified_arrays(text)
              roster_replacements += n

              # Keep human-readable snapshot titles synchronized, but only inside the known stale files.
              text = text.replace('thirty-three source-complete', 'thirty-eight source-complete')
              text = text.replace('thirty-three released characters source-complete', 'thirty-eight released characters source-complete')
              text = text.replace('33 verified / 24 unstarted / 1068 facts', '38 verified / 19 unstarted / 1261 facts')
              text = text.replace('33 VERIFIED / 24 UNSTARTED / 1068', '38 VERIFIED / 19 UNSTARTED / 1261')
              text = text.replace('33 source-complete characters with 24', '38 source-complete characters with 19')
              text = text.replace('thirty-three source-complete characters with 24', 'thirty-eight source-complete characters with 19')

              if text != original:
                  path.write_text(text)
                  changed.add(file_name)

          if changed != expected_files:
              missing = sorted(expected_files - changed)
              extra = sorted(changed - expected_files)
              raise SystemExit(f'Unexpected snapshot changed-file set. missing={missing} extra={extra}')
          if roster_replacements < 2:
              raise SystemExit(f'Expected at least two exact old verified-roster snapshot replacements; got {roster_replacements}')

          # Fail closed if any known old global snapshot assertions survived.
          survivors = []
          checks = [
              re.compile(r"assert\.(?:equal|strictEqual)\(\s*audit\.profileCount\s*,\s*33"),
              re.compile(r"assert\.(?:equal|strictEqual)\(\s*audit\.verifiedCharacterIds\.length\s*,\s*33"),
              re.compile(r"assert\.(?:equal|strictEqual)\(\s*audit\.unstartedCharacterIds\.length\s*,\s*24"),
              re.compile(r"assert\.(?:equal|strictEqual)\(\s*CHARACTER_MECHANIC_FACT_BY_ID\.size\s*,\s*1068"),
              re.compile(r"assert\.(?:equal|strictEqual)\(\s*CHARACTER_MECHANIC_FACTS\.length\s*,\s*1068"),
          ]
          for path in Path('test').glob('*.test.ts'):
              data = path.read_text()
              if any(rx.search(data) for rx in checks):
                  survivors.append(str(path))
          if survivors:
              raise SystemExit(f'Old coverage snapshot assertions remain: {sorted(survivors)}')

          print(f'Updated {len(changed)} exact stale snapshot files; verified-roster arrays replaced: {roster_replacements}')
          PY

      - name: Full test suite
        run: npm test

      - name: Commit only green snapshot refresh and remove temp workflow
        shell: bash
        run: |
          rm -f package-lock.json
          rm .github/workflows/tmp-refresh-tenth-snapshots.yml
          git diff --check
          git config user.name bellebing
          git config user.email 148565035+bellebing@users.noreply.github.com
          git add -A
          git commit -m "Refresh Character Mechanics coverage snapshots"
          git push origin HEAD:character-mechanics/tenth-batch-five
