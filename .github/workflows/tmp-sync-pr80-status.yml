name: Temporary sync PR80 Character Mechanics status

on:
  push:
    branches:
      - character-mechanics/eleventh-batch-five

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: character-mechanics/eleventh-batch-five

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Sync PROJECT_STATUS
        run: python scripts/tmp-sync-pr80-status.py

      - name: Assert status-only diff
        shell: bash
        run: |
          test "$(git diff --name-only)" = "docs/PROJECT_STATUS.md"
          git diff --check

      - name: Full test suite
        run: npm test

      - name: Commit green status sync and remove temporary files
        shell: bash
        run: |
          rm -f package-lock.json
          rm -f scripts/tmp-sync-pr80-status.py
          rm -f .github/workflows/tmp-sync-pr80-status.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Sync PR80 Character Mechanics project status"
          git push origin HEAD:character-mechanics/eleventh-batch-five
