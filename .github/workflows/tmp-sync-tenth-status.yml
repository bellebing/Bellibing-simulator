name: Temporary sync tenth Character Mechanics status

on:
  push:
    branches:
      - character-mechanics/tenth-batch-five

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: character-mechanics/tenth-batch-five
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Apply exact status sync
        run: python scripts/tmp-sync-tenth-status.py
      - name: Full test suite
        run: npm test
      - name: Commit green status sync and remove temp files
        run: |
          rm -f package-lock.json
          rm scripts/tmp-sync-tenth-status.py
          rm .github/workflows/tmp-sync-tenth-status.yml
          git diff --check
          git config user.name bellebing
          git config user.email 148565035+bellebing@users.noreply.github.com
          git add -A
          git commit -m "Sync tenth Character Mechanics project status"
          git push origin HEAD:character-mechanics/tenth-batch-five
