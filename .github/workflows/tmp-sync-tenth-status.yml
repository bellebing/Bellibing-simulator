name: Temporary sync tenth Character Mechanics status

on:
  push:
    branches:
      - character-mechanics/tenth-batch-five

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: character-mechanics/tenth-batch-five

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Sync PROJECT_STATUS and stale test titles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/PROJECT_STATUS.md')
          text = path.read_text()

          assert 'PR #79 source-audits and canonically promotes Denia' not in text
          marker = '\n\nCurrent Character mechanics coverage:'
          assert text.count(marker) == 1
          pr79 = """

PR #79 source-audits and canonically promotes Denia, Hiyuki, Qingxiao, Rover (Aero) and Yangyang: Xuanling from the PR #66/#68 promotion-review pipeline after explicit semantic/source review. Exact tabular numerics remain sourced from the pinned review artifact while description/state semantics are verified separately rather than inferred from parameter ordering. Denia keeps conditional Void Particle/Liberation classification separate from base action ownership. Hiyuki keeps Glacio Bite/Fine Snow negative-status semantics outside Character ACTION damage and retains the Snowforged per-blade modifier as `PENDING_INTERPRETATION`. Qingxiao preserves Mindlock/Heaven's Clarity and gauge semantics separately from damage while its already-registered static Max Energy exception remains pending outside Character Mechanics. Rover (Aero) preserves Windstrings/Forte state and explicit Skill-damage overrides with a non-damage Outro. Yangyang: Xuanling preserves Heavy Attack damage overrides, Melody/Azure Plume resources and source-fixed Outro damage separately from Tonal Switch state semantics. All five retain Tune Break at the shared-system boundary.
"""
          text = text.replace(marker, pr79 + marker)

          replacements = {
              '- 33 characters have fully `VERIFIED` mechanics profiles;': '- 38 characters have fully `VERIFIED` mechanics profiles;',
              '- 24 released characters remain `UNSTARTED` for canonical Character mechanics promotion/source verification;': '- 19 released characters remain `UNSTARTED` for canonical Character mechanics promotion/source verification;',
              '- 1068 canonical Character mechanic facts now exist across the 33 verified profiles, including exactly one current Tune Break fact per verified profile;': '- 1261 canonical Character mechanic facts now exist across the 38 verified profiles, including exactly one current Tune Break fact per verified profile;',
              "- all 33 verified profiles' `RAW_FACTS` preflight passes only when their canonical structural audit is clean, while independent build/team/rotation/combat-profile requirements continue to gate later stages.": "- all 38 verified profiles pass the Character Mechanics structural/source audit; 37 currently pass the full `RAW_FACTS` preflight, while Qingxiao remains correctly blocked there only by the independent registered static `maxEnergy` / `IDENTITY_LEVEL90` pending exception. Build/team/rotation/combat-profile requirements continue to gate later stages.",
              '- audit and promote source-backed skill/Forte/passive/resource/Outro/sequence semantics for the remaining 24 released characters using the promotion-review artifacts rather than hand-entering source tables or description numerics;': '- audit and promote source-backed skill/Forte/passive/resource/Outro/sequence semantics for the remaining 19 released characters using the promotion-review artifacts rather than hand-entering source tables or description numerics;',
              '**Important:** twenty-eight `VERIFIED` raw characters do not make the roster complete.': '**Important:** thirty-eight `VERIFIED` Character Mechanics profiles do not make the roster complete.',
          }
          for old, new in replacements.items():
              assert text.count(old) == 1, old
              text = text.replace(old, new)

          bullet_insertions = [
              ("- **Ciaccona: `VERIFIED` raw mechanics coverage** across all six required areas, with Heavy Attack classification on Quadruple Downbeat, explicit Musical Essence/Ensemble Sylph resource caps, target-facing Windcalling Tune Outro semantics, S1-S6 and Tune Break: Pistols;\n", "- **Denia: `VERIFIED` raw mechanics coverage** across all six required areas, with conditional Void Particle/Liberation damage classification separated from base action ownership, three explicit Forte/resource gauges, Inherents, Outro, S1-S6 and Tune Break at the shared-system boundary;\n"),
              ("- **Encore: `VERIFIED` raw mechanics coverage** across all six required areas, with Mayhem/Cosmos Rave semantics, source-preserved replacement damage buckets, source-fixed Thermal Field Outro, Inherents, S1-S6 and Tune Break: Rectifier;\n", "- **Hiyuki: `VERIFIED` raw mechanics coverage** across all six required areas, with Character-owned damage separated from Glacio Bite/Fine Snow negative-status semantics, Snowforged per-blade modifier retained as `PENDING_INTERPRETATION`, five explicit Forte resources, Inherents, Outro, S1-S6 and Tune Break at the shared-system boundary;\n"),
              ("- **Phoebe: `VERIFIED` raw mechanics coverage** across all six required areas, with Prayer/Divine Voice state semantics, source-preserved damage buckets, source-fixed Attentive Heart Outro damage kept separate from conditional state modifiers, S1-S6 and Tune Break: Rectifier;\n", "- **Qingxiao: `VERIFIED` raw mechanics coverage** across all six required areas, with three explicit gauges plus Mindlock/Heaven's Clarity state semantics, source-preserved damage buckets and source-fixed Outro. Its separate static Max Energy exception remains pending and therefore still blocks full `RAW_FACTS` readiness without invalidating Character Mechanics verification;\n"),
              ("- **Rover (Havoc): `VERIFIED` raw mechanics coverage** across all six required areas, with Umbra/Dark Surge state semantics, Devastation/Thwackblade Heavy and Lifetaker Skill classification, source-fixed Soundweaver Outro cadence, Inherents, S1-S6 and Tune Break: Sword;\n", "- **Rover (Aero): `VERIFIED` raw mechanics coverage** across all six required areas, with Windstrings max 120, source-preserved Skill damage overrides, healing/utility kept outside damage fields, non-damage Outro semantics, Inherents, S1-S6 and Tune Break: Sword;\n"),
              ("- **Yangyang: `VERIFIED` raw mechanics coverage** across all six required areas, with Melody/Forte semantics, source-preserved consumption boundaries and current Tune Break: Sword access;\n", "- **Yangyang: Xuanling: `VERIFIED` raw mechanics coverage** across all six required areas, with Heavy Attack damage overrides separated from action ownership, Melody max 100 / Azure Plume max 2 resources, source-fixed Outro damage separated from Tonal Switch state semantics, Inherents, S1-S6 and Tune Break at the shared-system boundary;\n"),
          ]
          for anchor, addition in bullet_insertions:
              assert text.count(anchor) == 1, anchor[:80]
              text = text.replace(anchor, anchor + addition)

          blocker_anchor = "- Buling remains unpromoted because the Five Thunders Spell Array damage-bonus bucket is not explicitly confirmed by the current reviewed sources; Bellibing does not infer it merely from surrounding Resonance Liberation replacement semantics;\n"
          assert text.count(blocker_anchor) == 1
          extra_blockers = """- Phrolova and Sigrika remain unpromoted because current sources explicitly assign Character-owned kit damage to Echo Skill DMG and the current Character damage-class schema has no truthful `ECHO` bucket;
- Lynae remains unpromoted because Spectral Analysis is explicitly Tune Rupture DMG while the current Character damage-class schema has no truthful `TUNE_RUPTURE` bucket;
- Rebecca and Lucy remain unpromoted where current source semantics require Hack damage classification that the current Character damage-class schema cannot represent truthfully;
- Luuk Herssen remains unpromoted because the reviewed source includes fixed-flat damage semantics that the current Character coefficient representation cannot encode without distortion;
- Rover (Electro) remains unpromoted because the pinned promotion-review import is internally misaligned/corrupted for this source slice and must be repaired or independently reconstructed before canonical promotion;
- Suisui remains unpromoted while current-source/artifact nomenclature and Tune Break semantics conflict; no source identity or shared-system transition is guessed merely to advance coverage;
"""
          text = text.replace(blocker_anchor, blocker_anchor + extra_blockers)

          lines = text.splitlines()
          replaced5 = replaced7 = False
          for i, line in enumerate(lines):
              if line.startswith('5. **IN PROGRESS'):
                  lines[i] = "5. **IN PROGRESS — PR #38/#39/#40/#41/#54/#55/#56/#57/#58/#60/#61/#63/#65/#66/#68/#69/#70/#71/#72/#73/#74/#75/#77/#78/#79:** Character static/core + intrinsic gates, generic mechanics architecture, fact-backed source-completeness gates, source-fixed damage support, roster-wide candidate/description automation and controlled semantic promotions are in place. Current Character Mechanics coverage is 38 VERIFIED / 0 PARTIAL / 19 UNSTARTED / 1261 canonical facts. Qingxiao's independent static Max Energy exception remains explicit and does not get hidden by mechanics verification. The current 57-character source snapshot has zero unstructured tabular rows and zero raw description parameters; remaining work is semantic/source review. **Roster-wide Character mechanics fact coverage remains the active Pre-DPS blocker.**"
                  replaced5 = True
              if line.startswith('7. **CURRENT RETURN CHECKPOINT:**'):
                  lines[i] = "7. **CURRENT RETURN CHECKPOINT:** Use the PR #66/#68 promotion-review artifacts to audit/promote the remaining 19 Character mechanics profiles in controlled source-reviewed batches. Do not manually retype source tables or description numerics already represented by the pipeline. Keep explicit blockers pending rather than coercing unsupported damage classes or conflicting source semantics: Danjin, Xiangli Yao, Sanhua, ECHO-class cases, Tune Rupture cases, Hack-class cases, Zani's multi-status/Frazzle semantics, Buling's unresolved array bucket, Luuk Herssen's fixed-flat representation gap, Rover (Electro)'s malformed import and Suisui's source conflict. Do not jump to Echo/Sonata or broad DPS while released-roster Character Mechanics coverage remains open."
                  replaced7 = True
          assert replaced5 and replaced7
          text = '\n'.join(lines) + '\n'
          path.write_text(text)

          title_old = 'thirty-eight source-complete characters with 24 released characters unstarted'
          title_new = 'thirty-eight source-complete characters with 19 released characters unstarted'
          title_count = 0
          for test_path in Path('test').glob('*.test.ts'):
              data = test_path.read_text()
              if title_old in data:
                  title_count += data.count(title_old)
                  test_path.write_text(data.replace(title_old, title_new))
          assert title_count >= 1, 'expected at least one stale human-readable 24-unstarted title'

          assert '33 characters have fully `VERIFIED` mechanics profiles' not in text
          assert 'remaining 24 released characters' not in text
          assert '1068 canonical Character mechanic facts now exist across the 33' not in text
          assert 'twenty-eight `VERIFIED` raw characters' not in text
          print(f'PROJECT_STATUS synced; stale test titles fixed: {title_count}')
          PY

      - name: Full test suite
        run: npm test

      - name: Commit green status sync and remove temp workflow
        shell: bash
        run: |
          rm -f package-lock.json
          rm .github/workflows/tmp-sync-tenth-status.yml
          git diff --check
          git config user.name bellebing
          git config user.email 148565035+bellebing@users.noreply.github.com
          git add -A
          git commit -m "Sync tenth Character Mechanics project status"
          git push origin HEAD:character-mechanics/tenth-batch-five
