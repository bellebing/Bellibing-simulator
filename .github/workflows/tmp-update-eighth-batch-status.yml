name: Temporary eighth-batch status updater

on:
  push:
    branches:
      - character-mechanics/eighth-batch-six

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: character-mechanics/eighth-batch-six
          fetch-depth: 0
      - name: Apply exact PROJECT_STATUS updates
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/PROJECT_STATUS.md')
          text = path.read_text()

          replacements = {
            "- 35 released characters remain `UNSTARTED` for canonical Character mechanics promotion/source verification;": "- 29 released characters remain `UNSTARTED` for canonical Character mechanics promotion/source verification;",
            "- 698 canonical Character mechanic facts now exist across the 22 verified profiles, including exactly one current Tune Break fact per verified profile;": "- 889 canonical Character mechanic facts now exist across the 28 verified profiles, including exactly one current Tune Break fact per verified profile;",
            "- all 22 verified profiles' `RAW_FACTS` preflight passes only when their canonical structural audit is clean, while independent build/team/rotation/combat-profile requirements continue to gate later stages.": "- all 28 verified profiles' `RAW_FACTS` preflight passes only when their canonical structural audit is clean, while independent build/team/rotation/combat-profile requirements continue to gate later stages.",
          }
          for old, new in replacements.items():
            if old in text:
              text = text.replace(old, new, 1)

          chixia = "- **Chixia: `VERIFIED` raw mechanics coverage** across all six required areas, including source-fixed Leaping Flames Outro damage and current Tune Break: Pistols access;\n"
          new_profiles = (
            "- **Ciaccona: `VERIFIED` raw mechanics coverage** across all six required areas, with Heavy Attack classification on Quadruple Downbeat, explicit Musical Essence/Ensemble Sylph resource caps, target-facing Windcalling Tune Outro semantics, S1-S6 and Tune Break: Pistols;\n"
            "- **Jianxin: `VERIFIED` raw mechanics coverage** across all six required areas, with Chi/Forte state semantics and Pushing Punch/Zhoutian/Shock/Yielding Pull preserved in the Heavy Attack DMG bucket, plus Inherents, Outro, S1-S6 and Tune Break: Gauntlets;\n"
            "- **Jinhsi: `VERIFIED` raw mechanics coverage** across all six required areas, with Incarnation Basic stages kept as Resonance Skill DMG, Incarnation Heavy Attack/Dodge Counter kept as Basic Attack DMG, Incandescence's Stella Glamor multiplier retained separately as `PENDING_INTERPRETATION`, plus S1-S6 and Tune Break: Broadblade;\n"
            "- **Lumi: `VERIFIED` raw mechanics coverage** across all six required areas, with Red/Yellow Light Spark resource caps, source-preserved Basic Attack damage conversions, Inherents, Outro, S1-S6 and Tune Break: Broadblade;\n"
            "- **Phoebe: `VERIFIED` raw mechanics coverage** across all six required areas, with Prayer/Divine Voice state semantics, source-preserved damage buckets, source-fixed Attentive Heart Outro damage kept separate from conditional state modifiers, S1-S6 and Tune Break: Rectifier;\n"
            "- **The Shorekeeper: `VERIFIED` raw mechanics coverage** across all six required areas, with Collapsed Core/Empirical Data/Deductive Data state semantics, HP-scaling Discernment and its explicit Resonance Liberation DMG classification, Inherents, Outro, S1-S6 and Tune Break: Rectifier;\n"
          )
          if new_profiles not in text:
            assert chixia in text, 'Chixia coverage insertion marker missing'
            text = text.replace(chixia, chixia + new_profiles, 1)

          stale = [
            "- 35 released characters remain `UNSTARTED`",
            "- 698 canonical Character mechanic facts",
            "- all 22 verified profiles' `RAW_FACTS`",
            "- 22 characters have fully `VERIFIED` mechanics profiles;",
            "remaining 35 released characters",
            "twenty-two `VERIFIED` raw characters",
          ]
          assert not any(item in text for item in stale), 'stale Character Mechanics checkpoint remains'
          assert "- 28 characters have fully `VERIFIED` mechanics profiles;" in text
          assert "- 29 released characters remain `UNSTARTED`" in text
          assert "- 889 canonical Character mechanic facts now exist across the 28 verified profiles" in text
          assert "PR #76 source-audits and canonically promotes Ciaccona, Phoebe, The Shorekeeper, Jianxin, Lumi and Jinhsi" in text
          assert "Qiuyuan remains unpromoted because current sources explicitly classify part of his kit as Echo Skill DMG" in text
          assert new_profiles in text
          path.write_text(text)
          PY
      - name: Commit status update if needed
        run: |
          if git diff --quiet -- docs/PROJECT_STATUS.md; then
            echo "PROJECT_STATUS already current"
            exit 0
          fi
          git config user.name "bellebing"
          git config user.email "148565035+bellebing@users.noreply.github.com"
          git add docs/PROJECT_STATUS.md
          git commit -m "Finish project status for eighth Character Mechanics batch"
          git push origin HEAD:character-mechanics/eighth-batch-six
