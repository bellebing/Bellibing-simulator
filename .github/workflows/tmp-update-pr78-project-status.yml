name: Temporary PR78 project status sync

on:
  push:
    branches:
      - character-mechanics/ninth-batch-five

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: character-mechanics/ninth-batch-five
      - name: Update PROJECT_STATUS for ninth Character Mechanics batch
        shell: python
        run: |
          from pathlib import Path

          p = Path('docs/PROJECT_STATUS.md')
          s = p.read_text()

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              s = s.replace(old, new, 1)

          # Correct the previous merge reference: draft #76 was superseded; exact same batch merged as PR #77.
          replace_once(
              'PR #76 source-audits and canonically promotes Ciaccona, Phoebe, The Shorekeeper, Jianxin, Lumi and Jinhsi as one six-character Character Mechanics batch.',
              'PR #77 source-audits and canonically promotes Ciaccona, Phoebe, The Shorekeeper, Jianxin, Lumi and Jinhsi as one six-character Character Mechanics batch.',
              'PR77 history correction',
          )

          insert_anchor = 'All six retain Tune Break at the shared-system boundary.\n\nCurrent Character mechanics coverage:'
          insert_text = '''All six retain Tune Break at the shared-system boundary.

PR #78 source-audits and canonically promotes Chisa, Lupa, Iuno, Rover (Havoc) and Rover (Spectro) from the PR #66/#68 promotion-review pipeline after explicit semantic/source review. Chisa keeps Death Snip, Sawring - Blitz, Chainsaw Mode - Dodge Counter and Sawring - Eradication in the source-stated Resonance Liberation DMG bucket while its per-Ring Eradication multiplier remains a separate `PENDING_INTERPRETATION` modifier rather than pre-summed damage. Lupa preserves Firestrike as Heavy Attack DMG, Foebreaker/Set the Arena Ablaze as Resonance Skill DMG and its Dance/Climax/Nowhere to Run! family as Resonance Liberation DMG. Iuno keeps Moonbow/Flux/Absolute Fullness in the explicit Resonance Liberation DMG bucket, source-fixed 100% ATK Outro damage separate from the 50% Heavy Attack amplification, and records the current S4 shield-source conflict instead of hiding it. Rover (Havoc) preserves Heavy-versus-Skill overrides and source-fixed Soundweaver cadence; Rover (Spectro) keeps Resonating Echoes trigger ownership separate from its explicit Resonance Skill DMG classification while Instant remains non-damage stasis. All five retain Tune Break at the shared-system boundary.

Current Character mechanics coverage:'''
          replace_once(insert_anchor, insert_text, 'PR78 history insertion')

          replace_once('- 28 characters have fully `VERIFIED` mechanics profiles;', '- 33 characters have fully `VERIFIED` mechanics profiles;', 'verified profile count')

          jinhsi_anchor = "- **Jinhsi: `VERIFIED` raw mechanics coverage** across all six required areas, with Incarnation Basic stages kept as Resonance Skill DMG, Incarnation Heavy Attack/Dodge Counter kept as Basic Attack DMG, Incandescence's Stella Glamor multiplier retained separately as `PENDING_INTERPRETATION`, plus S1-S6 and Tune Break: Broadblade;"
          latest_bullets = jinhsi_anchor + '''
- **Chisa: `VERIFIED` raw mechanics coverage** across all six required areas, with Death Snip/Sawring/Chainsaw-mode Resonance Liberation DMG overrides, Ring of Chainsaw/Lifethread state rules, separate per-Ring Eradication modifier semantics, Inherents, Outro, S1-S6 and Tune Break: Broadblade;
- **Lupa: `VERIFIED` raw mechanics coverage** across all six required areas, with source-preserved Heavy/Skill/Liberation damage-bucket boundaries, Wolflame/Wolfaith and Wildfire Banner state rules, Inherents, Outro, S1-S6 and Tune Break: Broadblade;
- **Iuno: `VERIFIED` raw mechanics coverage** across all six required areas, with Moonring-versus-Moonbow/Flux/Absolute Fullness damage-bucket boundaries, Sentience/Lunar Cycle/Full Moon Domain state rules, source-fixed From Gloom to Gleam Outro damage kept separate from its amplification, current S4 conflict provenance, S1-S6 and Tune Break: Gauntlets;
- **Rover (Havoc): `VERIFIED` raw mechanics coverage** across all six required areas, with Umbra/Dark Surge state semantics, Devastation/Thwackblade Heavy and Lifetaker Skill classification, source-fixed Soundweaver Outro cadence, Inherents, S1-S6 and Tune Break: Sword;
- **Rover (Spectro): `VERIFIED` raw mechanics coverage** across all six required areas, with Diminutive Sound/Forte transitions, Resonating Spin/Whirl/Echoes explicitly classified as Resonance Skill DMG despite mixed action ownership, non-damage Instant Outro, Inherents, S1-S6 and Tune Break: Sword;'''
          replace_once(jinhsi_anchor, latest_bullets, 'latest verified profile bullets')

          replace_once('- 29 released characters remain `UNSTARTED` for canonical Character mechanics promotion/source verification;', '- 24 released characters remain `UNSTARTED` for canonical Character mechanics promotion/source verification;', 'unstarted count')
          replace_once('- 889 canonical Character mechanic facts now exist across the 28 verified profiles, including exactly one current Tune Break fact per verified profile;', '- 1068 canonical Character mechanic facts now exist across the 33 verified profiles, including exactly one current Tune Break fact per verified profile;', 'canonical fact count')
          replace_once("- all 28 verified profiles' `RAW_FACTS` preflight passes only when their canonical structural audit is clean, while independent build/team/rotation/combat-profile requirements continue to gate later stages.", "- all 33 verified profiles' `RAW_FACTS` preflight passes only when their canonical structural audit is clean, while independent build/team/rotation/combat-profile requirements continue to gate later stages.", 'RAW_FACTS profile count')

          old_qiuyuan = "- Qiuyuan remains unpromoted because current sources explicitly classify part of his kit as Echo Skill DMG while the current Character Mechanics damage-class schema has no truthful `ECHO` bucket; Bellibing will not coerce that source fact into `OTHER` merely to advance coverage;"
          new_blockers = '''- Qiuyuan, Cantarella, Cartethyia, Lucilla and Galbrena remain unpromoted where current sources explicitly classify Character-owned kit damage as Echo Skill DMG while the current Character Mechanics damage-class schema has no truthful `ECHO` bucket; Bellibing will not coerce those source facts into `OTHER` merely to advance coverage;
- Mornye remains unpromoted because Particle Jet is explicitly Tune Rupture DMG while the current Character Mechanics damage-class schema has no truthful `TUNE_RUPTURE` bucket;
- Zani remains unpromoted because current source semantics combine Heavy Attack and Spectro Frazzle damage meaning for Inferno actions and Spectro Frazzle DMG on Outro; the current single `damageClass` field cannot represent that truthfully;
- Buling remains unpromoted because the Five Thunders Spell Array damage-bonus bucket is not explicitly confirmed by the current reviewed sources; Bellibing does not infer it merely from surrounding Resonance Liberation replacement semantics;'''
          replace_once(old_qiuyuan, new_blockers, 'expanded schema/source blockers')

          replace_once('audit and promote source-backed skill/Forte/passive/resource/Outro/sequence semantics for the remaining 29 released characters', 'audit and promote source-backed skill/Forte/passive/resource/Outro/sequence semantics for the remaining 24 released characters', 'remaining roster work')

          p.write_text(s)
      - name: Verify status checkpoint text
        run: |
          grep -F '33 characters have fully `VERIFIED` mechanics profiles' docs/PROJECT_STATUS.md
          grep -F '24 released characters remain `UNSTARTED`' docs/PROJECT_STATUS.md
          grep -F '1068 canonical Character mechanic facts now exist across the 33 verified profiles' docs/PROJECT_STATUS.md
          grep -F 'PR #78 source-audits and canonically promotes Chisa, Lupa, Iuno, Rover (Havoc) and Rover (Spectro)' docs/PROJECT_STATUS.md
          grep -F 'Qiuyuan, Cantarella, Cartethyia, Lucilla and Galbrena remain unpromoted' docs/PROJECT_STATUS.md
          ! grep -F 'PR #76 source-audits and canonically promotes Ciaccona' docs/PROJECT_STATUS.md
      - name: Commit status and remove temporary workflow
        run: |
          rm .github/workflows/tmp-update-pr78-project-status.yml
          git config user.name bellebing
          git config user.email 148565035+bellebing@users.noreply.github.com
          git add docs/PROJECT_STATUS.md .github/workflows/tmp-update-pr78-project-status.yml
          git commit -m "Update project status for ninth Character Mechanics batch"
          git push origin HEAD:character-mechanics/ninth-batch-five
