name: Temporary ninth-batch cleanup

on:
  push:
    branches:
      - character-mechanics/ninth-batch-five
    paths:
      - .github/workflows/tmp-upload-ninth-batch.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: character-mechanics/ninth-batch-five
          fetch-depth: 0
      - name: Remove transport files
        run: |
          git config user.name "bellebing"
          git config user.email "148565035+bellebing@users.noreply.github.com"
          git rm .github/tmp/ninth-payload-0.txt .github/tmp/ninth-payload-1.txt .github/tmp/ninth-payload-2.txt .github/tmp/ninth-payload-3.txt .github/tmp/ninth-payload-4.txt .github/workflows/tmp-upload-ninth-batch.yml
          git commit -m "Remove ninth-batch transport files"
          git push origin HEAD:character-mechanics/ninth-batch-five
