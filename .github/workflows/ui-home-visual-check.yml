name: New UI Home Visual Check

on:
  pull_request:
    paths:
      - 'docs/ui-prototypes/v34-functional.html'
      - 'docs/ui-prototypes/assets/v34/**'
      - 'scripts/build-web.mjs'
      - '.github/workflows/ui-home-visual-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Capture New UI Home in Chrome
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/bellibing-ui-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ui-preview/ >/dev/null; then
              break
            fi
            sleep 0.25
          done
          google-chrome --version
          google-chrome             --headless=new             --no-sandbox             --disable-gpu             --hide-scrollbars             --window-size=1440,900             --screenshot=artifacts/ui-preview-home-1440x900.png             http://127.0.0.1:4173/ui-preview/
          test -s artifacts/ui-preview-home-1440x900.png

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: bellibing-new-ui-home-visual
          path: artifacts/ui-preview-home-1440x900.png
          if-no-files-found: error
          retention-days: 7
