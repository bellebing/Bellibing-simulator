name: UI Lab Review

on:
  pull_request:
    paths:
      - 'docs/ui-lab/**'
      - '.github/workflows/ui-lab-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-lab-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fetch the approved V1.1 comparison revision
        run: git fetch --depth=1 origin 66d72f339e3c1aa363a1794ff243128d63bc3f28
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser driver without changing dependency manifests
        run: npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
      - name: Preserved baseline, isolation and discard boundaries
        run: node --experimental-strip-types --test docs/ui-lab/tools/state.test.mjs docs/ui-lab/tools/configuration.test.mjs test/simulationConfigurationBridge.test.mjs test/sandboxFoundation.test.mjs test/simulatedResourceCost.test.mjs test/characterContext.test.mjs test/sandboxStaticStats.test.mjs test/sourcePriorityGuidance.test.mjs test/teamDpsComparison.test.mjs test/observedEchoScenario.test.mjs test/rotationBuildAcceptance.test.mjs test/sandboxLoop.test.mjs test/uxReview.test.mjs
      - name: Reviewed catalog parity
        run: |
          node docs/ui-lab/tools/export-catalog.mjs --check
          node docs/ui-lab/tools/export-targets.mjs --check
          node docs/ui-lab/tools/export-settings.mjs --check
          node docs/ui-lab/tools/export-loadouts.mjs --check
          node docs/ui-lab/tools/export-production-settings.mjs --check
          node docs/ui-lab/tools/export-sandbox.mjs --check
          node docs/ui-lab/tools/export-character-contexts.mjs --check
          node docs/ui-lab/tools/export-sandbox-stat-sources.mjs --check
          node docs/ui-lab/tools/export-recommended-guidance.mjs --check
          node docs/ui-lab/tools/export-echo-scenario.mjs --check
      - name: Canonical configuration source pin
        run: |
          git fetch --depth=1 origin 259f4881271b5cc84cec5bf2e7f085e6a106a8e3
          node docs/ui-lab/tools/verify-configuration-source.mjs
      - name: Chromium layout and interaction review
        env:
          UI_LAB_CHROME_PATH: /usr/bin/google-chrome
        run: node docs/ui-lab/tools/verify-browser.mjs
      - name: Standalone Sandbox coverage and Chromium interactions
        env:
          UI_LAB_CHROME_PATH: /usr/bin/google-chrome
        run: node docs/ui-lab/tools/verify-sandbox-browser.mjs

      - name: Build static Sandbox and Improve workspaces
        run: npm run build
      - name: User UX observations - desktop and mobile Chromium
        env:
          UI_LAB_CHROME_PATH: /usr/bin/google-chrome
        run: node docs/ui-lab/tools/verify-ux-review-browser.mjs
      - name: Upload UX review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-review-326
          path: artifacts/ux-review-326/
