name: UI Lab Review

on:
  pull_request:
    paths:
      - 'docs/ui-lab/**'
      - '.github/workflows/ui-lab-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-lab-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fetch the approved V1.1 comparison revision
        run: git fetch --depth=1 origin 00c8532eaa88fd70ee5ed94b43ec582122a97807
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser driver without changing dependency manifests
        run: npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
      - name: Preserved baseline, isolation and discard boundaries
        run: node --test docs/ui-lab/tools/state.test.mjs
      - name: Reviewed catalog parity
        run: node docs/ui-lab/tools/export-catalog.mjs --check
      - name: Package exact-source portable preview
        run: node docs/ui-lab/tools/build-review.mjs --require-clean
      - name: Chromium source, portable and interaction review
        env:
          UI_LAB_CHROME_PATH: /usr/bin/google-chrome
        run: node docs/ui-lab/tools/verify-browser.mjs
      - name: Upload downloadable review environment and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bellibing-ui-lab-v1-1-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/ui-lab-review/
          if-no-files-found: error
          retention-days: 90
