name: Verify Weapon Focused

on:
  pull_request:

permissions:
  contents: read

jobs:
  weapon-canonical:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Canonical Weapon browser focused Chrome gate
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/bellibing-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ui-preview/ >/dev/null; then
              break
            fi
            sleep 0.25
          done
          google-chrome --version
          BELLIBING_V34_URL=http://127.0.0.1:4173/ui-preview/ \
            node scripts/verify-v34-weapon-canonical.mjs

      - name: Upload focused Weapon visuals
        uses: actions/upload-artifact@v4
        with:
          name: bellibing-new-ui-weapon-canonical-focused
          path: |
            artifacts/ui-preview-weapon-canonical-1440x900.png
            artifacts/ui-preview-weapon-canonical-390x844.png
          if-no-files-found: error
          retention-days: 7
