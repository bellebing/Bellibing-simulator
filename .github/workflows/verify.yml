name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Echo/Sonata raw coverage gate
        run: npm run audit:echo-raw

      - name: Sonata effect source coverage gate
        run: npm run audit:sonata-effects

      - name: Echo skill source coverage gate
        run: npm run audit:echo-skills

      - name: Profile readiness / Pre-DPS freeze gate
        run: npm run audit:profile-readiness

      - name: Tests
        run: npm test

      - name: Strict web build
        run: npm run build

      - name: Diff whitespace check
        run: git diff --check HEAD^

      - name: Publish Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: Bellibing-Echo-Lab-Windows-Test
          path: dist/
          if-no-files-found: error
