name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Echo/Sonata raw coverage gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run audit:echo-raw

      - name: Sonata effect source coverage gate
        run: npm run audit:sonata-effects

      - name: Echo skill source coverage gate
        run: npm run audit:echo-skills

      - name: Echo portrait asset provenance gate
        run: npm run audit:ui-echo-portraits

      - name: Builder icon asset provenance gate
        run: npm run audit:ui-builder-icons

      - name: Profile candidate inventory gate
        run: npm run audit:profile-candidates

      - name: Profile source accelerator gate
        run: npm run audit:profile-source-accelerator

      - name: Horizontal green-lane deterministic gate
        run: npm run audit:profile-horizontal-green-lane

      - name: Horizontal profile cohort gate
        run: npm run audit:profile-cohort

      - name: Profile adapter dependency matrix gate
        run: npm run audit:profile-adapters

      - name: Profile readiness / Pre-DPS freeze gate
        run: npm run audit:profile-readiness

      - name: Tests
        run: npm test

      - name: Strict web build
        run: npm run build

      - name: Browser Roll Assist and owned-build regression
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/bellibing-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/roll-assistant.html >/dev/null; then
              break
            fi
            sleep 0.25
          done
          google-chrome --version
          BELLIBING_LIVE_ROLL_ASSIST_URL=http://127.0.0.1:4173/roll-assistant.html \
            node scripts/verify-live-roll-assist.mjs
          BELLIBING_ALPHA_URL=http://127.0.0.1:4173/ \
            node scripts/verify-alpha-upgrade.mjs
          BELLIBING_ALPHA_URL=http://127.0.0.1:4173/ \
            node scripts/verify-alpha-ciaccona-owned-build.mjs
          BELLIBING_V34_URL=http://127.0.0.1:4173/ui-preview/ \
            node scripts/verify-v34-weapon-canonical.mjs
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            immutable_preview="https://rawcdn.githack.com/bellebing/Bellibing-simulator/${{ github.event.pull_request.head.sha }}/docs/ui-prototypes/v34-functional.html"
            for attempt in {1..30}; do
              if curl --fail --silent --output /dev/null "$immutable_preview"; then
                break
              fi
              sleep 1
            done
            curl --fail --silent --output /dev/null "$immutable_preview"
            BELLIBING_V34_URL="$immutable_preview" \
              BELLIBING_V34_CHROME_DEBUG_PORT=9667 \
              node scripts/verify-v34-weapon-canonical.mjs
          fi
          BELLIBING_V34_URL=http://127.0.0.1:4173/ui-preview/ \
            node scripts/verify-v34-carousel-runtime.mjs

          mkdir -p artifacts
          for asset in \
            bellibing-ui-build-character-rover.webp \
            bellibing-ui-improve-character-augusta.webp \
            bellibing-ui-build-team.webp; do
            curl --fail --silent --output /dev/null \
              "http://127.0.0.1:4173/ui-preview/assets/v34/$asset"
          done

          test "$(find dist/ui-preview/assets/characters/portraits/rover-candidates -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 10
          test -s dist/ui-preview/assets/characters/portraits/manifest.json
          curl --fail --silent --output /dev/null \
            "http://127.0.0.1:4173/ui-preview/assets/characters/portraits/augusta.png"
          curl --fail --silent --output /dev/null \
            "http://127.0.0.1:4173/ui-preview/assets/characters/portraits/manifest.json"

          test "$(find dist/ui-preview/assets/characters/portraits -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 60
          test "$(find dist/ui-preview/assets/echoes/icons -maxdepth 1 -type f \( -name '*.png' -o -name '*.webp' \) | wc -l)" -eq 181
          test "$(find dist/ui-preview/assets/echoes/portraits -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 181
          test "$(find dist/ui-preview/assets/weapons/icons -maxdepth 1 -type f \( -name '*.png' -o -name '*.webp' \) | wc -l)" -eq 122
          test -s dist/ui-preview/assets/echoes/manifest.json
          test -s dist/ui-preview/assets/echoes/portraits/manifest.json
          test -s dist/ui-preview/assets/weapons/manifest.json
          curl --fail --silent --output /dev/null \
            "http://127.0.0.1:4173/ui-preview/assets/echoes/portraits/echo-60000425.png"
          curl --fail --silent --output /dev/null \
            "http://127.0.0.1:4173/ui-preview/assets/echoes/portraits/manifest.json"
          curl --fail --silent --output /dev/null \
            "http://127.0.0.1:4173/ui-preview/assets/echoes/manifest.json"
          curl --fail --silent --output /dev/null \
            "http://127.0.0.1:4173/ui-preview/assets/weapons/manifest.json"
          test -s dist/ui-preview/assets/weapons/frames/4-star-square.png
          test -s dist/ui-preview/assets/weapons/frames/5-star-square.png
          curl --fail --silent --output /dev/null \
            "http://127.0.0.1:4173/ui-preview/assets/weapons/frames/4-star-square.png"
          curl --fail --silent --output /dev/null \
            "http://127.0.0.1:4173/ui-preview/assets/weapons/frames/5-star-square.png"

          test "$(find dist/ui-preview/assets/builder-icons -type f \( -name '*.png' -o -name '*.webp' \) | wc -l)" -eq 819
          test "$(find dist/ui-preview/assets/builder-icons/elements -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 6
          test "$(find dist/ui-preview/assets/builder-icons/sonata -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 34
          test "$(find dist/ui-preview/assets/builder-icons/skills -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 411
          test "$(find dist/ui-preview/assets/builder-icons/chains -type f -name '*.webp' | wc -l)" -eq 348
          test "$(find dist/ui-preview/assets/builder-icons/stats -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 17
          test "$(find dist/ui-preview/assets/builder-icons/echo-cost -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 3
          test -s dist/ui-preview/assets/builder-icons/manifest.json
          curl --fail --silent --output /dev/null             "http://127.0.0.1:4173/ui-preview/assets/builder-icons/elements/aero.webp"
          curl --fail --silent --output /dev/null             "http://127.0.0.1:4173/ui-preview/assets/builder-icons/sonata/01-freezing-frost.webp"
          curl --fail --silent --output /dev/null             "http://127.0.0.1:4173/ui-preview/assets/builder-icons/chains/aalto/s1.webp"
          curl --fail --silent --output /dev/null             "http://127.0.0.1:4173/ui-preview/assets/builder-icons/echo-cost/cost-4.png"
          curl --fail --silent --output /dev/null             "http://127.0.0.1:4173/ui-preview/assets/builder-icons/manifest.json"

          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=1440,900 \
            --screenshot=artifacts/ui-preview-home-1440x900.png \
            http://127.0.0.1:4173/ui-preview/
          test -s artifacts/ui-preview-home-1440x900.png

      - name: Upload New UI Home visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: bellibing-new-ui-home-visual
          path: |
            artifacts/ui-preview-home-1440x900.png
            artifacts/ui-preview-build-names-expanded-1440x900.png
            artifacts/ui-preview-build-names-hover-expanded-1440x900.png
            artifacts/ui-preview-weapon-overlay-1440x900.png
            artifacts/ui-preview-weapon-overlay-390x844.png
          if-no-files-found: error
          retention-days: 7

      - name: Diff whitespace check
        run: git diff --check HEAD^
