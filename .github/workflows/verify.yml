name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Tests
        run: npm test

      - name: Strict web build
        run: npm run build

      - name: Publish Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: Bellibing-Echo-Lab-Windows-Test
          path: dist/
          if-no-files-found: error
