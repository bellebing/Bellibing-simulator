<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <base href="/docs/ui-lab/v1.1/">
  <title>Bellibing / Teams</title>
  <link rel="stylesheet" href="https://db.onlinewebfonts.com/c/3c1a4128f95e2109303b045eda4bfe8a?family=Etna">
  <link rel="stylesheet" href="../v1/style.css">
  <link rel="stylesheet" href="lab.css">
  <link rel="stylesheet" href="typography.css">
  <link rel="stylesheet" href="/artifacts/build-ui-prototype/build-candidate/candidate.css">
  <link rel="stylesheet" href="/artifacts/build-ui-prototype/team-candidate/team.css">
<link rel="stylesheet" href="/artifacts/build-ui-prototype/prototype-navigation.css"></head>
<body data-prototype-page="teams" class="ui-lab bc-body tc-body">
  <div class="bc-review"><span id="tcOrigin">LOCAL TEAM CONCEPT</span><div><button id="tcAccount">Use review account</button><button id="tcExample">Use example roster</button></div></div>
  <header class="bc-nav">
    <a class="bc-brand" href="/">&#10023; <strong>BELLIBING</strong></a>
    <nav aria-label="Application">
      <button onclick="location.href='/'">Build a Character</button>
      <button disabled>Improve a Character</button>
      <button class="active" aria-current="page">Teams</button>
      <button disabled>Echo Sandbox</button>
    </nav>
    <span class="bc-version">TEAM WORKSPACE</span>
  </header>
  <div class="bc-environment" aria-hidden="true"></div>
  <main class="tc-page">
    <div class="tc-heading">
      <div><h1>Teams</h1><span id="tcRosterCount"></span></div>
      <div class="heading-carousel"><div class="ribbon-rest"><div class="portraits" id="portraits"></div><button id="openGallery" class="expand-gallery" aria-expanded="false" aria-controls="characterGallery" aria-label="Browse available Characters">&#8964;</button></div></div>
      <div class="tc-plan-state">Account roster plan</div>
    </div>
    <div class="tc-layout">
      <aside class="tc-panel tc-sidebar">
        <section><h2>Build for</h2><div id="tcModes" class="tc-modes"></div></section>
        <section><div class="tc-section-heading"><h2>Your teams</h2><button id="tcAdd" aria-label="Add a team">+</button></div><div id="tcTeams"></div></section>
        <section class="tc-availability"><h2>Available roster</h2><div id="tcAvailable"></div></section>
      </aside>
      <section class="tc-workbench" aria-label="Team workbench">
        <div class="tc-team-heading"><div><span id="tcPurpose" class="tc-eyebrow"></span><h2 id="tcTeamName"></h2></div><div class="tc-total"><span>Team DPS</span><strong>Pending</strong></div></div>
        <div id="tcMembers" class="tc-members"></div>
        <div class="tc-panel tc-rotation"><h2>Rotation</h2><div class="tc-rotation-line" id="tcRotation"></div><p id="tcExecution"></p></div>
        <div class="tc-panel tc-plan-note"><div><h2>Whole-roster allocation</h2><p id="tcAllocation"></p></div><span id="tcRanking">DPS ranking pending</span></div>
        <div id="carouselAnchor" class="carousel-anchor"><section id="characterCarousel" class="character-ribbon" aria-label="Character selector" aria-roledescription="carousel"></section></div>
      </section>
      <aside class="tc-panel tc-inspection" aria-label="Selected Character details"><div id="tcDetails"></div></aside>
    </div>
    <footer class="tc-footer"><span id="tcMessage" role="status"></span><span>Local planning preview</span></footer>
  </main>
  <div class="current-name" hidden><strong>Augusta</strong></div>
  <script type="module">
    import('/artifacts/build-ui-prototype/team-candidate/team.js').catch(error => {
      document.querySelector('#tcMessage').textContent = 'Team preview could not load. ' + error.message;
      console.error(error);
    });
  </script>
<script type="module" src="/artifacts/build-ui-prototype/prototype-navigation.js"></script></body>
</html>
