<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bellibing UI checkpoint v34</title>
<style>
:root{--bg:#050608;--panel:#11141a;--text:#f2f0eb;--muted:#8e949d;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif;overflow:hidden}button{font:inherit}.page{position:fixed;inset:0;display:none;overflow:hidden}.page.active{display:block}.menu{position:absolute;z-index:90;left:18px;top:16px;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:#101319;color:#fff;font-size:20px}.dev{position:absolute;z-index:90;right:16px;bottom:14px;border:0;background:transparent;color:#555;font-size:11px}.home-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;perspective:1200px}.home-card{--x:0px;--s:1;position:absolute;left:50%;top:50%;width:300px;height:430px;transform:translate(-50%,-50%) translateX(var(--x)) scale(var(--s));border:1px solid var(--line);border-radius:26px;background:linear-gradient(180deg,#171a21,#0c0f13);box-shadow:0 28px 80px rgba(0,0,0,.48);color:#fff;cursor:pointer;overflow:hidden;transition:transform .42s cubic-bezier(.16,.84,.24,1),opacity .35s ease}.home-card::before{content:"TEMP ART";position:absolute;inset:24px 24px 86px;display:grid;place-items:center;border-radius:20px;background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.08),transparent 58%);color:#454b54;letter-spacing:.18em;font-size:11px}.home-card strong{position:absolute;left:20px;right:20px;bottom:28px;text-align:center;font-size:31px;line-height:1}.home-leaving .home-card{opacity:0}.home-leaving .home-card.major-source{transform:translate(-50%,-50%) translateX(var(--x)) scale(1.16)}.major-enter .picker-shell,.major-enter .team-placeholder{opacity:0;transform:scale(.84)}.major-enter.go .picker-shell,.major-enter.go .team-placeholder{opacity:1;transform:scale(1);transition:transform .72s cubic-bezier(.16,.84,.24,1),opacity .5s ease}
.picker-shell{position:absolute;inset:0;padding-top:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:justify-content .62s cubic-bezier(.16,.84,.24,1)}.question{margin:0 0 30px;font-size:52px;line-height:1;transition:opacity .46s ease,transform .7s cubic-bezier(.16,.84,.24,1),height .7s ease,margin .7s ease}.wheel{--cw:252px;--ch:352px;position:relative;width:100%;height:410px;touch-action:pan-y;user-select:none;cursor:grab;z-index:30;transition:height .72s cubic-bezier(.16,.84,.24,1)}.choice{--x:0px;--s:1;--o:1;position:absolute;left:50%;top:50%;width:var(--cw);height:var(--ch);transform:translate(-50%,-50%) translateX(var(--x)) scale(var(--s));opacity:var(--o);border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,#171a21,#0d1015);color:#fff;box-shadow:0 20px 60px rgba(0,0,0,.45);cursor:pointer;transition:transform .62s cubic-bezier(.16,.84,.24,1),width .84s cubic-bezier(.16,.84,.24,1),height .84s cubic-bezier(.16,.84,.24,1),border-radius .84s cubic-bezier(.16,.84,.24,1),opacity .48s ease}.choice::before{content:"TEMP ART";position:absolute;inset:20px 18px 64px;display:grid;place-items:center;border-radius:16px;background:radial-gradient(circle,rgba(255,255,255,.06),transparent 62%);color:#424851;font-size:9px;letter-spacing:.16em}.choice span{position:absolute;left:8px;right:8px;bottom:20px;text-align:center;font-size:25px}.wheel.dragging .choice{transition:none}.picker-shell.has-selection{justify-content:flex-start}.picker-shell.has-selection .question{opacity:0;height:0;margin:0;overflow:hidden;transform:translateY(-10px)}.picker-shell.has-selection .wheel{--cw:82px;--ch:82px;height:122px}.picker-shell.has-selection .choice{border-radius:50%}.picker-shell.has-selection .choice::before{inset:0;border-radius:50%;content:""}.picker-shell.has-selection .choice span{bottom:-25px;font-size:13px;color:#9aa0a9}.picker-shell.hover-expanded .wheel{--cw:138px;--ch:194px;height:232px}.picker-shell.hover-expanded .choice{border-radius:16px}.picker-shell.hover-expanded .choice::before{inset:14px 12px 48px;border-radius:12px;content:"TEMP"}.picker-shell.hover-expanded .choice span{bottom:13px;font-size:16px;color:#fff}.build-stage{visibility:hidden;opacity:0;pointer-events:none;position:absolute;inset:0;z-index:2}.picker-shell.has-selection .build-stage{visibility:visible;opacity:1}.focus{position:absolute;left:50%;top:50%;transform:translate(-50%,-43%);width:min(540px,45vw);height:min(590px,60vh);display:flex;flex-direction:column;align-items:center;justify-content:center}.focus h1{margin:0 0 8px;font-size:48px}.focus-art{width:100%;flex:1;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 48%,rgba(255,165,70,.10),transparent 60%);color:#6b4a34;font-size:12px;letter-spacing:.18em}.side-left{position:absolute;left:max(5vw,48px);top:50%;width:min(290px,23vw);height:min(540px,58vh);transform:translate(-70px,-43%);opacity:0;display:flex;flex-direction:column;justify-content:space-between;gap:22px;pointer-events:auto}.picker-shell.has-selection .side-left{opacity:1;transform:translate(0,-43%);transition:opacity .48s ease .14s,transform .78s cubic-bezier(.16,.84,.24,1) .14s}.block h2,.echoes h2,.seq h2{margin:0 0 12px;font-size:23px}.stats-box{height:255px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.02);padding:18px;display:flex;flex-direction:column;justify-content:center;gap:20px}.statline{height:11px;border-radius:99px;background:rgba(255,255,255,.06)}.weapon{height:108px;width:100%;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.02);color:#777;font-size:28px}.echoes{position:absolute;right:max(5vw,48px);top:50%;width:98px;transform:translate(70px,-43%);opacity:0;pointer-events:auto}.picker-shell.has-selection .echoes{opacity:1;transform:translate(0,-43%);transition:opacity .48s ease .2s,transform .78s cubic-bezier(.16,.84,.24,1) .2s}.echo-stack{display:grid;gap:10px}.echo{aspect-ratio:1;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.02);color:#777;font-size:24px}.seq{position:absolute;left:clamp(340px,31vw,470px);top:50%;width:88px;transform:translate(-55px,-40%);opacity:0;pointer-events:auto}.picker-shell.has-selection .seq{opacity:1;transform:translate(0,-40%);transition:opacity .46s ease .18s,transform .76s cubic-bezier(.16,.84,.24,1) .18s}.seq h2{text-align:center;font-size:18px}.seq-line{position:relative;height:360px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}.seq-line::before{content:"";position:absolute;top:28px;bottom:20px;left:50%;width:1px;background:rgba(255,255,255,.11)}.node{position:relative;z-index:1;display:grid;place-items:center;aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.13);background:#14171d;color:#89919a;font-size:10px}.n1{width:34px}.n2{width:38px}.n3{width:42px}.n4{width:47px}.n5{width:52px}.n6{width:58px}.account{position:absolute;right:24px;bottom:20px;border:1px solid #eee;border-radius:13px;background:#eee;color:#08090b;padding:13px 18px;font-weight:800;pointer-events:auto}.account.owned{background:#171a20;color:#7e858e;border-color:var(--line)}.dialog-bg{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.68);display:none;place-items:center}.dialog-bg.open{display:grid}.dialog{width:min(390px,calc(100vw - 32px));padding:26px;border:1px solid var(--line);border-radius:20px;background:#11141a;text-align:center}.dialog h2{margin:0 0 8px}.dialog-actions{display:flex;justify-content:center;gap:10px;margin-top:20px}.dialog button{padding:11px 16px;border-radius:11px;border:1px solid var(--line);background:#191d24;color:#fff}.dialog .primary{background:#eee;color:#08090b}.team-placeholder{position:absolute;inset:0;display:grid;place-items:center;font-size:52px}.improve-focus{position:absolute;inset:150px 0 0;display:grid;place-items:center;font-size:52px;opacity:0;pointer-events:none}.picker-shell.has-selection .improve-focus{opacity:1;transition:opacity .35s ease .15s}
@media(max-width:900px){.focus{width:48vw}.side-left{left:24px;width:190px}.seq{left:245px}.echoes{right:24px;width:82px}}@media(max-width:760px){html,body{overflow:auto}.page{overflow:auto}.focus,.side-left,.seq,.echoes{position:relative;inset:auto;transform:none!important;width:min(520px,88vw);height:auto;margin:0 auto 22px}.build-stage{position:relative;padding:130px 0 70px}.focus{height:460px}.picker-shell.has-selection .build-stage{display:flex;flex-direction:column}.side-left,.seq,.echoes{opacity:1}.seq-line{height:auto;flex-direction:row-reverse}.seq-line::before{top:50%;bottom:auto;left:20px;right:20px;width:auto;height:1px}.echo-stack{grid-template-columns:repeat(5,1fr)}.account{position:fixed}.home-card{width:236px;height:338px}.question{font-size:42px}}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<section id="home" class="page active"><div id="homeStage" class="home-stage"></div><button id="reset" class="dev">reset prototype</button></section>
<section id="build" class="page"><button class="menu" data-home>☰</button><div id="buildShell" class="picker-shell"><h1 class="question">What Character?</h1><div id="buildWheel" class="wheel" tabindex="0"></div><div class="build-stage"><div class="focus"><h1 id="buildName"></h1><div class="focus-art">TEMP CHARACTER ART</div></div><aside class="side-left"><section class="block"><h2>Stats</h2><div class="stats-box"><div class="statline"></div><div class="statline"></div><div class="statline"></div><div class="statline" style="width:68%"></div></div></section><section class="block"><h2>Weapon</h2><button class="weapon">+</button></section></aside><aside class="seq"><h2>Sequences</h2><div class="seq-line"><button class="node n6">S6</button><button class="node n5">S5</button><button class="node n4">S4</button><button class="node n3">S3</button><button class="node n2">S2</button><button class="node n1">S1</button></div></aside><aside class="echoes"><h2>Echoes</h2><div class="echo-stack"><button class="echo">+</button><button class="echo">+</button><button class="echo">+</button><button class="echo">+</button><button class="echo">+</button></div></aside><button id="accountBtn" class="account">Add to Account</button></div></div></section>
<section id="improve" class="page"><button class="menu" data-home>☰</button><div id="improveShell" class="picker-shell"><h1 class="question">What Character?</h1><div id="improveWheel" class="wheel" tabindex="0"></div><div id="improveFocus" class="improve-focus"></div></div></section>
<section id="team" class="page"><button class="menu" data-home>☰</button><div class="team-placeholder">Build a Team</div></section>
<div id="dialogBg" class="dialog-bg"><div class="dialog"><h2>Switch Character?</h2><p id="dialogCopy"></p><div class="dialog-actions"><button id="cancelSwitch">Cancel</button><button id="confirmSwitch" class="primary">Switch</button></div></div></div>
<script>
const KEY='bellibing-ui-checkpoint-v34';
const ALL=['Aalto','Camellya','Jinhsi','Augusta','Iuno','Shorekeeper','Denia'];
let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}}state={characters:Array.isArray(state.characters)?state.characters:[],drafts:state.drafts&&typeof state.drafts==='object'?state.drafts:{}};
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
function draft(name){if(!state.drafts[name]){state.drafts[name]={character:name,build:{},createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};save()}return state.drafts[name]}
function autosave(name,patch={}){if(!name)return;const d=draft(name);d.build={...d.build,...patch};d.updatedAt=new Date().toISOString();save()}
const owned=n=>state.characters.includes(n);
function addOwned(n){draft(n);if(!owned(n))state.characters.push(n);state.drafts[n].addedToAccountAt=state.drafts[n].addedToAccountAt||new Date().toISOString();save()}
function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));if(id==='home')renderHome();if(id==='build'){buildPicker.reset();buildPicker.render()}if(id==='improve'){improvePicker.reset();improvePicker.render()}}
let majorBusy=false;function major(target,card){if(majorBusy)return;majorBusy=true;const home=document.querySelector('#home');card.classList.add('major-source');home.classList.add('home-leaving');setTimeout(()=>{const dest=document.getElementById(target);dest.classList.add('major-enter');show(target);requestAnimationFrame(()=>requestAnimationFrame(()=>dest.classList.add('go')));setTimeout(()=>{dest.classList.remove('major-enter','go');home.classList.remove('home-leaving');card.classList.remove('major-source');majorBusy=false},800)},450)}
function renderHome(){const items=[['Build a Character','build']];if(state.characters.length>=1)items.push(['Improve a Character','improve']);if(state.characters.length>=2)items.push(['Build a Team','team']);const stage=document.querySelector('#homeStage');stage.innerHTML='';let idx=Math.min(1,items.length-1);const cards=items.map(([title,target],i)=>{const b=document.createElement('button');b.className='home-card';b.innerHTML=`<strong>${title}</strong>`;b.dataset.target=target;b.onclick=()=>{if(i!==idx){idx=i;paint();return}major(target,b)};stage.appendChild(b);return b});function paint(){cards.forEach((c,i)=>{const d=i-idx;c.style.setProperty('--x',`${d*300}px`);c.style.setProperty('--s',Math.max(.74,1.075-Math.abs(d)*.17));c.style.zIndex=20-Math.abs(d)})}paint()}
function makePicker({shellId,wheelId,items,mode}){const shell=document.getElementById(shellId),wheel=document.getElementById(wheelId);let list=[],cards=[],idx=0,selected=null,pending=null,startX=0,dragX=0,pointer=null,moved=false,suppress=0,collapseTimer=null;function source(){return typeof items==='function'?items():items}function spacing(){if(shell.classList.contains('hover-expanded'))return 126;if(shell.classList.contains('has-selection'))return 98;return innerWidth<700?200:228}function paint(dx=0){if(!cards.length)return;const p=dx/spacing();cards.forEach((c,i)=>{const d=i-idx+p,a=Math.abs(d);c.style.setProperty('--x',`${d*spacing()}px`);c.style.setProperty('--s',Math.max(.7,1.07-a*.16));c.style.setProperty('--o',Math.max(.18,1-a*.22));c.style.zIndex=30-Math.round(a*5)})}function setIndex(n){idx=Math.max(0,Math.min(cards.length-1,n));paint()}function select(name){if(mode==='build'){draft(name);autosave(name,{lastOpenedAt:new Date().toISOString()});document.getElementById('buildName').textContent=name;const btn=document.getElementById('accountBtn');btn.textContent=owned(name)?'On Account':'Add to Account';btn.classList.toggle('owned',owned(name));btn.disabled=owned(name)}else{document.getElementById('improveFocus').textContent=name;autosave(name,{lastImprovedAt:new Date().toISOString()})}selected=name;idx=list.indexOf(name);const before=wheel.getBoundingClientRect();shell.classList.add('has-selection');shell.classList.remove('hover-expanded');const after=wheel.getBoundingClientRect();const dy=before.top-after.top;if(!shell.dataset.wasSelected){shell.dataset.wasSelected='1';const a=wheel.animate([{transform:`translateY(${dy}px)`},{transform:'translateY(0)'}],{duration:920,easing:'cubic-bezier(.16,.84,.24,1)'});a.onfinish=()=>a.cancel()}paint()}function requestSwitch(name){if(name===selected)return;pending=name;document.getElementById('dialogCopy').textContent=`Switch to ${name}?`;document.getElementById('dialogBg').classList.add('open')}function closeDialog(){pending=null;document.getElementById('dialogBg').classList.remove('open')}function render(){list=source();wheel.innerHTML='';cards=[];if(!list.length){shell.querySelector('.question').textContent='No Characters yet';return}shell.querySelector('.question').textContent='What Character?';idx=Math.min(mode==='build'?3:list.length-1,list.length-1);cards=list.map((name,i)=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<span>${name}</span>`;b.onclick=e=>{if(Date.now()<suppress)return;if(shell.classList.contains('has-selection')){requestSwitch(name);return}if(i!==idx){setIndex(i);return}select(name)};wheel.appendChild(b);return b});paint()}function reset(){selected=null;pending=null;shell.classList.remove('has-selection','hover-expanded');delete shell.dataset.wasSelected;if(mode==='build'){document.getElementById('buildName').textContent='';const btn=document.getElementById('accountBtn');btn.textContent='Add to Account';btn.classList.remove('owned');btn.disabled=false}else document.getElementById('improveFocus').textContent='';closeDialog()}wheel.addEventListener('mouseenter',()=>{if(shell.classList.contains('has-selection')&&matchMedia('(hover:hover)').matches){clearTimeout(collapseTimer);shell.classList.add('hover-expanded');paint()}});wheel.addEventListener('mouseleave',()=>{if(matchMedia('(hover:hover)').matches){clearTimeout(collapseTimer);collapseTimer=setTimeout(()=>{shell.classList.remove('hover-expanded');paint()},320)}});wheel.addEventListener('pointerdown',e=>{pointer=e.pointerId;startX=e.clientX;dragX=0;moved=false});window.addEventListener('pointermove',e=>{if(e.pointerId!==pointer)return;dragX=e.clientX-startX;if(Math.abs(dragX)>8)moved=true;if(moved){wheel.classList.add('dragging');paint(dragX)}});window.addEventListener('pointerup',e=>{if(e.pointerId!==pointer)return;if(moved){const t=Math.min(82,spacing()*.27);if(dragX<-t)setIndex(idx+1);else if(dragX>t)setIndex(idx-1);suppress=Date.now()+180}pointer=null;moved=false;wheel.classList.remove('dragging');paint()});wheel.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)<4&&Math.abs(e.deltaX)<4)return;e.preventDefault();setIndex(idx+((Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)>0?1:-1))},{passive:false});return{render,reset,select,get selected(){return selected},get pending(){return pending},confirm(){if(pending){autosave(selected,{lastLeftAt:new Date().toISOString()});select(pending)}closeDialog()},closeDialog}}
const buildPicker=makePicker({shellId:'buildShell',wheelId:'buildWheel',items:ALL,mode:'build'});const improvePicker=makePicker({shellId:'improveShell',wheelId:'improveWheel',items:()=>[...state.characters],mode:'improve'});
document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>{if(buildPicker.selected)autosave(buildPicker.selected,{lastLeftAt:new Date().toISOString()});if(improvePicker.selected)autosave(improvePicker.selected,{lastLeftImproveAt:new Date().toISOString()});show('home')});
document.getElementById('accountBtn').onclick=()=>{const n=buildPicker.selected;if(!n||owned(n))return;addOwned(n);const b=document.getElementById('accountBtn');b.textContent='On Account';b.classList.add('owned');b.disabled=true};document.getElementById('cancelSwitch').onclick=()=>{buildPicker.closeDialog();improvePicker.closeDialog()};document.getElementById('confirmSwitch').onclick=()=>{if(buildPicker.pending)buildPicker.confirm();else improvePicker.confirm()};document.getElementById('reset').onclick=()=>{state={characters:[],drafts:{}};save();show('home')};window.addEventListener('resize',()=>{buildPicker.render();if(document.getElementById('improve').classList.contains('active'))improvePicker.render()});renderHome();
</script>
</body>
</html>
