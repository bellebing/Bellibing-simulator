.seq{z-index:12}.seq h2{display:flex;align-items:center;justify-content:center;gap:7px}.seq-current{font-family:var(--font-ui);font-size:10px;line-height:1;padding:4px 6px;border:1px solid rgba(255,255,255,.12);border-radius:99px;color:#9ca3ad;background:rgba(9,11,15,.76)}.node{overflow:hidden;padding:0;cursor:pointer;isolation:isolate;transition:border-color .16s ease,box-shadow .16s ease,transform .16s ease,filter .16s ease}.node:disabled{cursor:default;opacity:.35}.node img{position:absolute;z-index:1;inset:2px;width:calc(100% - 4px);height:calc(100% - 4px);object-fit:cover;border-radius:50%;opacity:.42;filter:grayscale(.55) brightness(.68);transition:opacity .16s ease,filter .16s ease}.node .seq-tag{position:relative;z-index:2;display:grid;place-items:center;width:100%;height:100%;font-size:9px;font-weight:800;color:#d7d9de;text-shadow:0 1px 4px #000,0 0 8px #000;background:radial-gradient(circle,transparent 32%,rgba(4,5,8,.42) 100%)}.node:not(:disabled):hover{transform:scale(1.06);border-color:rgba(255,255,255,.30)}.node.is-active{border-color:rgba(222,185,107,.72);box-shadow:0 0 0 1px rgba(222,185,107,.18),0 0 22px rgba(222,185,107,.14)}.node.is-active img{opacity:.95;filter:none}.node.is-preview{border-color:#f2f0eb;box-shadow:0 0 0 2px rgba(242,240,235,.22),0 0 26px rgba(255,255,255,.12)}.node.is-preview img{opacity:1;filter:none}.seq-inspector{position:absolute;z-index:20;left:96px;top:34px;width:278px;padding:14px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:linear-gradient(180deg,rgba(20,23,29,.96),rgba(10,12,16,.96));box-shadow:0 20px 54px rgba(0,0,0,.48);opacity:0;pointer-events:none;transform:translateX(-8px) scale(.985);transition:opacity .17s ease-out,transform .22s cubic-bezier(.16,.84,.24,1)}.seq-inspector.open{opacity:1;pointer-events:auto;transform:translateX(0) scale(1)}.seq-inspector-close{position:absolute;right:8px;top:7px;width:28px;height:28px;border:0;background:transparent;color:#89909a;font-size:20px;cursor:pointer}.seq-inspector-hero{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:center;padding-right:22px}.seq-inspector-hero img{width:58px;height:58px;border-radius:50%;object-fit:cover;border:1px solid rgba(255,255,255,.16);background:#11141a}.seq-inspector-hero div{min-width:0}.seq-inspector-label{display:block;margin-bottom:4px;color:#9da4ae;font-size:11px;font-weight:800;letter-spacing:.08em}.seq-inspector-hero strong{display:block;font-size:13px;line-height:1.3;color:#eceef1}.seq-inspector-actions{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:13px}.seq-inspector-actions button{min-height:36px;padding:8px 11px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:#171a20;color:#c7cbd1;font-weight:750;cursor:pointer}.seq-inspector-actions .seq-commit{border-color:rgba(207,166,84,.44);color:#f0ede7}.seq-inspector-actions button:disabled{cursor:default;color:#747b85;border-color:rgba(255,255,255,.08);background:rgba(255,255,255,.035)}@media(max-width:760px){.seq-inspector{position:fixed;left:50%;top:auto;bottom:18px;width:min(320px,calc(100vw - 24px));transform:translate(-50%,8px) scale(.985)}.seq-inspector.open{transform:translate(-50%,0) scale(1)}}

ag">S1</span></button></div><section id="sequenceInspector" class="seq-inspector" aria-hidden="true"><button id="sequenceInspectorClose" class="seq-inspector-close" type="button" aria-label="Close Sequence preview">×</button><div class="seq-inspector-hero"><img id="sequencePreviewIcon" alt="" draggable="false"><div><span id="sequencePreviewLabel" class="seq-inspector-label">S1</span><strong id="sequencePreviewName">Sequence</strong></div></div><div class="seq-inspector-actions"><button id="sequenceSetZero" type="button">Set S0</button><button id="sequenceCommit" class="seq-commit" type="button" disabled>Set Sequence</button></div></section></aside><aside class="echoes"><h2>Echoes</h2><div class="echo-stack"><button type="button" class="echo">+</button><button type="button" class="echo">+</button><button type="button" class="echo">+</button><button type="button" class="echo">+</button><button type="button" class="echo">+</button></div></aside><button id="accountBtn" class="account" type="button">Add to Account</button></div></div></section>

<script>
const KEY='bellibing-ui-checkpoint-v34';
let releasedCharacters=[];
const characterByName=new Map();
let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}}state={characters:Array.isArray(state.characters)?state.characters:[],drafts:state.drafts&&typeof state.drafts==='object'?state.drafts:{}};
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
function draft(name){if(!state.drafts[name]){state.drafts[name]={character:name,build:{},createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};save()}return state.drafts[name]}
function autosave(name,patch={}){if(!name)return;const d=draft(name);d.build={...d.build,...patch};d.updatedAt=new Date().toISOString();save()}
const owned=n=>state.characters.includes(n);
function addOwned(n){draft(n);if(!owned(n))state.characters.push(n);state.drafts[n].addedToAccountAt=state.drafts[n].addedToAccountAt||new Date().toISOString();save()}
const clamp=(value,min,max)=>Math.max(min,Math.min(max,value));
let weaponCatalog=[];
let weaponById=new Map();
let canonicalCharacterById=new Map();
let weaponDataLoaded=false;
let weaponDataReady;
let sequenceRuntimeDataLoaded=false;
let sequenceDataReady;
let sequenceAssetsByCharacter=new Map();
const SEQUENCE_RUNTIME_DATA_PATH='assets/sequence-runtime.json';
const WEAPON_RARITY_FRAMES={4:'assets/weapons/frames/4-star-square.png',5:'assets/weapons/frames/5-star-square.png'};
const WEAPON_MOTION={panel:380,grid:440,previewIn:460,previewOut:360,ease:'cubic-bezier(.16,.84,.24,1)'};
const reducedMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const nextWeaponFrame=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
const waitWeaponMotion=ms=>new Promise(resolve=>setTimeout(resolve,reducedMotion()?0:ms));
const weaponItemById=id=>weaponById.get(id)||null;
const formatWeaponSecondaryValue=value=>value===null||value===undefined?'—':`${Number((value*100).toFixed(2))}%`;
async function loadWeaponBrowserData(){
  const [browserDataResponse,manifestResponse]=await Promise.all([
    fetch('assets/weapons/browser-data.json',{cache:'no-store'}),
    fetch('assets/weapons/manifest.json',{cache:'no-store'})
  ]);
  if(!browserDataResponse.ok)throw new Error('weapon browser data '+browserDataResponse.status);
  if(!manifestResponse.ok)throw new Error('weapon manifest '+manifestResponse.status);
  const browserData=await browserDataResponse.json();
  const manifest=await manifestResponse.json();
  if(browserData.schemaVersion!==1)throw new Error('Unsupported Weapon browser data schema');
  const iconById=new Map(manifest.icons.map(icon=>[icon.weaponId,icon]));
  canonicalCharacterById=new Map(browserData.characters.map(character=>[character.id,character]));
  weaponCatalog=browserData.weapons.map((weapon,browseRank)=>{
    if(weapon.releaseStatus!=='RELEASED')throw new Error(`Non-released Weapon leaked into browser data: ${weapon.id}`);
    const icon=iconById.get(weapon.id);
    if(!icon)throw new Error(`Missing canonical Weapon icon for ${weapon.id}`);
    if(icon.weaponType!==weapon.weaponType||icon.rarity!==weapon.rarity)throw new Error(`Weapon manifest mismatch for ${weapon.id}`);
    return {...weapon,browseRank,artSrc:toAssetPath(icon.targetPath)};
  });
  weaponById=new Map(weaponCatalog.map(weapon=>[weapon.id,weapon]));
  weaponDataLoaded=true;
  document.documentElement.dataset.weaponCatalogReady='true';
  weaponUi.refreshForCharacter();
}
async function loadSequenceRuntimeData(){
  const response=await fetch(SEQUENCE_RUNTIME_DATA_PATH,{cache:'no-store'});
  if(!response.ok)throw new Error('sequence runtime data '+response.status);
  const payload=await response.json();
  if(payload.schemaVersion!==1||payload.role!=='character-builder.runtime-sequences'||!Array.isArray(payload.characters))throw new Error('Unsupported Sequence runtime data schema');
  sequenceAssetsByCharacter=new Map(payload.characters.map(character=>[character.characterId,character]));
  sequenceRuntimeDataLoaded=true;
  document.documentElement.dataset.sequenceCatalogReady='true';
  sequenceUi.refreshForCharacter();
}
function makeWeaponCard(item,{active=false,rarityFrame=false}={}){
  const frameSrc=rarityFrame?WEAPON_RARITY_FRAMES[item.rarity]:null;
  const card=document.createElement('div');card.className='weapon-card '+(frameSrc?'weapon-rarity-card':'weapon-neutral-card')+(active?' is-current':'');card.dataset.weaponId=item.id;card.dataset.name=item.name;card.dataset.rarity=String(item.rarity);
  const art=document.createElement('span');art.className='weapon-card-art';
  const image=document.createElement('img');image.src=item.artSrc;image.alt='';image.draggable=false;art.appendChild(image);
  const frame=frameSrc?document.createElement('img'):null;
  if(frame){frame.className='weapon-rarity-frame';frame.src=frameSrc;frame.alt='';frame.draggable=false;frame.dataset.rarity=String(item.rarity)}
  const badge=document.createElement('span');badge.className='weapon-equipped-badge';badge.textContent='Active Weapon';
  const copy=document.createElement('span');copy.className='weapon-card-copy';
  const name=document.createElement('strong');name.textContent=item.name;
  const note=document.createElement('small');note.textContent=item.level90BaseAtk===null?'Base ATK —':`Base ATK ${item.level90BaseAtk}`;
  copy.append(name,note);
  if(frame){
    const safe=document.createElement('span');safe.className='weapon-content-safe';safe.append(art,copy);card.append(frame,safe,badge);
  }else card.append(art,badge,copy);
  return card;
}
function makeWeaponHero(item){
  const hero=document.createElement('div');hero.className='weapon-preview-hero';hero.dataset.weaponId=item.id;hero.setAttribute('aria-label',`Full Weapon preview for ${item.name}`);
  const image=document.createElement('img');image.className='weapon-preview-art';image.src=item.artSrc;image.alt=item.name;image.draggable=false;hero.appendChild(image);return hero;
}
const weaponUi={
  overlay:null,panel:null,slotHost:null,previewStage:null,previewPane:null,choices:null,browser:null,scrollRail:null,
  characterName:null,characterId:null,characterWeaponType:null,items:[],currentId:null,previewId:null,previewLayer:null,choiceById:new Map(),open:false,busy:false,panelBusy:false,lastFocus:null,
  previewMotion:{incomingFrom:.64,incomingTo:1,outgoingFrom:1,outgoingTo:1.24,outgoingOpacity:0,incomingMs:460,outgoingMs:360},lastPreviewTransition:null,
  init(){
    this.overlay=document.getElementById('weaponOverlay');this.panel=document.getElementById('weaponPanel');
    this.slotHost=document.getElementById('weaponSlotHost');this.previewStage=document.getElementById('weaponPreviewStage');
    this.previewPane=document.getElementById('weaponPreviewPane');this.choices=document.getElementById('weaponChoices');
    this.browser=document.getElementById('weaponBrowser');this.scrollRail=document.getElementById('weaponScrollRail');
    this.browser.addEventListener('scroll',()=>this.syncScrollbar(),{passive:true});
    if('ResizeObserver'in window)new ResizeObserver(()=>this.syncScrollbar()).observe(this.browser);
    this.renderBuildSlot();
  },
  setCharacter(name){
    this.characterName=name||null;this.characterId=name?characterByName.get(name)?.id||null:null;
    if(weaponDataLoaded)this.refreshForCharacter();else this.renderBuildSlot();
  },
  refreshForCharacter(){
    const character=this.characterId?canonicalCharacterById.get(this.characterId):null;
    this.characterWeaponType=character?.weaponType||null;
    this.items=character?.weaponType?weaponCatalog.filter(item=>item.weaponType===character.weaponType):[];
    const savedId=this.characterName?draft(this.characterName).build.weaponId:null;
    this.currentId=this.items.some(item=>item.id===savedId)?savedId:null;
    this.rebuildChoices();this.clearPreview();this.syncEquipped();this.renderBuildSlot();
  },
  rebuildChoices(){
    this.choiceById.clear();this.choices.replaceChildren();
    this.items.forEach(item=>{
      const choice=document.createElement('button');choice.type='button';choice.className='weapon-choice';
      choice.classList.toggle('has-rarity-frame',!!WEAPON_RARITY_FRAMES[item.rarity]);
      choice.dataset.weaponId=item.id;choice.dataset.name=item.name;choice.dataset.rarity=String(item.rarity);choice.dataset.weaponType=item.weaponType;choice.dataset.baseRank=String(item.browseRank);choice.setAttribute('aria-label','Preview '+item.name);
      choice.appendChild(makeWeaponCard(item,{rarityFrame:true}));choice.addEventListener('click',()=>this.select(choice));this.choiceById.set(item.id,choice);this.choices.appendChild(choice);
    });
    this.syncScrollbar();
  },
  browseIds(){return this.items.map(item=>item.id)},
  orderedIds(){const browse=this.browseIds().filter(id=>id!==this.currentId);return this.currentId?[this.currentId,...browse]:browse},
  renderBuildSlot(){
    [...this.slotHost.querySelectorAll('.weapon-card')].forEach(node=>node.remove());
    const item=weaponItemById(this.currentId);
    this.slotHost.classList.toggle('has-weapon',!!item);
    const button=document.getElementById('weaponBtn');
    if(button)button.setAttribute('aria-label',item?`Open Weapon menu. Active: ${item.name}`:'Open Weapon menu');
    if(item)this.slotHost.appendChild(makeWeaponCard(item,{active:true,rarityFrame:false}));
  },
  syncScrollbar(){
    if(!this.browser||!this.scrollRail)return;
    const max=Math.max(0,this.browser.scrollHeight-this.browser.clientHeight);
    const progress=max?this.browser.scrollTop/max:0;
    this.scrollRail.style.setProperty('--scroll-p',String(progress));
    this.scrollRail.classList.toggle('has-scroll',max>1);
  },
  syncEquipped(){
    this.choiceById.forEach((choice,id)=>{
      const active=id===this.currentId;choice.classList.toggle('is-equipped',active);
      const card=choice.querySelector('.weapon-card');card?.classList.toggle('is-current',active);
      choice.setAttribute('aria-label',(active?'Active Weapon, ':'Preview ')+(choice.dataset.name||'Weapon'));
    });
    this.syncEquipAction();
  },
  syncEquipAction(){
    const button=document.getElementById('weaponEquip');if(!button)return;
    const hasPreview=!!this.previewId,alreadyActive=hasPreview&&this.previewId===this.currentId;
    button.disabled=!hasPreview||alreadyActive;
    button.textContent=alreadyActive?'Active Weapon':'Equip Weapon';
  },
  async reorderChoices({animate=true}={}){
    const before=new Map([...this.choices.children].map(node=>[node,node.getBoundingClientRect()]));
    const ordered=this.orderedIds().map(id=>this.choiceById.get(id)).filter(Boolean);
    ordered.forEach(node=>this.choices.appendChild(node));
    await nextWeaponFrame();this.syncScrollbar();
    if(!animate||reducedMotion())return;
    const animations=[];
    ordered.forEach(node=>{
      node.getAnimations().forEach(a=>a.cancel());
      const a=before.get(node),b=node.getBoundingClientRect();if(!a||!b)return;
      const dx=a.left-b.left,dy=a.top-b.top;if(Math.abs(dx)<.5&&Math.abs(dy)<.5)return;
      const animation=node.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'translate(0,0)'}],{duration:WEAPON_MOTION.grid,easing:WEAPON_MOTION.ease});
      animations.push(animation.finished.catch(()=>{}));
    });
    await Promise.all(animations);
  },
  clearPreview(){
    this.previewId=null;this.previewLayer=null;this.previewStage.replaceChildren();
    this.panel.classList.remove('has-preview');this.previewPane.setAttribute('aria-hidden','true');document.getElementById('weaponPreviewName').textContent='Weapon';
    document.getElementById('weaponPreviewAtk').textContent='—';document.getElementById('weaponPreviewSecondaryLabel').textContent='Secondary';document.getElementById('weaponPreviewSecondaryValue').textContent='—';this.syncEquipAction();
  },
  async transitionPreview(item){
    const old=this.previewLayer;
    this.lastPreviewTransition={from:this.previewId,to:item.id,...this.previewMotion,reduced:reducedMotion()};
    const layer=document.createElement('div');layer.className='weapon-preview-layer is-incoming';layer.dataset.weaponId=item.id;layer.appendChild(makeWeaponHero(item));
    this.previewStage.appendChild(layer);this.previewLayer=layer;this.previewId=item.id;
    document.getElementById('weaponPreviewName').textContent=item.name;document.getElementById('weaponPreviewAtk').textContent=item.level90BaseAtk??'—';
    document.getElementById('weaponPreviewSecondaryLabel').textContent=item.secondary?.stat||'Secondary';document.getElementById('weaponPreviewSecondaryValue').textContent=formatWeaponSecondaryValue(item.secondary?.value);
    this.panel.classList.add('has-preview');this.previewPane.setAttribute('aria-hidden','false');this.syncEquipAction();
    if(reducedMotion()){
      old?.remove();layer.classList.remove('is-incoming');return;
    }
    const incoming=layer.animate(
      [{opacity:0,transform:`scale(${this.previewMotion.incomingFrom})`,filter:'blur(7px)'},{opacity:1,transform:`scale(${this.previewMotion.incomingTo})`,filter:'blur(0px)'}],
      {duration:WEAPON_MOTION.previewIn,easing:WEAPON_MOTION.ease,fill:'forwards'}
    );
    let outgoing=null;
    if(old&&old.isConnected){
      old.classList.remove('is-incoming');old.classList.add('is-outgoing');
      outgoing=old.animate(
        [{opacity:1,transform:`scale(${this.previewMotion.outgoingFrom})`,filter:'blur(0px)'},{opacity:this.previewMotion.outgoingOpacity,transform:`scale(${this.previewMotion.outgoingTo})`,filter:'blur(5px)'}],
        {duration:WEAPON_MOTION.previewOut,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'}
      );
    }
    await Promise.all([incoming.finished.catch(()=>{}),outgoing?.finished.catch(()=>{})]);
    incoming.cancel();outgoing?.cancel();old?.remove();layer.classList.remove('is-incoming');
  },
  async show(){
    if(this.open||this.busy||this.panelBusy||!this.characterId)return;this.panelBusy=true;await weaponDataReady;
    if(!this.items.length){this.panelBusy=false;return}
    this.open=true;this.lastFocus=document.activeElement;
    document.getElementById('weaponBtn').setAttribute('aria-expanded','true');this.clearPreview();this.syncEquipped();await this.reorderChoices({animate:false});
    this.overlay.classList.add('mounted');this.overlay.setAttribute('aria-hidden','false');requestAnimationFrame(()=>{this.overlay.classList.add('open');this.syncScrollbar()});
    await waitWeaponMotion(WEAPON_MOTION.panel);this.panelBusy=false;
    if(this.open&&!this.busy)document.getElementById('weaponClose').focus();
  },
  async hide(){

const sequenceUi={
  panel:null,nodes:[],inspector:null,characterName:null,characterId:null,assets:null,currentLevel:0,previewSequence:null,

  normalizeLevel(value){const level=Number(value);return Number.isInteger(level)&&level>=0&&level<=6?level:0},

class FreewheelCarousel{

const toAssetPath=targetPath=>targetPath.replace(/^docs\/ui-prototypes\//,'');
const roverName=id=>'Rover ('+id.replace(/^rover-/,'').replace(/^./,c=>c.toUpperCase())+')';
async function loadReleasedCharacters(){
  const response=await fetch('assets/characters/portraits/manifest.json',{cache:'no-store'});
  if(!response.ok)throw new Error('portrait manifest '+response.status);
  const manifest=await response.json();
  const direct=manifest.portraits.filter(item=>item.releaseStatus==='RELEASED'&&item.uiEligible===true).map(item=>({id:item.characterId,name:item.characterName,src:toAssetPath(item.targetPath)}));
  const rovers=manifest.roverPortraits.map(item=>({id:item.characterId,name:roverName(item.characterId),src:toAssetPath(item.targetPath)}));
  const characters=[...direct,...rovers].sort((a,b)=>a.name.localeCompare(b.name,'en'));
  if(characters.length!==57)throw new Error('expected 57 released Character cards, got '+characters.length);
  releasedCharacters=characters;characterByName.clear();characters.forEach(item=>characterByName.set(item.name,item));
  if(document.getElementById('build').classList.contains('active'))buildPicker.render();
  if(document.getElementById('improve').classList.contains('active'))improvePicker.render();
}
const characterManifestReady=loadReleasedCharacters().catch(error=>{console.error(error);document.documentElement.dataset.characterManifestError=String(error.message||error)});

function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));if(id==='home')renderHome();if(id==='build'){buildPicker.reset();buildPicker.render()}if(id==='improve'){improvePicker.reset();improvePicker.render()}}
let majorBusy=false;function major(target,card){if(majorBusy)return;majorBusy=true;const home=document.querySelector('#home');card.classList.add('major-source');home.classList.add('home-leaving');setTimeout(()=>{const dest=document.getElementById(target);dest.classList.add('major-enter');show(target);requestAnimationFrame(()=>requestAnimationFrame(()=>dest.classList.add('go')));setTimeout(()=>{dest.classList.remove('major-enter','go');home.classList.remove('home-leaving');card.classList.remove('major-source');majorBusy=false},650)},450)}

let homeCarousel=null;

  const items=[{title:'Build a Character',target:'build',className:'card-build',src:'assets/v34/bellibing-ui-build-character-rover.webp'},{title:'Improve a Character',target:'improve',className:'card-improve',src:'assets/v34/bellibing-ui-improve-character-augusta.webp'},{title:'Build a Team',target:'team',className:'card-team',src:'assets/v34/bellibing-ui-build-team.webp'}];
  const stage=document.querySelector('#homeStage');homeCarousel?.destroy();stage.innerHTML='';
  const cards=items.map(({title,target,className,src})=>{const b=document.createElement('button');b.type='button';b.className='home-card '+className;b.innerHTML='<div class="home-card-art"><img src="'+src+'" alt="" draggable="false"></div><strong class="home-card-title">'+title+'</strong>';b.dataset.target=target;b.setAttribute('aria-label',title);stage.appendChild(b);return b});
  homeCarousel=new FreewheelCarousel(stage,{cards,startIndex:1,spacing:()=>stage.clientWidth<520?238:stage.clientWidth<900?270:318,onActivate:(card)=>major(card.dataset.target,card)});

function makePicker({shellId,wheelId,items,mode}){
  const shell=document.getElementById(shellId),wheel=document.getElementById(wheelId);let list=[],cards=[],selected=null,pending=null,collapseTimer=null,carousel=null;
  function source(){return typeof items==='function'?items():items}
  function spacing(){if(shell.classList.contains('hover-expanded'))return 146;if(shell.classList.contains('has-selection'))return 98;return wheel.clientWidth<700?200:228}
  function select(name){if(mode==='build'){draft(name);autosave(name,{lastOpenedAt:new Date().toISOString()});document.getElementById('buildName').textContent=name;const btn=document.getElementById('accountBtn');btn.textContent=owned(name)?'On Account':'Add to Account';btn.classList.toggle('owned',owned(name));btn.disabled=owned(name);weaponUi.setCharacter(name);sequenceUi.setCharacter(name)}else{document.getElementById('improveFocus').textContent=name;autosave(name,{lastImprovedAt:new Date().toISOString()})}selected=name;const idx=Math.max(0,list.findIndex(item=>item.name===name));const before=wheel.getBoundingClientRect();shell.classList.add('has-selection');shell.classList.remove('hover-expanded');const after=wheel.getBoundingClientRect();const dy=before.top-after.top;if(!shell.dataset.wasSelected&&!matchMedia('(prefers-reduced-motion:reduce)').matches){shell.dataset.wasSelected='1';const a=wheel.animate([{transform:'translateY('+dy+'px)'},{transform:'translateY(0)'}],{duration:620,easing:'cubic-bezier(.16,.84,.24,1)'});a.onfinish=()=>a.cancel()}else shell.dataset.wasSelected='1';carousel?.setIndex(idx);carousel?.paint()}
  function requestSwitch(name){if(name===selected)return;pending=name;document.getElementById('dialogCopy').textContent='Switch to '+name+'?';document.getElementById('dialogBg').classList.add('open')}
  function closeDialog(){pending=null;document.getElementById('dialogBg').classList.remove('open')}
  function render(){
    list=source().filter(Boolean);carousel?.destroy();carousel=null;wheel.innerHTML='';cards=[];
    if(!list.length){shell.querySelector('.question').textContent=mode==='build'&&!releasedCharacters.length?'Loading Characters…':'No Characters yet';delete wheel.dataset.focusIndex;return}
    shell.querySelector('.question').textContent='What Character?';
    cards=list.map((item)=>{const b=document.createElement('button');b.type='button';b.className='choice';b.dataset.characterId=item.id;b.setAttribute('aria-label',item.name);b.innerHTML='<strong class="choice-name"></strong><span class="choice-portrait"><img alt="" draggable="false"></span>';b.querySelector('.choice-name').textContent=item.name;b.querySelector('img').src=item.src;wheel.appendChild(b);return b});
    const startIndex=selected?Math.max(0,list.findIndex(item=>item.name===selected)):mode==='build'?Math.max(0,list.findIndex(item=>item.id==='augusta')):0;
    carousel=new FreewheelCarousel(wheel,{cards,startIndex,spacing,onActivate:(_card,i)=>{const name=list[i].name;if(shell.classList.contains('has-selection'))requestSwitch(name);else select(name)}});
  }
  function reset(){selected=null;pending=null;shell.classList.remove('has-selection','hover-expanded');delete shell.dataset.wasSelected;if(mode==='build'){document.getElementById('buildName').textContent='';const btn=document.getElementById('accountBtn');btn.textContent='Add to Account';btn.classList.remove('owned');btn.disabled=false;weaponUi.setCharacter(null);sequenceUi.setCharacter(null)}else document.getElementById('improveFocus').textContent='';closeDialog()}
  wheel.addEventListener('mouseenter',()=>{if(shell.classList.contains('has-selection')&&matchMedia('(hover:hover)').matches){clearTimeout(collapseTimer);shell.classList.add('hover-expanded');carousel?.paint()}});
  wheel.addEventListener('mouseleave',()=>{if(matchMedia('(hover:hover)').matches){clearTimeout(collapseTimer);collapseTimer=setTimeout(()=>{shell.classList.remove('hover-expanded');carousel?.paint()},320)}});
  return{render,reset,select,repaint(){carousel?.paint()},get selected(){return selected},get pending(){return pending},confirm(){if(pending){autosave(selected,{lastLeftAt:new Date().toISOString()});select(pending)}closeDialog()},closeDialog}
}
