le(1.16)}.major-enter .picker-shell,.major-enter .team-placeholder{opacity:0;transform:scale(.84)}.major-enter.go .picker-shell,.major-enter.go .team-placeholder{opacity:1;transform:scale(1);transition:transform .72s cubic-bezier(.16,.84,.24,1),opacity .5s ease}
.picker-shell{position:absolute;inset:0;padding-top:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:justify-content .62s cubic-bezier(.16,.84,.24,1)}.question{margin:0 0 30px;font-family:var(--font-display);font-size:52px;line-height:1;transition:opacity .46s ease,transform .7s cubic-bezier(.16,.84,.24,1),height .7s ease,margin .7s ease}.wheel{--cw:252px;--ch:352px;position:relative;width:100%;height:410px;touch-action:pan-y;user-select:none;cursor:grab;z-index:30;transition:height .72s cubic-bezier(.16,.84,.24,1)}.choice{--x:0px;--s:1;--o:1;position:absolute;left:50%;top:50%;width:var(--cw);height:var(--ch);transform:translate(-50%,-50%) translateX(var(--x)) scale(var(--s));opacity:var(--o);border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,#171a21,#0d1015);color:#fff;box-shadow:0 20px 60px rgba(0,0,0,.45);cursor:pointer;transition:transform .62s cubic-bezier(.16,.84,.24,1),width .62s cubic-bezier(.16,.84,.24,1),height .62s cubic-bezier(.16,.84,.24,1),border-radius .62s cubic-bezier(.16,.84,.24,1),opacity .48s ease}.choice-name{position:absolute;z-index:4;top:12px;left:2px;right:2px;min-height:39px;display:flex;align-items:flex-start;justify-content:center;padding:0 2px 5px;text-align:center;font-family:var(--font-display);font-size:27px;font-weight:400;line-height:1.22;white-space:nowrap;overflow:visible;text-shadow:0 2px 14px rgba(0,0,0,.75)}.choice-portrait{position:absolute;top:62px;left:12px;right:12px;aspect-ratio:1;border-radius:18px;overflow:hidden;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.08),transparent 68%)}.choice-portrait img{width:100%;height:100%;object-fit:contain;object-position:50% 50%;pointer-events:none;user-select:none;-webkit-user-drag:none}.wheel.dragging .choice{transition:none}.picker-shell.has-selection{justify-content:flex-start}.picker-shell.has-selection .question{opacity:0;height:0;margin:0;overflow:hidden;transform:translateY(-10px)}.picker-shell.has-selection .wheel{--cw:82px;--ch:82px;height:122px}.picker-shell.has-selection .choice{border-radius:50%}.picker-shell.has-selection .choice-name{top:auto;bottom:-31px;left:50%;right:auto;width:max-content;max-width:170px;min-height:23px;transform:translateX(-50%);padding:0 3px 4px;font-size:14px;line-height:1.22;color:#9aa0a9;text-shadow:none}.picker-shell.has-selection .choice-portrait{inset:0;aspect-ratio:auto;border-radius:50%}.picker-shell.hover-expanded .wheel{--cw:160px;--ch:210px;height:250px}.picker-shell.hover-expanded .choice{border-radius:16px}.picker-shell.hover-expanded .choice-name{top:8px;bottom:auto;left:2px;right:auto;width:calc(100% - 4px);max-width:none;min-height:30px;transform:none;padding:0 1px 4px;font-size:17px;line-height:1.22;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.75)}.picker-shell.hover-expanded .choice-portrait{top:44px;left:8px;right:8px;bottom:auto;aspect-ratio:1;border-radius:12px}.build-stage{visibility:hidden;opacity:0;pointer-events:none;position:absolute;inset:0;z-index:2}.picker-shell.has-selection .build-stage{visibility:visible;opacity:1}.focus{position:absolute;left:50%;top:50%;transform:translate(-50%,-43%);width:min(540px,45vw);height:min(590px,60vh);display:flex;flex-direction:column;align-items:center;justify-content:center}.focus h1{margin:0 0 8px;font-family:var(--font-display);font-size:48px}.focus-art{width:100%;flex:1;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 48%,rgba(255,165,70,.10),transparent 60%);color:#6b4a34;font-size:12px;letter-spacing:.18em}.side-left{position:absolute;left:max(5vw,48px);top:50%;width:min(290px,23vw);height:min(540px,58vh);transform:translate(-70px,-43%);opacity:0;display:flex;flex-direction:column;justify-content:space-between;gap:22px;pointer-events:auto}.picker-shell.has-selection .side-left{opacity:1;transform:translate(0,-43%);transition:opacity .48s ease .14s,transform .78s cubic-bezier(.16,.84,.24,1) .14s}.block h2,.echoes h2,.seq h2{margin:0 0 12px;font-family:var(--font-display);font-size:23px}.stats-box{height:255px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.02);padding:18px;display:flex;flex-direction:column;justify-content:center;gap:20px}.statline{height:11px;border-radius:99px;background:rgba(255,255,255,.06)}.weapon{height:108px;width:100%;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.02);color:#777;font-size:28px}.echoes{position:absolute;right:max(5vw,48px);top:50%;width:98px;transform:translate(70px,-43%);opacity:0;pointer-events:auto}.picker-shell.has-selection .echoes{opacity:1;transform:translate(0,-43%);transition:opacity .48s ease .2s,transform .78s cubic-bezier(.16,.84,.24,1) .2s}.echo-stack{display:grid;gap:10px}.echo{aspect-ratio:1;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.02);color:#777;font-size:24px}.seq{position:absolute;left:clamp(340px,31vw,470px);top:50%;width:88px;transform:translate(-55px,-40%);opacity:0;pointer-events:auto}.picker-shell.has-selection .seq{opacity:1;transform:translate(0,-40%);transition:opacity .46s ease .18s,transform .76s cubic-bezier(.16,.84,.24,1) .18s}.seq h2{text-align:center;font-size:18px}.seq-line{position:relative;height:360px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}.seq-line::before{content:"";position:absolute;top:28px;bottom:20px;left:50%;width:1px;background:rgba(255,255,255,.11)}.node{position:relative;z-index:1;display:grid;place-items:center;aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.13);background:#14171d;color:#89919a;font-size:10px}.n1{width:34px}.n2{width:38px}.n3{width:42px}.n4{width:47px}.n5{width:52px}.n6{width:58px}.account{position:absolute;right:24px;bottom:20px;border:1px solid #eee;border-radius:13px;background:#eee;color:#08090b;padding:13px 18px;font-weight:800;pointer-events:auto}.account.owned{background:#171a20;color:#7e858e;border-color:var(--line)}.dialog-bg{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.68);display:none;place-items:center}.dialog-bg.open{display:grid}.dialog{width:min(390px,calc(100vw - 32px));padding:26px;border:1px solid var(--line);border-radius:20px;background:#11141a;text-align:center}.dialog h2{margin:0 0 8px}.dialog-actions{display:flex;justify-content:center;gap:10px;margin-top:20px}.dialog button{padding:11px 16px;border-radius:11px;border:1px solid var(--line);background:#191d24;color:#fff}.dialog .primary{background:#eee;color:#08090b}.team-placeholder{position:absolute;font-family:var(--font-display);inset:0;display:grid;place-items:center;font-size:52px}.improve-focus{position:absolute;font-family:var(--font-display);inset:150px 0 0;display:grid;place-items:center;font-size:52px;opacity:0;pointer-events:none}.picker-shell.has-selection .improve-focus{opacity:1;transition:opacity .35s ease .15s}
.home-stage.freewheel-moving .home-card,.wheel.freewheel-moving .choice{transition:none!important}.home-stage:focus-visible,.wheel:focus-visible{outline:1px solid rgba(255,255,255,.38);outline-offset:-3px}@media(max-width:900px){.focus{width:48vw}.side-left{left:24px;width:190px}.seq{left:245px}.echoes{right:24px;width:82px}}@media(max-width:760px){.home-stage{width:calc(100% - 16px)}html,body{overflow:auto}.page{overflow:auto}.focus,.side-left,.seq,.echoes{position:relative;inset:auto;transform:none!important;width:min(520px,88vw);height:auto;margin:0 auto 22px}.build-stage{position:relative;padding:130px 0 70px}.focus{height:460px}.picker-shell.has-selection .build-stage{display:flex;flex-direction:column}.side-left,.seq,.echoes{opacity:1}.seq-line{height:auto;flex-direction:row-reverse}.seq-line::before{top:50%;bottom:auto;left:20px;right:20px;width:auto;height:1px}.echo-stack{grid-template-columns:repeat(5,1fr)}.account{position:fixed}.home-card{height:min(500px,calc(100vh - 96px))}.question{font-size:42px}}

<body>
<section id="home" class="page active"><div id="homeStage" class="home-stage"></div></section>
<section id="build" class="page"><button class="menu" data-home>☰</button><div id="buildShell" class="picker-shell"><h1 class="question">What Character?</h1><div id="buildWheel" class="wheel" tabindex="0"></div><div class="build-stage"><div class="focus"><h1 id="buildName"></h1><div class="focus-art">TEMP CHARACTER ART</div></div><aside class="side-left"><section class="block"><h2>Stats</h2><div class="stats-box"><div class="statline"></div><div class="statline"></div><div class="statline"></div><div class="statline" style="width:68%"></div></div></section><section class="block"><h2>Weapon</h2><button class="weapon">+</button></section></aside><aside class="seq"><h2>Sequences</h2><div class="seq-line"><button class="node n6">S6</button><button class="node n5">S5</button><button class="node n4">S4</button><button class="node n3">S3</button><button class="node n2">S2</button><button class="node n1">S1</button></div></aside><aside class="echoes"><h2>Echoes</h2><div class="echo-stack"><button class="echo">+</button><button class="echo">+</button><button class="echo">+</button><button class="echo">+</button><button class="echo">+</button></div></aside><button id="accountBtn" class="account">Add to Account</button></div></div></section>
<section id="improve" class="page"><button class="menu" data-home>☰</button><div id="improveShell" class="picker-shell"><h1 class="question">What Character?</h1><div id="improveWheel" class="wheel" tabindex="0"></div><div id="improveFocus" class="improve-focus"></div></div></section>
<section id="team" class="page"><button class="menu" data-home>☰</button><div class="team-placeholder">Build a Team</div></section>
<div id="dialogBg" class="dialog-bg"><div class="dialog"><h2>Switch Character?</h2><p id="dialogCopy"></p><div class="dialog-actions"><button id="cancelSwitch">Cancel</button><button id="confirmSwitch" class="primary">Switch</button></div></div></div>
<script>
const KEY='bellibing-ui-checkpoint-v34';
let releasedCharacters=[];
const characterByName=new Map();
let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}}state={characters:Array.isArray(state.characters)?state.characters:[],drafts:state.drafts&&typeof state.drafts==='object'?state.drafts:{}};
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
function draft(name){if(!state.drafts[name]){state.drafts[name]={character:name,build:{},createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};save()}return state.drafts[name]}
function autosave(name,patch={}){if(!name)return;const d=draft(name);d.build={...d.build,...patch};d.updatedAt=new Date().toISOString();save()}
const owned=n=>state.characters.includes(n);
function addOwned(n){draft(n);if(!owned(n))state.characters.push(n);state.drafts[n].addedToAccountAt=state.drafts[n].addedToAccountAt||new Date().toISOString();save()}
const clamp=(value,min,max)=>Math.max(min,Math.min(max,value));

class FreewheelCarousel{
  constructor(viewport,{cards=[...viewport.children],startIndex=0,spacing,onActivate=null}={}){
    this.viewport=viewport;this.cards=cards;this.spacingFn=spacing;this.onActivate=onActivate;
    this.max=Math.max(0,cards.length-1);this.pos=clamp(startIndex,0,this.max);this.index=Math.round(this.pos);
    this.pointer=null;this.lastX=0;this.lastT=0;this.velocity=0;this.dragDistance=0;this.suppressUntil=0;this.raf=0;
    this.reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
    this.clickHandlers=[];
    this.onPointerDown=e=>{if(e.button!==undefined&&e.button!==0)return;this.stop();this.pointer=e.pointerId;this.viewport.setPointerCapture?.(e.pointerId);this.lastX=e.clientX;this.lastT=performance.now();this.velocity=0;this.dragDistance=0;this.viewport.classList.add('freewheel-moving')};
    this.onPointerMove=e=>{if(e.pointerId!==this.pointer)return;const now=performance.now(),dx=e.clientX-this.lastX,dt=Math.max(8,now-this.lastT),step=-dx/this.spacing();this.pos=clamp(this.pos+step,-1.25,this.max+1.25);const instant=step/dt;this.velocity=this.velocity*.68+instant*.32;this.dragDistance+=Math.abs(dx);this.lastX=e.clientX;this.lastT=now;this.paint()};
    this.onPointerEnd=e=>{if(e.pointerId!==this.pointer)return;this.pointer=null;if(this.dragDistance>6){this.suppressUntil=performance.now()+240;this.release()}else{this.viewport.classList.remove('freewheel-moving');this.animateTo(Math.round(clamp(this.pos,0,this.max)))}};
    this.onWheel=e=>{if(Math.abs(e.deltaY)<4&&Math.abs(e.deltaX)<4)return;e.preventDefault();const delta=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;this.animateTo(this.index+(delta>0?1:-1))};
    this.onKey=e=>{if(e.key==='ArrowLeft'){e.preventDefault();this.animateTo(this.index-1)}else if(e.key==='ArrowRight'){e.preventDefault();this.animateTo(this.index+1)}};
    this.onResize=()=>this.paint();
    viewport.classList.add('freewheel');viewport.tabIndex=0;
    viewport.addEventListener('pointerdown',this.onPointerDown);viewport.addEventListener('pointermove',this.onPointerMove);viewport.addEventListener('pointerup',this.onPointerEnd);viewport.addEventListener('pointercancel',this.onPointerEnd);viewport.addEventListener('wheel',this.onWheel,{passive:false});viewport.addEventListener('keydown',this.onKey);addEventListener('resize',this.onResize);
    cards.forEach((card,i)=>{const handler=()=>{if(performance.now()<this.suppressUntil)return;if(i===this.index&&Math.abs(this.pos-i)<.06){this.onActivate?.(card,i);return}this.animateTo(i)};this.clickHandlers.push([card,handler]);card.addEventListener('click',handler)});
    this.paint();
  }
  spacing(){return Math.max(1,Number(this.spacingFn?.())||250)}
  visualPosition(){if(this.pos<0)return-Math.sqrt(-this.pos)*.32;if(this.pos>this.max)return this.max+Math.sqrt(this.pos-this.max)*.32;return this.pos}
  paint(){const p=this.visualPosition(),space=this.spacing();this.cards.forEach((card,i)=>{const d=i-p,a=Math.abs(d);card.style.setProperty('--x',d*space+'px');card.style.setProperty('--s',Math.max(.70,1.075-a*.17));card.style.setProperty('--o',Math.max(.18,1-a*.24));card.style.zIndex=String(40-Math.round(a*6))});this.index=clamp(Math.round(this.pos),0,this.max);this.viewport.dataset.focusIndex=String(this.index)}
  stop(){if(this.raf)cancelAnimationFrame(this.raf);this.raf=0}
  animateTo(target,initialVelocity=0,{immediate=false}={}){this.stop();target=clamp(target,0,this.max);if(immediate||this.reduced){this.pos=target;this.viewport.classList.remove('freewheel-moving');this.paint();return}this.viewport.classList.add('freewheel-moving');const from=this.pos,distance=Math.abs(target-from),speedBoost=Math.min(120,Math.abs(initialVelocity)*18000),duration=clamp(330+distance*88+speedBoost,300,650),start=performance.now(),ease=t=>1-Math.pow(1-t,4);const tick=now=>{const t=Math.min(1,(now-start)/duration);this.pos=from+(target-from)*ease(t);this.paint();if(t<1)this.raf=requestAnimationFrame(tick);else{this.raf=0;this.pos=target;this.paint();this.viewport.classList.remove('freewheel-moving')}};this.raf=requestAnimationFrame(tick)}
  release(){const projected=this.pos+this.velocity*260,target=Math.round(clamp(projected,0,this.max));this.animateTo(target,this.velocity)}
  setIndex(index,{animate=false}={}){this.animateTo(index,0,{immediate:!animate})}
  destroy(){this.stop();this.viewport.classList.remove('freewheel','freewheel-moving');this.viewport.removeEventListener('pointerdown',this.onPointerDown);this.viewport.removeEventListener('pointermove',this.onPointerMove);this.viewport.removeEventListener('pointerup',this.onPointerEnd);this.viewport.removeEventListener('pointercancel',this.onPointerEnd);this.viewport.removeEventListener('wheel',this.onWheel);this.viewport.removeEventListener('keydown',this.onKey);removeEventListener('resize',this.onResize);this.clickHandlers.forEach(([card,handler])=>card.removeEventListener('click',handler));this.clickHandlers=[]}
}

const toAssetPath=targetPath=>targetPath.replace(/^docs\/ui-prototypes\//,'');
const roverName=id=>'Rover ('+id.replace(/^rover-/,'').replace(/^./,c=>c.toUpperCase())+')';
async function loadReleasedCharacters(){
  const response=await fetch('assets/characters/portraits/manifest.json',{cache:'no-store'});
  if(!response.ok)throw new Error('portrait manifest '+response.status);
  const manifest=await response.json();
  const direct=manifest.portraits.filter(item=>item.releaseStatus==='RELEASED'&&item.uiEligible===true).map(item=>({id:item.characterId,name:item.characterName,src:toAssetPath(item.targetPath)}));
  const rovers=manifest.roverPortraits.map(item=>({id:item.characterId,name:roverName(item.characterId),src:toAssetPath(item.targetPath)}));
  const characters=[...direct,...rovers].sort((a,b)=>a.name.localeCompare(b.name,'en'));
  if(characters.length!==57)throw new Error('expected 57 released Character cards, got '+characters.length);
  releasedCharacters=characters;characterByName.clear();characters.forEach(item=>characterByName.set(item.name,item));
  if(document.getElementById('build').classList.contains('active'))buildPicker.render();
  if(document.getElementById('improve').classList.contains('active'))improvePicker.render();
}
const characterManifestReady=loadReleasedCharacters().catch(error=>{console.error(error);document.documentElement.dataset.characterManifestError=String(error.message||error)});

function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));if(id==='home')renderHome();if(id==='build'){buildPicker.reset();buildPicker.render()}if(id==='improve'){improvePicker.reset();improvePicker.render()}}
let majorBusy=false;function major(target,card){if(majorBusy)return;majorBusy=true;const home=document.querySelector('#home');card.classList.add('major-source');home.classList.add('home-leaving');setTimeout(()=>{const dest=document.getElementById(target);dest.classList.add('major-enter');show(target);requestAnimationFrame(()=>requestAnimationFrame(()=>dest.classList.add('go')));setTimeout(()=>{dest.classList.remove('major-enter','go');home.classList.remove('home-leaving');card.classList.remove('major-source');majorBusy=false},650)},450)}

let homeCarousel=null;
function renderHome(){
  const items=[{title:'Build a Character',target:'build',className:'card-build',src:'assets/v34/bellibing-ui-build-character-rover.webp'},{title:'Improve a Character',target:'improve',className:'card-improve',src:'assets/v34/bellibing-ui-improve-character-augusta.webp'},{title:'Build a Team',target:'team',className:'card-team',src:'assets/v34/bellibing-ui-build-team.webp'}];
  const stage=document.querySelector('#homeStage');homeCarousel?.destroy();stage.innerHTML='';
  const cards=items.map(({title,target,className,src})=>{const b=document.createElement('button');b.className='home-card '+className;b.innerHTML='<div class="home-card-art"><img src="'+src+'" alt="" draggable="false"></div><strong class="home-card-title">'+title+'</strong>';b.dataset.target=target;b.setAttribute('aria-label',title);stage.appendChild(b);return b});
  homeCarousel=new FreewheelCarousel(stage,{cards,startIndex:1,spacing:()=>stage.clientWidth<520?238:stage.clientWidth<900?270:318,onActivate:(card)=>major(card.dataset.target,card)});
}

function makePicker({shellId,wheelId,items,mode}){
  const shell=document.getElementById(shellId),wheel=document.getElementById(wheelId);let list=[],cards=[],selected=null,pending=null,collapseTimer=null,carousel=null;
  function source(){return typeof items==='function'?items():items}
  function spacing(){if(shell.classList.contains('hover-expanded'))return 146;if(shell.classList.contains('has-selection'))return 98;return wheel.clientWidth<700?200:228}
  function select(name){if(mode==='build'){draft(name);autosave(name,{lastOpenedAt:new Date().toISOString()});document.getElementById('buildName').textContent=name;const btn=document.getElementById('accountBtn');btn.textContent=owned(name)?'On Account':'Add to Account';btn.classList.toggle('owned',owned(name));btn.disabled=owned(name)}else{document.getElementById('improveFocus').textContent=name;autosave(name,{lastImprovedAt:new Date().toISOString()})}selected=name;const idx=Math.max(0,list.findIndex(item=>item.name===name));const before=wheel.getBoundingClientRect();shell.classList.add('has-selection');shell.classList.remove('hover-expanded');const after=wheel.getBoundingClientRect();const dy=before.top-after.top;if(!shell.dataset.wasSelected&&!matchMedia('(prefers-reduced-motion:reduce)').matches){shell.dataset.wasSelected='1';const a=wheel.animate([{transform:'translateY('+dy+'px)'},{transform:'translateY(0)'}],{duration:620,easing:'cubic-bezier(.16,.84,.24,1)'});a.onfinish=()=>a.cancel()}else shell.dataset.wasSelected='1';carousel?.setIndex(idx);carousel?.paint()}
  function requestSwitch(name){if(name===selected)return;pending=name;document.getElementById('dialogCopy').textContent='Switch to '+name+'?';document.getElementById('dialogBg').classList.add('open')}
  function closeDialog(){pending=null;document.getElementById('dialogBg').classList.remove('open')}
  function render(){
    list=source().filter(Boolean);carousel?.destroy();carousel=null;wheel.innerHTML='';cards=[];
    if(!list.length){shell.querySelector('.question').textContent=mode==='build'&&!releasedCharacters.length?'Loading Characters…':'No Characters yet';delete wheel.dataset.focusIndex;return}
    shell.querySelector('.question').textContent='What Character?';
    cards=list.map((item)=>{const b=document.createElement('button');b.className='choice';b.dataset.characterId=item.id;b.setAttribute('aria-label',item.name);b.innerHTML='<strong class="choice-name"></strong><span class="choice-portrait"><img alt="" draggable="false"></span>';b.querySelector('.choice-name').textContent=item.name;b.querySelector('img').src=item.src;wheel.appendChild(b);return b});
    const startIndex=selected?Math.max(0,list.findIndex(item=>item.name===selected)):mode==='build'?Math.max(0,list.findIndex(item=>item.id==='augusta')):0;
    carousel=new FreewheelCarousel(wheel,{cards,startIndex,spacing,onActivate:(_card,i)=>{const name=list[i].name;if(shell.classList.contains('has-selection'))requestSwitch(name);else select(name)}});
  }
  function reset(){selected=null;pending=null;shell.classList.remove('has-selection','hover-expanded');delete shell.dataset.wasSelected;if(mode==='build'){document.getElementById('buildName').textContent='';const btn=document.getElementById('accountBtn');btn.textContent='Add to Account';btn.classList.remove('owned');btn.disabled=false}else document.getElementById('improveFocus').textContent='';closeDialog()}
  wheel.addEventListener('mouseenter',()=>{if(shell.classList.contains('has-selection')&&matchMedia('(hover:hover)').matches){clearTimeout(collapseTimer);shell.classList.add('hover-expanded');carousel?.paint()}});
  wheel.addEventListener('mouseleave',()=>{if(matchMedia('(hover:hover)').matches){clearTimeout(collapseTimer);collapseTimer=setTimeout(()=>{shell.classList.remove('hover-expanded');carousel?.paint()},320)}});
  return{render,reset,select,repaint(){carousel?.paint()},get selected(){return selected},get pending(){return pending},confirm(){if(pending){autosave(selected,{lastLeftAt:new Date().toISOString()});select(pending)}closeDialog()},closeDialog}
}

const buildPicker=makePicker({shellId:'buildShell',wheelId:'buildWheel',items:()=>releasedCharacters,mode:'build'});
const improvePicker=makePicker({shellId:'improveShell',wheelId:'improveWheel',items:()=>state.characters.map(name=>characterByName.get(name)).filter(Boolean),mode:'improve'});
document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>{if(buildPicker.selected)autosave(buildPicker.selected,{lastLeftAt:new Date().toISOString()});if(improvePicker.selected)autosave(improvePicker.selected,{lastLeftImproveAt:new Date().toISOString()});show('home')});
document.getElementById('accountBtn').onclick=()=>{const n=buildPicker.selected;if(!n||owned(n))return;addOwned(n);const b=document.getElementById('accountBtn');b.textContent='On Account';b.classList.add('owned');b.disabled=true};
document.getElementById('cancelSwitch').onclick=()=>{buildPicker.closeDialog();improvePicker.closeDialog()};
document.getElementById('confirmSwitch').onclick=()=>{if(buildPicker.pending)buildPicker.confirm();else improvePicker.confirm()};
window.addEventListener('resize',()=>{buildPicker.repaint();improvePicker.repaint()});
renderHome();
</script>
</body>
</html>
