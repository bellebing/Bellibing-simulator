d .wheel{--cw:138px;--ch:194px;height:232px}.picker-shell.hover-expanded .choice{border-radius:16px}.picker-shell.hover-expanded .choice::before{inset:14px 12px 48px;border-radius:12px;content:"TEMP"}.picker-shell.hover-expanded .choice span{bottom:13px;font-size:16px;color:#fff}.build-stage{visibility:hidden;opacity:0;pointer-events:none;position:absolute;inset:0;z-index:2}.picker-shell.has-selection .build-stage{visibility:visible;opacity:1}.focus{position:absolute;left:50%;top:50%;transform:translate(-50%,-43%);width:min(540px,45vw);height:min(590px,60vh);display:flex;flex-direction:column;align-items:center;justify-content:center}.focus h1{margin:0 0 8px;font-family:var(--font-display);font-size:48px}.focus-art{width:100%;flex:1;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 48%,rgba(255,165,70,.10),transparent 60%);color:#6b4a34;font-size:12px;letter-spacing:.18em}.side-left{position:absolute;left:max(5vw,48px);top:50%;width:min(290px,23vw);height:min(540px,58vh);transform:translate(-70px,-43%);opacity:0;display:flex;flex-direction:column;justify-content:space-between;gap:22px;pointer-events:auto}.picker-shell.has-selection .side-left{opacity:1;transform:translate(0,-43%);transition:opacity .48s ease .14s,transform .78s cubic-bezier(.16,.84,.24,1) .14s}.block h2,.echoes h2,.seq h2{margin:0 0 12px;font-family:var(--font-display);font-size:23px}.stats-box{height:255px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.02);padding:18px;display:flex;flex-direction:column;justify-content:center;gap:20px}.statline{height:11px;border-radius:99px;background:rgba(255,255,255,.06)}.weapon{height:108px;width:100%;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.02);color:#777;font-size:28px}.echoes{position:absolute;right:max(5vw,48px);top:50%;width:98px;transform:translate(70px,-43%);opacity:0;pointer-events:auto}.picker-shell.has-selection .echoes{opacity:1;transform:translate(0,-43%);transition:opacity .48s ease .2s,transform .78s cubic-bezier(.16,.84,.24,1) .2s}.echo-stack{display:grid;gap:10px}.echo{aspect-ratio:1;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.02);color:#777;font-size:24px}.seq{position:absolute;left:clamp(340px,31vw,470px);top:50%;width:88px;transform:translate(-55px,-40%);opacity:0;pointer-events:auto}.picker-shell.has-selection .seq{opacity:1;transform:translate(0,-40%);transition:opacity .46s ease .18s,transform .76s cubic-bezier(.16,.84,.24,1) .18s}.seq h2{text-align:center;font-size:18px}.seq-line{position:relative;height:360px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}.seq-line::before{content:"";position:absolute;top:28px;bottom:20px;left:50%;width:1px;background:rgba(255,255,255,.11)}.node{position:relative;z-index:1;display:grid;place-items:center;aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.13);background:#14171d;color:#89919a;font-size:10px}.n1{width:34px}.n2{width:38px}.n3{width:42px}.n4{width:47px}.n5{width:52px}.n6{width:58px}.account{position:absolute;right:24px;bottom:20px;border:1px solid #eee;border-radius:13px;background:#eee;color:#08090b;padding:13px 18px;font-weight:800;pointer-events:auto}.account.owned{background:#171a20;color:#7e858e;border-color:var(--line)}.dialog-bg{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.68);display:none;place-items:center}.dialog-bg.open{display:grid}.dialog{width:min(390px,calc(100vw - 32px));padding:26px;border:1px solid var(--line);border-radius:20px;background:#11141a;text-align:center}.dialog h2{margin:0 0 8px}.dialog-actions{display:flex;justify-content:center;gap:10px;margin-top:20px}.dialog button{padding:11px 16px;border-radius:11px;border:1px solid var(--line);background:#191d24;color:#fff}.dialog .primary{background:#eee;color:#08090b}.team-placeholder{position:absolute;font-family:var(--font-display);inset:0;display:grid;place-items:center;font-size:52px}.improv <script>
const KEY='bellibing-ui-checkpoint-v34';
const LEGACY_STATE_KEY_BY_NAME={'The Shorekeeper':'Shorekeeper'};
let CHARACTERS=[];
let characterLoadError=null;
let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}}
state={characters:Array.isArray(state.characters)?state.characters:[],drafts:state.drafts&&typeof state.drafts==='object'?state.drafts:{}};
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
function draft(key){if(!state.drafts[key]){state.drafts[key]={character:key,build:{},createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};save()}return state.drafts[key]}
function autosave(key,patch={}){if(!key)return;const d=draft(key);d.build={...d.build,...patch};d.updatedAt=new Date().toISOString();save()}
const owned=key=>state.characters.includes(key);
function addOwned(key){draft(key);if(!owned(key))state.characters.push(key);state.drafts[key].addedToAccountAt=state.drafts[key].addedToAccountAt||new Date().toISOString();save()}
const clamp=(value,min,max)=>Math.max(min,Math.min(max,value));
const toAssetPath=targetPath=>String(targetPath||'').replace(/^docs\/ui-prototypes\//,'');
const roverName=id=>'Rover ('+id.replace(/^rover-/,'').replace(/^./,c=>c.toUpperCase())+')';
function stateKeyForName(name){return LEGACY_STATE_KEY_BY_NAME[name]||name}
function characterByStateKey(key){return CHARACTERS.find(item=>item.stateKey===key)||null}
async function loadReleasedCharacters(){
  const response=await fetch('assets/characters/portraits/manifest.json',{cache:'no-store'});
  if(!response.ok)throw new Error('portrait manifest HTTP '+response.status);
  const manifest=await response.json();
  const direct=(manifest.portraits||[])
    .filter(item=>item.releaseStatus==='RELEASED'&&item.uiEligible===true)
    .map(item=>({id:item.characterId,name:item.characterName,src:toAssetPath(item.targetPath)}));
  const rovers=(manifest.roverPortraits||[])
    .map(item=>({id:item.characterId,name:roverName(item.characterId),src:toAssetPath(item.targetPath)}));
  const characters=[...direct,...rovers]
    .map(item=>({...item,stateKey:stateKeyForName(item.name)}))
    .sort((a,b)=>a.name.localeCompare(b.name,'en'));
  if(characters.length!==57)throw new Error('expected 57 released Character cards, got '+characters.length);
  for(const forbidden of ['Jingran','Hsin','Suoming']){
    if(characters.some(item=>item.name===forbidden))throw new Error(forbidden+' must not be in released selector');
  }
  CHARACTERS=characters;
}
class FreewheelCarousel{
  constructor(viewport,options={}){
    this.viewport=viewport;this.options=options;this.cards=[];this.pos=0;this.index=0;this.max=0;this.pointer=null;this.lastX=0;this.lastT=0;this.velocity=0;this.travel=0;this.suppressUntil=0;this.raf=0;this.reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;this.bind();
  }
  spacing(){const raw=typeof this.options.spacing==='function'?this.options.spacing():this.options.spacing;return Math.max(1,Number(raw)||260)}
  replaceCards(cards,start=0){this.stop();this.cards=[...cards];this.max=Math.max(0,this.cards.length-1);this.pos=clamp(Number(start)||0,0,this.max);this.index=Math.round(this.pos);this.paint()}
  paint(){
    if(!this.cards.length){this.options.onStatus?.(0,0);return}
    const spacing=this.spacing();
    this.cards.forEach((card,i)=>{
      const distance=i-this.pos,abs=Math.abs(distance);
      const scale=this.options.scale?this.options.scale(abs):Math.max(.7,1.07-abs*.16);
      const opacity=this.options.opacity?this.options.opacity(abs):Math.max(.18,1-abs*.22);
      card.style.setProperty('--x',(distance*spacing)+'px');
      card.style.setProperty('--s',String(scale));
      card.style.setProperty('--o',String(opacity));
      card.style.zIndex=String(30-Math.round(abs*5));
    });
    this.index=clamp(Math.round(this.pos),0,this.max);
    this.options.onStatus?.(this.index,this.cards.length);
  }
  stop(){if(this.raf)cancelAnimationFrame(this.raf);this.raf=0}
  animateTo(target,initialVelocity=0){
    this.stop();target=clamp(target,0,this.max);
    if(this.reduced){this.pos=target;this.paint();return}
    const from=this.pos,distance=Math.abs(target-from),speedBoost=Math.min(120,Math.abs(initialVelocity)*18000);
    const duration=clamp(330+distance*88+speedBoost,300,650),start=performance.now(),ease=t=>1-Math.pow(1-t,4);
    const tick=now=>{const t=Math.min(1,(now-start)/duration);this.pos=from+(target-from)*ease(t);this.paint();if(t<1)this.raf=requestAnimationFrame(tick);else{this.raf=0;this.pos=target;this.paint()}};
    this.raf=requestAnimationFrame(tick);
  }
  setIndex(target,animate=true){target=clamp(target,0,this.max);if(animate)this.animateTo(target);else{this.stop();this.pos=target;this.paint()}}
  release(){const projected=this.pos+this.velocity*260,target=Math.round(clamp(projected,0,this.max));this.animateTo(target,this.velocity)}
  bind(){
    this.viewport.addEventListener('pointerdown',event=>{
      if(event.button!==undefined&&event.button!==0)return;
      this.stop();this.pointer=event.pointerId;this.viewport.setPointerCapture?.(event.pointerId);this.lastX=event.clientX;this.lastT=performance.now();this.velocity=0;this.travel=0;this.viewport.classList.add('dragging');
    });
    this.viewport.addEventListener('pointermove',event=>{
      if(event.pointerId!==this.pointer)return;
      const now=performance.now(),dx=event.clientX-this.lastX,dt=Math.max(8,now-this.lastT),step=-dx/this.spacing();
      this.pos=clamp(this.pos+step,-1.25,this.max+1.25);
      const instant=step/dt;this.velocity=this.velocity*.68+instant*.32;this.travel+=Math.abs(dx);this.lastX=event.clientX;this.lastT=now;this.paint();
    });
    const end=event=>{
      if(event.pointerId!==this.pointer)return;
      this.pointer=null;this.viewport.classList.remove('dragging');
      if(this.travel>6){this.suppressUntil=performance.now()+240;this.release()}else this.animateTo(Math.round(clamp(this.pos,0,this.max)));
    };
    this.viewport.addEventListener('pointerup',end);this.viewport.addEventListener('pointercancel',end);
    this.viewport.addEventListener('click',event=>{
      const card=event.target.closest('button');
      const i=this.cards.indexOf(card);
      if(i<0)return;
      if(performance.now()<this.suppressUntil){event.preventDefault();return}
      if(i===this.index&&Math.abs(this.pos-i)<.06)this.options.onActivate?.(card,i);
      else this.animateTo(i);
    });
    this.viewport.addEventListener('keydown',event=>{
      if(event.key==='ArrowLeft'){event.preventDefault();this.animateTo(this.index-1)}
      if(event.key==='ArrowRight'){event.preventDefault();this.animateTo(this.index+1)}
    });
    this.viewport.addEventListener('wheel',event=>{
      if(this.options.wheel===false)return;
      if(Math.abs(event.deltaY)<4&&Math.abs(event.deltaX)<4)return;
      event.preventDefault();
      const delta=Math.abs(event.deltaX)>Math.abs(event.deltaY)?event.deltaX:event.deltaY;
      this.animateTo(this.index+(delta>0?1:-1));
    },{passive:false});
    addEventListener('resize',()=>this.paint());
  }
}
function show(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));
  if(id==='home')renderHome();
  if(id==='build'){buildPicker.reset();buildPicker.render()}
  if(id==='improve'){improvePicker.reset();improvePicker.render()}
}
let majorBusy=false;
function major(target,card){
  if(majorBusy)return;
  majorBusy=true;
  const home=document.querySelector('#home');card.classList.add('major-source');home.classList.add('home-leaving');
  setTimeout(()=>{
    const dest=document.getElementById(target);dest.classList.add('major-enter');show(target);
    requestAnimationFrame(()=>requestAnimationFrame(()=>dest.classList.add('go')));
    setTimeout(()=>{dest.classList.remove('major-enter','go');home.classList.remove('home-leaving');card.classList.remove('major-source');majorBusy=false},650);
  },360);
}
let homeCarousel=null;
function renderHome(){
  if(homeCarousel){homeCarousel.paint();return}
  const items=[
    {title:'Build a Character',target:'build',className:'card-build',src:'assets/v34/bellibing-ui-build-character-rover.webp'},
    {title:'Improve a Character',target:'improve',className:'card-improve',src:'assets/v34/bellibing-ui-improve-character-augusta.webp'},
    {title:'Build a Team',target:'team',className:'card-team',src:'assets/v34/bellibing-ui-build-team.webp'}
  ];
  const stage=document.querySelector('#homeStage');stage.innerHTML='';
  const cards=items.map(item=>{
    const button=document.createElement('button');button.className='home-card '+item.className;button.dataset.target=item.target;button.setAttribute('aria-label',item.title);
    const art=document.createElement('div');art.className='home-card-art';const image=document.createElement('img');image.src=item.src;image.alt='';image.draggable=false;art.appendChild(image);
    const title=document.createElement('strong');title.className='home-card-title';title.textContent=item.title;button.append(art,title);stage.appendChild(button);return button;
  });
  homeCarousel=new FreewheelCarousel(stage,{
    spacing:()=>{const width=stage.getBoundingClientRect().width;return width<520?238:width<900?270:318},
    scale:abs=>Math.max(.72,1.075-abs*.17),
    opacity:()=>1,
    onActivate:(card,index)=>major(items[index].target,card),
    onStatus:(index,total)=>{stage.dataset.focus=String(index+1);stage.dataset.total=String(total)}
  });
  homeCarousel.replaceCards(cards,1);
}
function makePicker({shellId,wheelId,items,mode}){
  const shell=document.getElementById(shellId),wheel=document.getElementById(wheelId);
  let list=[],cards=[],selected=null,pending=null,collapseTimer=null;
  const carousel=new FreewheelCarousel(wheel,{
    spacing:()=>{if(shell.classList.contains('hover-expanded'))return 126;if(shell.classList.contains('has-selection'))return 98;return shell.getBoundingClientRect().width<700?200:228},
    scale:abs=>Math.max(.7,1.07-abs*.16),
    opacity:abs=>Math.max(.18,1-abs*.22),
    onActivate:(card,index)=>{const item=list[index];if(!item)return;if(shell.classList.contains('has-selection'))requestSwitch(item);else select(item)},
    onStatus:(index,total)=>{wheel.dataset.focus=String(index+1);wheel.dataset.total=String(total)}
  });
  function source(){return typeof items==='function'?items():items}
  function itemFromStateKey(key){return characterByStateKey(key)||{id:'legacy-'+String(key).toLowerCase().replace(/[^a-z0-9]+/g,'-'),name:key,stateKey:key,src:null}}
  function select(item){
    if(!item)return;
    const key=item.stateKey;
    if(mode==='build'){
      draft(key);autosave(key,{lastOpenedAt:new Date().toISOString()});document.getElementById('buildName').textContent=item.name;
      const btn=document.getElementById('accountBtn');btn.textContent=owned(key)?'On Account':'Add to Account';btn.classList.toggle('owned',owned(key));btn.disabled=owned(key);
    }else{
      document.getElementById('improveFocus').textContent=item.name;autosave(key,{lastImprovedAt:new Date().toISOString()});
    }
    selected=item;
    const index=list.indexOf(item);if(index>=0)carousel.setIndex(index,false);
    const before=wheel.getBoundingClientRect();shell.classList.add('has-selection');shell.classList.remove('hover-expanded');const after=wheel.getBoundingClientRect();const dy=before.top-after.top;
    if(!shell.dataset.wasSelected){
      shell.dataset.wasSelected='1';
      const animation=wheel.animate([{transform:'translateY('+dy+'px)'},{transform:'translateY(0)'}],{duration:360,easing:'cubic-bezier(.16,.84,.24,1)'});
      animation.onfinish=()=>animation.cancel();
    }
    carousel.paint();
  }
  function requestSwitch(item){
    if(selected&&item.stateKey===selected.stateKey)return;
    pending=item;document.getElementById('dialogCopy').textContent='Switch to '+item.name+'?';document.getElementById('dialogBg').classList.add('open');
  }
  function closeDialog(){pending=null;document.getElementById('dialogBg').classList.remove('open')}
  function render(){
    list=mode==='improve'?[...state.characters].map(itemFromStateKey):source();
    wheel.innerHTML='';cards=[];
    if(!list.length){shell.querySelector('.question').textContent=characterLoadError?'Character manifest unavailable':'No Characters yet';carousel.replaceCards([],0);return}
    shell.querySelector('.question').textContent='What Character?';
    cards=list.map(item=>{
      const button=document.createElement('button');button.className='choice';button.dataset.characterId=item.id;button.setAttribute('aria-label',item.name);
      const name=document.createElement('strong');name.className='choice-name';name.textContent=item.name;
      const portrait=document.createElement('span');portrait.className='choice-portrait'+(item.src?'':' placeholder');
      if(item.src){const image=document.createElement('img');image.src=item.src;image.alt='';image.draggable=false;portrait.appendChild(image)}else portrait.textContent='PORTRAIT';
      button.append(name,portrait);wheel.appendChild(button);return button;
    });
    let start=0;
    if(selected){const found=list.findIndex(item=>item.stateKey===selected.stateKey);if(found>=0)start=found}
    else if(mode==='build'){const augusta=list.findIndex(item=>item.id==='augusta');start=augusta>=0?augusta:Math.min(3,list.length-1)}
    carousel.replaceCards(cards,start);
  }
  function reset(){
    selected=null;pending=null;shell.classList.remove('has-selection','hover-expanded');delete shell.dataset.wasSelected;
    if(mode==='build'){document.getElementById('buildName').textContent='';const btn=document.getElementById('accountBtn');btn.textContent='Add to Account';btn.classList.remove('owned');btn.disabled=false}
    else document.getElementById('improveFocus').textContent='';
    closeDialog();
  }
  wheel.addEventListener('mouseenter',()=>{if(shell.classList.contains('has-selection')&&matchMedia('(hover:hover)').matches){clearTimeout(collapseTimer);shell.classList.add('hover-expanded');carousel.paint()}});
  wheel.addEventListener('mouseleave',()=>{if(matchMedia('(hover:hover)').matches){clearTimeout(collapseTimer);collapseTimer=setTimeout(()=>{shell.classList.remove('hover-expanded');carousel.paint()},320)}});
  return{
    render,reset,select,get selected(){return selected},get pending(){return pending},
    confirm(){if(pending){if(selected)autosave(selected.stateKey,{lastLeftAt:new Date().toISOString()});select(pending)}closeDialog()},
    closeDialog,paint:()=>carousel.paint()
  };
}
const buildPicker=makePicker({shellId:'buildShell',wheelId:'buildWheel',items:()=>CHARACTERS,mode:'build'});
const improvePicker=makePicker({shellId:'improveShell',wheelId:'improveWheel',items:()=>state.characters.map(key=>characterByStateKey(key)).filter(Boolean),mode:'improve'});
document.querySelectorAll('[data-home]').forEach(button=>button.onclick=()=>{
  if(buildPicker.selected)autosave(buildPicker.selected.stateKey,{lastLeftAt:new Date().toISOString()});
  if(improvePicker.selected)autosave(improvePicker.selected.stateKey,{lastLeftImproveAt:new Date().toISOString()});
  show('home');
});
document.getElementById('accountBtn').onclick=()=>{
  const item=buildPicker.selected;if(!item||owned(item.stateKey))return;addOwned(item.stateKey);
  const button=document.getElementById('accountBtn');button.textContent='On Account';button.classList.add('owned');button.disabled=true;
};
document.getElementById('cancelSwitch').onclick=()=>{buildPicker.closeDialog();improvePicker.closeDialog()};
document.getElementById('confirmSwitch').onclick=()=>{if(buildPicker.pending)buildPicker.confirm();else improvePicker.confirm()};
window.addEventListener('resize',()=>{homeCarousel?.paint();buildPicker.paint();improvePicker.paint()});
(async()=>{
  try{await loadReleasedCharacters()}catch(error){characterLoadError=error;console.error(error)}
  renderHome();
})();
</script>
</body>
